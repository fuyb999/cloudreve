# Cloudreve 的 Docker Swarm 生产部署模板。
# 这里遵循 Cloudreve 官方建议：
# 1. Cloudreve 必须放在反向代理后面。
# 2. 从节点必须和主节点使用相同版本。
# 3. 主站 Site URL 必须能被从节点访问到。
# 4. 如果某个从节点参与存储策略，它的访问地址也必须能被终端用户访问到。
#
# 重要说明：
# - PostgreSQL 和 Redis 不能使用共享存储。每个副本都必须有自己独立的数据目录。
# - 不要把 PGDATA / Redis AOF / RDB 放在 MinIO、NFS、CephFS 或任何共享文件系统上。
# - MinIO 用来放 Cloudreve 用户文件，对 PostgreSQL / Redis 运行数据并不合适。
# - PostgreSQL / Redis 默认使用宿主机 bind mount，部署前要先在固定节点创建好目录。
# - 所有数据/运行目录挂载都统一支持 `*_MOUNT_TYPE + *_MOUNT_SOURCE` 写法。
# - 对 PostgreSQL / Redis，默认值仍然是宿主机绝对路径，生产建议不要改回命名卷。
# - Cloudreve 运行目录默认还是命名卷，用户文件默认应落到 S3 兼容对象存储。
# - `cloudreve-master` 可以通过 `CR_INIT_*` 在首次初始化时直接创建默认 S3 存储策略。
# - Tika 自定义字体也直接使用 `TIKA_CUSTOM_FONTS_MOUNT_TYPE + TIKA_CUSTOM_FONTS_MOUNT_SOURCE` 控制。
# - PostgreSQL / Redis 这几个实例是固定有状态角色，不要用 `docker service scale` 直接扩容。
# - 默认 `TIKA_IMAGE` 现在使用 `cloudreve/tika:3.2.3.0-full-unrar-charset`。
# - 生产里更推荐把自定义镜像先 push 到单点 `registry:2` 私有仓库，再让其它节点远程拉取。
# - 私有仓库本身建议单独使用 `docker-compose.swarm.registry.yml` 部署，不和主业务栈混在一起。

services:
  cloudreve-master:
    image: ${CLOUDREVE_IMAGE:-cloudreve/cloudreve:4.15.0}
    hostname: "{{.Node.Hostname}}-cr-master-{{.Task.Slot}}"
    environment:
      CR_CONF_System.Mode: master
      CR_CONF_System.Listen: ":5212"
      CR_CONF_System.ProxyHeader: X-Forwarded-For
      CR_CONF_System.SessionSecret: ${CLOUDREVE_SESSION_SECRET:?set CLOUDREVE_SESSION_SECRET}
      CR_CONF_Database.Type: postgres
      CR_CONF_Database.Host: pgpool
      CR_CONF_Database.Port: "5432"
      CR_CONF_Database.User: ${POSTGRESQL_USERNAME:-cloudreve}
      CR_CONF_Database.Password: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
      CR_CONF_Database.Name: ${POSTGRESQL_DATABASE:-cloudreve}
      CR_CONF_Redis.Server: redis-proxy:6379
      CR_CONF_Redis.Password: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      CR_CONF_Kafka.Enabled: ${CLOUDREVE_GLOBAL_KAFKA_ENABLED:-false}
      CR_CONF_Kafka.Brokers: ${CLOUDREVE_GLOBAL_KAFKA_BROKERS:-kafka:9092}
      CR_CONF_Kafka.Version: ${CLOUDREVE_GLOBAL_KAFKA_VERSION:-3.7.0}
      CR_CONF_Kafka.ClientID: ${CLOUDREVE_GLOBAL_KAFKA_CLIENT_ID:-cloudreve}
      CR_CONF_Kafka.SecurityProtocol: ${CLOUDREVE_GLOBAL_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      CR_SETTING_DEFAULT_siteURL: ${CLOUDREVE_SITE_URL:?set CLOUDREVE_SITE_URL}
      CR_INIT_DEFAULT_STORAGE: ${CR_INIT_DEFAULT_STORAGE:-s3}
      CR_INIT_S3_ENDPOINT: ${CR_INIT_S3_ENDPOINT:-http://minio:9000}
      CR_INIT_S3_BUCKET: ${CR_INIT_S3_BUCKET:-cloudreve}
      CR_INIT_S3_ACCESS_KEY: ${CR_INIT_S3_ACCESS_KEY:-minio}
      CR_INIT_S3_SECRET_KEY: ${CR_INIT_S3_SECRET_KEY:?set CR_INIT_S3_SECRET_KEY}
      CR_INIT_S3_REGION: ${CR_INIT_S3_REGION:-us-east-1}
      CR_INIT_S3_FORCE_PATH_STYLE: ${CR_INIT_S3_FORCE_PATH_STYLE:-true}
      CR_INIT_S3_RELAY: ${CR_INIT_S3_RELAY:-true}
      CR_INIT_S3_INTERNAL_PROXY: ${CR_INIT_S3_INTERNAL_PROXY:-true}
      CR_INIT_S3_IS_PRIVATE: ${CR_INIT_S3_IS_PRIVATE:-true}
      CR_INIT_S3_CHUNK_SIZE: ${CR_INIT_S3_CHUNK_SIZE:-26214400}
    volumes:
      - type: ${CLOUDREVE_MASTER_RUNTIME_MOUNT_TYPE:-volume}
        source: ${CLOUDREVE_MASTER_RUNTIME_MOUNT_SOURCE:-cloudreve_master_runtime}
        target: /cloudreve/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5212/api/v4/site/ping >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      replicas: ${CLOUDREVE_MASTER_REPLICAS:-1}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 2m
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${CLOUDREVE_MASTER_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${CLOUDREVE_MASTER_CPU_RESERVATION:-1.0}"
          memory: "${CLOUDREVE_MASTER_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${CLOUDREVE_MASTER_CPU_LIMIT:-2.0}"
          memory: "${CLOUDREVE_MASTER_MEM_LIMIT:-4G}"

  cloudreve-master-proxy:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    hostname: "{{.Node.Hostname}}-cr-master-proxy-{{.Task.Slot}}"
    environment:
      SERVER_NAME: ${CLOUDREVE_MASTER_SERVER_NAME:-_}
      UPSTREAM_SERVICE: cloudreve-master:5212
      CLIENT_MAX_BODY_SIZE: ${CLOUDREVE_MASTER_CLIENT_MAX_BODY_SIZE:-0}
      PROXY_READ_TIMEOUT: ${CLOUDREVE_MASTER_PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${CLOUDREVE_MASTER_PROXY_SEND_TIMEOUT:-3600s}
    configs:
      - source: cloudreve_proxy_template_v2
        target: /etc/nginx/templates/default.conf.template
        mode: 0444
    ports:
      - target: 80
        published: ${CLOUDREVE_MASTER_HTTP_PORT:-80}
        protocol: tcp
        mode: ingress
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: ${CLOUDREVE_MASTER_PROXY_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 2m
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${CLOUDREVE_MASTER_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${CLOUDREVE_MASTER_PROXY_CPU_RESERVATION:-0.25}"
          memory: "${CLOUDREVE_MASTER_PROXY_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${CLOUDREVE_MASTER_PROXY_CPU_LIMIT:-1.0}"
          memory: "${CLOUDREVE_MASTER_PROXY_MEM_LIMIT:-512M}"

  cloudreve-slave:
    image: ${CLOUDREVE_SLAVE_IMAGE:-cloudreve/cloudreve:4.15.0}
    hostname: "{{.Node.Hostname}}-cr-slave-{{.Task.Slot}}"
    environment:
      CR_CONF_System.Mode: slave
      CR_CONF_System.Listen: ":5212"
      CR_CONF_System.ProxyHeader: X-Forwarded-For
      CR_CONF_Slave.Secret: ${CLOUDREVE_SLAVE_SECRET:?set CLOUDREVE_SLAVE_SECRET}
      CR_CONF_CORS.AllowOrigins: "*"
      CR_CONF_CORS.AllowMethods: OPTIONS,GET,POST
      CR_CONF_CORS.AllowHeaders: "*"
      CR_CONF_Kafka.Enabled: ${CLOUDREVE_GLOBAL_KAFKA_ENABLED:-false}
      CR_CONF_Kafka.Brokers: ${CLOUDREVE_GLOBAL_KAFKA_BROKERS:-kafka:9092}
      CR_CONF_Kafka.Version: ${CLOUDREVE_GLOBAL_KAFKA_VERSION:-3.7.0}
      CR_CONF_Kafka.ClientID: ${CLOUDREVE_GLOBAL_KAFKA_CLIENT_ID:-cloudreve}
      CR_CONF_Kafka.SecurityProtocol: ${CLOUDREVE_GLOBAL_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
    volumes:
      - type: ${CLOUDREVE_SLAVE_RUNTIME_MOUNT_TYPE:-volume}
        source: ${CLOUDREVE_SLAVE_RUNTIME_MOUNT_SOURCE:-cloudreve_slave_runtime}
        target: /cloudreve/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --post-data='{}' http://127.0.0.1:5212/api/v4/slave/ping >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      replicas: ${CLOUDREVE_SLAVE_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 2m
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${CLOUDREVE_SLAVE_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${CLOUDREVE_SLAVE_CPU_RESERVATION:-0.5}"
          memory: "${CLOUDREVE_SLAVE_MEM_RESERVATION:-1G}"
        limits:
          cpus: "${CLOUDREVE_SLAVE_CPU_LIMIT:-1.5}"
          memory: "${CLOUDREVE_SLAVE_MEM_LIMIT:-2G}"

  cloudreve-slave-proxy:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    hostname: "{{.Node.Hostname}}-cr-slave-proxy-{{.Task.Slot}}"
    environment:
      SERVER_NAME: ${CLOUDREVE_SLAVE_SERVER_NAME:-_}
      UPSTREAM_SERVICE: cloudreve-slave:5212
      CLIENT_MAX_BODY_SIZE: ${CLOUDREVE_SLAVE_CLIENT_MAX_BODY_SIZE:-0}
      PROXY_READ_TIMEOUT: ${CLOUDREVE_SLAVE_PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${CLOUDREVE_SLAVE_PROXY_SEND_TIMEOUT:-3600s}
    configs:
      - source: cloudreve_proxy_template_v2
        target: /etc/nginx/templates/default.conf.template
        mode: 0444
    ports:
      - target: 80
        published: ${CLOUDREVE_SLAVE_HTTP_PORT:-5213}
        protocol: tcp
        mode: ingress
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: ${CLOUDREVE_SLAVE_PROXY_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 2m
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${CLOUDREVE_SLAVE_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${CLOUDREVE_SLAVE_PROXY_CPU_RESERVATION:-0.25}"
          memory: "${CLOUDREVE_SLAVE_PROXY_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${CLOUDREVE_SLAVE_PROXY_CPU_LIMIT:-1.0}"
          memory: "${CLOUDREVE_SLAVE_PROXY_MEM_LIMIT:-512M}"

  postgresql-1:
    image: ${POSTGRESQL_REPMGR_IMAGE:-bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2}
    hostname: "{{.Node.Hostname}}-pg1"
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: ${POSTGRESQL_POSTGRES_PASSWORD:?set POSTGRESQL_POSTGRES_PASSWORD}
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE:-cloudreve}
      POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: ${POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS:-1}
      REPMGR_PASSWORD: ${REPMGR_PASSWORD:?set REPMGR_PASSWORD}
      REPMGR_PRIMARY_HOST: ${REPMGR_PRIMARY_HOST:-postgresql-1}
      REPMGR_PARTNER_NODES: ${REPMGR_PARTNER_NODES:-postgresql-1,postgresql-2,postgresql-3}
      REPMGR_NODE_NAME: postgresql-1
      REPMGR_NODE_NETWORK_NAME: postgresql-1
      REPMGR_ADVERTISE_HOST: postgresql-1
      REPMGR_NODE_ID: "1"
      REPMGR_LOG_LEVEL: NOTICE
    configs:
      - source: postgresql_repmgr_run_v4
        target: /opt/bitnami/scripts/postgresql-repmgr/run.sh
        mode: 0555
    volumes:
      - type: ${PG_1_DATA_MOUNT_TYPE:-bind}
        source: ${PG_1_DATA_MOUNT_SOURCE:?set PG_1_DATA_MOUNT_SOURCE}
        target: /bitnami/postgresql
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRESQL_USERNAME:-cloudreve} -d ${POSTGRESQL_DATABASE:-cloudreve} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 2m
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 2m
      placement:
        constraints:
          - ${PG_NODE_1_CONSTRAINT:-node.labels.cloudreve.pg1==true}
      resources:
        reservations:
          cpus: "${POSTGRESQL_CPU_RESERVATION:-2.0}"
          memory: "${POSTGRESQL_MEM_RESERVATION:-4G}"
        limits:
          cpus: "${POSTGRESQL_CPU_LIMIT:-4.0}"
          memory: "${POSTGRESQL_MEM_LIMIT:-8G}"

  postgresql-2:
    image: ${POSTGRESQL_REPMGR_IMAGE:-bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2}
    hostname: "{{.Node.Hostname}}-pg2"
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: ${POSTGRESQL_POSTGRES_PASSWORD:?set POSTGRESQL_POSTGRES_PASSWORD}
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE:-cloudreve}
      POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: ${POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS:-1}
      REPMGR_PASSWORD: ${REPMGR_PASSWORD:?set REPMGR_PASSWORD}
      REPMGR_PRIMARY_HOST: ${REPMGR_PRIMARY_HOST:-postgresql-1}
      REPMGR_PARTNER_NODES: ${REPMGR_PARTNER_NODES:-postgresql-1,postgresql-2,postgresql-3}
      REPMGR_NODE_NAME: postgresql-2
      REPMGR_NODE_NETWORK_NAME: postgresql-2
      REPMGR_ADVERTISE_HOST: postgresql-2
      REPMGR_NODE_ID: "2"
      REPMGR_LOG_LEVEL: NOTICE
    configs:
      - source: postgresql_repmgr_run_v4
        target: /opt/bitnami/scripts/postgresql-repmgr/run.sh
        mode: 0555
    volumes:
      - type: ${PG_2_DATA_MOUNT_TYPE:-bind}
        source: ${PG_2_DATA_MOUNT_SOURCE:?set PG_2_DATA_MOUNT_SOURCE}
        target: /bitnami/postgresql
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRESQL_USERNAME:-cloudreve} -d ${POSTGRESQL_DATABASE:-cloudreve} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 2m
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 2m
      placement:
        constraints:
          - ${PG_NODE_2_CONSTRAINT:-node.labels.cloudreve.pg2==true}
      resources:
        reservations:
          cpus: "${POSTGRESQL_CPU_RESERVATION:-2.0}"
          memory: "${POSTGRESQL_MEM_RESERVATION:-4G}"
        limits:
          cpus: "${POSTGRESQL_CPU_LIMIT:-4.0}"
          memory: "${POSTGRESQL_MEM_LIMIT:-8G}"

  postgresql-3:
    image: ${POSTGRESQL_REPMGR_IMAGE:-bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2}
    hostname: "{{.Node.Hostname}}-pg3"
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: ${POSTGRESQL_POSTGRES_PASSWORD:?set POSTGRESQL_POSTGRES_PASSWORD}
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE:-cloudreve}
      POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: ${POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS:-1}
      REPMGR_PASSWORD: ${REPMGR_PASSWORD:?set REPMGR_PASSWORD}
      REPMGR_PRIMARY_HOST: ${REPMGR_PRIMARY_HOST:-postgresql-1}
      REPMGR_PARTNER_NODES: ${REPMGR_PARTNER_NODES:-postgresql-1,postgresql-2,postgresql-3}
      REPMGR_NODE_NAME: postgresql-3
      REPMGR_NODE_NETWORK_NAME: postgresql-3
      REPMGR_ADVERTISE_HOST: postgresql-3
      REPMGR_NODE_ID: "3"
      REPMGR_LOG_LEVEL: NOTICE
    configs:
      - source: postgresql_repmgr_run_v4
        target: /opt/bitnami/scripts/postgresql-repmgr/run.sh
        mode: 0555
    volumes:
      - type: ${PG_3_DATA_MOUNT_TYPE:-bind}
        source: ${PG_3_DATA_MOUNT_SOURCE:?set PG_3_DATA_MOUNT_SOURCE}
        target: /bitnami/postgresql
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRESQL_USERNAME:-cloudreve} -d ${POSTGRESQL_DATABASE:-cloudreve} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 2m
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 2m
      placement:
        constraints:
          - ${PG_NODE_3_CONSTRAINT:-node.labels.cloudreve.pg3==true}
      resources:
        reservations:
          cpus: "${POSTGRESQL_CPU_RESERVATION:-2.0}"
          memory: "${POSTGRESQL_MEM_RESERVATION:-4G}"
        limits:
          cpus: "${POSTGRESQL_CPU_LIMIT:-4.0}"
          memory: "${POSTGRESQL_MEM_LIMIT:-8G}"

  pgpool:
    image: ${PGPOOL_IMAGE:-bitnamilegacy/pgpool:4.6.3-debian-12-r0}
    hostname: "{{.Node.Hostname}}-pgpool-{{.Task.Slot}}"
    environment:
      PGPOOL_BACKEND_NODES: ${PGPOOL_BACKEND_NODES:-0:postgresql-1:5432,1:postgresql-2:5432,2:postgresql-3:5432}
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: ${POSTGRESQL_POSTGRES_PASSWORD:?set POSTGRESQL_POSTGRES_PASSWORD}
      PGPOOL_SR_CHECK_USER: ${POSTGRESQL_USERNAME:-cloudreve}
      PGPOOL_SR_CHECK_PASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
      PGPOOL_ENABLE_LOAD_BALANCING: "no"
      PGPOOL_ENABLE_POOL_HBA: "yes"
      PGPOOL_ADMIN_USERNAME: ${PGPOOL_ADMIN_USERNAME:-admin}
      PGPOOL_ADMIN_PASSWORD: ${PGPOOL_ADMIN_PASSWORD:?set PGPOOL_ADMIN_PASSWORD}
      PGPOOL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
      PGPOOL_PASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
    ports:
      - target: 5432
        published: ${PGPOOL_PUBLIC_PORT:-15432}
        protocol: tcp
        mode: ingress
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/pgpool/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 2m
    deploy:
      replicas: ${PGPOOL_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 2m
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${PGPOOL_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${PGPOOL_CPU_RESERVATION:-0.5}"
          memory: "${PGPOOL_MEM_RESERVATION:-512M}"
        limits:
          cpus: "${PGPOOL_CPU_LIMIT:-2.0}"
          memory: "${PGPOOL_MEM_LIMIT:-2G}"

  redis-1:
    image: ${REDIS_IMAGE:-bitnamilegacy/redis:8.2.1-debian-12-r0}
    hostname: "{{.Node.Hostname}}-redis1"
    environment:
      ALLOW_EMPTY_PASSWORD: "no"
      REDIS_AOF_ENABLED: ${REDIS_AOF_ENABLED:-yes}
      REDIS_REPLICATION_MODE: master
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - type: ${REDIS_1_DATA_MOUNT_TYPE:-bind}
        source: ${REDIS_1_DATA_MOUNT_SOURCE:?set REDIS_1_DATA_MOUNT_SOURCE}
        target: /bitnami/redis/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?set REDIS_PASSWORD} ping | grep PONG >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 2m
      placement:
        constraints:
          - ${REDIS_NODE_1_CONSTRAINT:-node.labels.cloudreve.redis1==true}
      resources:
        reservations:
          cpus: "${REDIS_CPU_RESERVATION:-1.0}"
          memory: "${REDIS_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${REDIS_CPU_LIMIT:-2.0}"
          memory: "${REDIS_MEM_LIMIT:-4G}"

  redis-2:
    image: ${REDIS_IMAGE:-bitnamilegacy/redis:8.2.1-debian-12-r0}
    hostname: "{{.Node.Hostname}}-redis2"
    environment:
      ALLOW_EMPTY_PASSWORD: "no"
      REDIS_AOF_ENABLED: ${REDIS_AOF_ENABLED:-yes}
      REDIS_REPLICATION_MODE: slave
      REDIS_MASTER_HOST: redis-1
      REDIS_MASTER_PORT_NUMBER: "6379"
      REDIS_MASTER_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - type: ${REDIS_2_DATA_MOUNT_TYPE:-bind}
        source: ${REDIS_2_DATA_MOUNT_SOURCE:?set REDIS_2_DATA_MOUNT_SOURCE}
        target: /bitnami/redis/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?set REDIS_PASSWORD} ping | grep PONG >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 2m
      placement:
        constraints:
          - ${REDIS_NODE_2_CONSTRAINT:-node.labels.cloudreve.redis2==true}
      resources:
        reservations:
          cpus: "${REDIS_CPU_RESERVATION:-1.0}"
          memory: "${REDIS_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${REDIS_CPU_LIMIT:-2.0}"
          memory: "${REDIS_MEM_LIMIT:-4G}"

  redis-3:
    image: ${REDIS_IMAGE:-bitnamilegacy/redis:8.2.1-debian-12-r0}
    hostname: "{{.Node.Hostname}}-redis3"
    environment:
      ALLOW_EMPTY_PASSWORD: "no"
      REDIS_AOF_ENABLED: ${REDIS_AOF_ENABLED:-yes}
      REDIS_REPLICATION_MODE: slave
      REDIS_MASTER_HOST: redis-1
      REDIS_MASTER_PORT_NUMBER: "6379"
      REDIS_MASTER_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - type: ${REDIS_3_DATA_MOUNT_TYPE:-bind}
        source: ${REDIS_3_DATA_MOUNT_SOURCE:?set REDIS_3_DATA_MOUNT_SOURCE}
        target: /bitnami/redis/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?set REDIS_PASSWORD} ping | grep PONG >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 2m
      placement:
        constraints:
          - ${REDIS_NODE_3_CONSTRAINT:-node.labels.cloudreve.redis3==true}
      resources:
        reservations:
          cpus: "${REDIS_CPU_RESERVATION:-1.0}"
          memory: "${REDIS_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${REDIS_CPU_LIMIT:-2.0}"
          memory: "${REDIS_MEM_LIMIT:-4G}"

  redis-sentinel:
    image: ${REDIS_SENTINEL_IMAGE:-bitnamilegacy/redis-sentinel:8.2.1-debian-12-r0}
    hostname: "{{.Node.Hostname}}-redis-sentinel-{{.Task.Slot}}"
    environment:
      REDIS_MASTER_HOST: redis-1
      REDIS_MASTER_PORT_NUMBER: "6379"
      REDIS_MASTER_SET: ${REDIS_SENTINEL_MASTER_SET:-mymaster}
      REDIS_MASTER_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_SENTINEL_QUORUM: ${REDIS_SENTINEL_QUORUM:-2}
      REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS: ${REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS:-5000}
      REDIS_SENTINEL_FAILOVER_TIMEOUT: ${REDIS_SENTINEL_FAILOVER_TIMEOUT:-10000}
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${REDIS_SENTINEL_REPLICAS:-3}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 2m
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${REDIS_SENTINEL_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${REDIS_SENTINEL_CPU_RESERVATION:-0.25}"
          memory: "${REDIS_SENTINEL_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${REDIS_SENTINEL_CPU_LIMIT:-1.0}"
          memory: "${REDIS_SENTINEL_MEM_LIMIT:-512M}"

  redis-proxy:
    image: ${REDIS_PROXY_IMAGE:-haproxy:3.0-alpine}
    hostname: "{{.Node.Hostname}}-redis-proxy-{{.Task.Slot}}"
    environment:
      REDIS_MASTER_HOST: ${REDIS_MASTER_HOST:-redis-1}
      REDIS_MASTER_PORT_NUMBER: ${REDIS_MASTER_PORT_NUMBER:-6379}
      REDIS_SENTINEL_HOST: ${REDIS_SENTINEL_HOST:-redis-sentinel}
      REDIS_SENTINEL_PORT_NUMBER: ${REDIS_SENTINEL_PORT_NUMBER:-26379}
      REDIS_MASTER_SET: ${REDIS_SENTINEL_MASTER_SET:-mymaster}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-proxy-bootstrap.sh"]
    configs:
      - source: redis_proxy_bootstrap_v7
        target: /usr/local/bin/redis-proxy-bootstrap.sh
        mode: 0555
    ports:
      - target: 6379
        published: ${REDIS_PROXY_PUBLIC_PORT:-16379}
        protocol: tcp
        mode: ingress
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${REDIS_PROXY_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 2m
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${REDIS_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${REDIS_PROXY_CPU_RESERVATION:-0.25}"
          memory: "${REDIS_PROXY_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${REDIS_PROXY_CPU_LIMIT:-1.0}"
          memory: "${REDIS_PROXY_MEM_LIMIT:-512M}"

  # swarm 集群模式开启时，这段单节点 MinIO 会被部署脚本剔除，
  # 再由 `docker-compose.swarm.cluster.yml` 提供同名代理入口和多节点后端。
  # swarm-cluster-strip:minio:begin
  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2024.10.2-debian-12-r0}
    hostname: "{{.Node.Hostname}}-minio"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_DISTRIBUTED_MODE_ENABLED: "no"
      MINIO_DATA_DIR: /bitnami/minio/data
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    entrypoint: ["/bin/bash", "/usr/local/bin/minio-swarm-entrypoint.sh"]
    configs:
      - source: minio_swarm_entrypoint_v1
        target: /usr/local/bin/minio-swarm-entrypoint.sh
        mode: 0555
    ports:
      - target: 9000
        published: ${MINIO_API_PORT:-9000}
        protocol: tcp
        mode: ingress
      - target: 9001
        published: ${MINIO_CONSOLE_PORT:-9001}
        protocol: tcp
        mode: ingress
    volumes:
      - type: ${MINIO_DATA_MOUNT_TYPE:-volume}
        source: ${MINIO_DATA_MOUNT_SOURCE:-minio_data}
        target: /bitnami/minio/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - ${MINIO_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${MINIO_CPU_RESERVATION:-1.0}"
          memory: "${MINIO_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${MINIO_CPU_LIMIT:-2.0}"
          memory: "${MINIO_MEM_LIMIT:-4G}"
  # swarm-cluster-strip:minio:end

  minio-init:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2024.10.2-debian-12-r0}
    hostname: "{{.Node.Hostname}}-minio-init-{{.Task.Slot}}"
    environment:
      MINIO_ENDPOINT: ${MINIO_INIT_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-cloudreve}
      MINIO_INIT_INTERVAL_SECONDS: ${MINIO_INIT_INTERVAL_SECONDS:-30}
    entrypoint: ["/bin/bash", "/usr/local/bin/minio-init.sh"]
    configs:
      - source: minio_init_v1
        target: /usr/local/bin/minio-init.sh
        mode: 0555
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${MINIO_INIT_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${MINIO_INIT_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${MINIO_INIT_CPU_RESERVATION:-0.05}"
          memory: "${MINIO_INIT_MEM_RESERVATION:-64M}"
        limits:
          cpus: "${MINIO_INIT_CPU_LIMIT:-0.25}"
          memory: "${MINIO_INIT_MEM_LIMIT:-128M}"

  # swarm 集群模式开启时，这段单节点 Elasticsearch 会被部署脚本剔除，
  # 再由 `docker-compose.swarm.cluster.yml` 提供同名代理入口和多节点后端。
  # swarm-cluster-strip:elasticsearch:begin
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-elasticsearch:8.12.2}
    hostname: "{{.Node.Hostname}}-elasticsearch"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "${ELASTICSEARCH_JAVA_OPTS:--Xms4g -Xmx4g}"
    ports:
      - target: 9200
        published: ${ELASTICSEARCH_HTTP_PORT:-9200}
        protocol: tcp
        mode: ingress
      - target: 9300
        published: ${ELASTICSEARCH_TRANSPORT_PORT:-9300}
        protocol: tcp
        mode: ingress
    volumes:
      - type: ${ELASTICSEARCH_DATA_MOUNT_TYPE:-volume}
        source: ${ELASTICSEARCH_DATA_MOUNT_SOURCE:-elasticsearch_data}
        target: /usr/share/elasticsearch/data
    networks:
      - cloudreve_backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - ${ELASTICSEARCH_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${ELASTICSEARCH_CPU_RESERVATION:-2.0}"
          memory: "${ELASTICSEARCH_MEM_RESERVATION:-4G}"
        limits:
          cpus: "${ELASTICSEARCH_CPU_LIMIT:-4.0}"
          memory: "${ELASTICSEARCH_MEM_LIMIT:-8G}"
  # swarm-cluster-strip:elasticsearch:end

  tika:
    image: ${TIKA_IMAGE:-cloudreve/tika:3.2.3.0-full-unrar-charset}
    hostname: "{{.Node.Hostname}}-tika-{{.Task.Slot}}"
    environment:
      TIKA_FONT_DIRS: ${TIKA_FONT_DIRS:-/tika-fonts/custom}
      TIKA_FONT_DEBUG: ${TIKA_FONT_DEBUG:-0}
    ports:
      - target: 9998
        published: ${TIKA_HTTP_PORT:-9998}
        protocol: tcp
        mode: ingress
    volumes:
      - type: ${TIKA_CUSTOM_FONTS_MOUNT_TYPE:-volume}
        source: ${TIKA_CUSTOM_FONTS_MOUNT_SOURCE:-tika_custom_fonts}
        target: /tika-fonts/custom
        read_only: true
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${TIKA_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 2m
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${TIKA_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${TIKA_CPU_RESERVATION:-0.5}"
          memory: "${TIKA_MEM_RESERVATION:-1G}"
        limits:
          cpus: "${TIKA_CPU_LIMIT:-2.0}"
          memory: "${TIKA_MEM_LIMIT:-2G}"

networks:
  cloudreve_backend:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: ${CLOUDREVE_BACKEND_SUBNET:-10.20.0.0/24}

volumes:
  postgresql_1_data:
  postgresql_2_data:
  postgresql_3_data:
  redis_1_data:
  redis_2_data:
  redis_3_data:
  cloudreve_master_runtime:
  cloudreve_slave_runtime:
  minio_data:
  elasticsearch_data:
  tika_custom_fonts:

configs:
  postgresql_repmgr_run_v4:
    file: ./docker/swarm/postgresql-repmgr-run.sh
  redis_proxy_bootstrap_v7:
    file: ./docker/swarm/redis-proxy-bootstrap.sh
  minio_swarm_entrypoint_v1:
    file: ./docker/swarm/minio-swarm-entrypoint.sh
  minio_init_v1:
    file: ./docker/swarm/minio-init.sh
  cloudreve_proxy_template_v2:
    file: ./docker/swarm/nginx/cloudreve-proxy.conf.template
