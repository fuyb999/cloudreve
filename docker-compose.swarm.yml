# Cloudreve 主从业务层 Swarm 模板。
# 这里遵循 Cloudreve 官方建议：
# 1. Cloudreve 必须放在反向代理后面。
# 2. 从节点必须和主节点使用相同版本。
# 3. 主站 Site URL 必须能被从节点访问到。
# 4. 如果某个从节点参与存储策略，它的访问地址也必须能被终端用户访问到。
#
# 重要说明：
# - 这个文件只承载 Cloudreve 主站 / 从站 / 入口代理。
# - PostgreSQL / Redis / Tika / OnlyOffice / 单节点 MinIO / 单节点 Elasticsearch
#   已经拆到 `docker-compose.swarm.foundation.yml`。
# - MinIO / Elasticsearch / Kafka / Kafka UI 集群形态在 `docker-compose.swarm.cluster.yml`。
# - Cloudreve 运行目录仍统一支持 `*_MOUNT_TYPE + *_MOUNT_SOURCE`。
# - `cloudreve-master` 可以通过 `CR_INIT_*` 在首次初始化时直接创建默认 S3 存储策略。
# - 生产里更推荐把自定义镜像先 push 到单点 `registry:2` 私有仓库，再让其它节点远程拉取。
# - 私有仓库本身建议单独使用 `docker-compose.swarm.registry.yml` 部署，不和主业务栈混在一起。

services:
  cloudreve-master:
    image: ${CLOUDREVE_IMAGE:-cloudreve/cloudreve:4.15.0}
    hostname: "{{.Node.Hostname}}-cr-master-{{.Task.Slot}}"
    environment:
      CR_CONF_System.Mode: master
      CR_CONF_System.Listen: ":5212"
      CR_CONF_System.ProxyHeader: X-Forwarded-For
      CR_CONF_System.SessionSecret: ${CLOUDREVE_SESSION_SECRET:?set CLOUDREVE_SESSION_SECRET}
      CR_CONF_Database.Type: postgres
      CR_CONF_Database.Host: pgpool
      CR_CONF_Database.Port: "5432"
      CR_CONF_Database.User: ${POSTGRESQL_USERNAME:-cloudreve}
      CR_CONF_Database.Password: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
      CR_CONF_Database.Name: ${POSTGRESQL_DATABASE:-cloudreve}
      CR_CONF_Redis.Server: redis-proxy:6379
      CR_CONF_Redis.Password: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      CR_CONF_Kafka.Enabled: ${CLOUDREVE_GLOBAL_KAFKA_ENABLED:-false}
      CR_CONF_Kafka.Brokers: ${CLOUDREVE_GLOBAL_KAFKA_BROKERS:-kafka:9092}
      CR_CONF_Kafka.Version: ${CLOUDREVE_GLOBAL_KAFKA_VERSION:-3.7.0}
      CR_CONF_Kafka.ClientID: ${CLOUDREVE_GLOBAL_KAFKA_CLIENT_ID:-cloudreve}
      CR_CONF_Kafka.SecurityProtocol: ${CLOUDREVE_GLOBAL_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      CR_SETTING_DEFAULT_siteURL: ${CLOUDREVE_SITE_URL:?set CLOUDREVE_SITE_URL}
      CR_INIT_DEFAULT_STORAGE: ${CR_INIT_DEFAULT_STORAGE:-s3}
      CR_INIT_S3_ENDPOINT: ${CR_INIT_S3_ENDPOINT:-http://minio:9000}
      CR_INIT_S3_BUCKET: ${CR_INIT_S3_BUCKET:-cloudreve}
      CR_INIT_S3_ACCESS_KEY: ${CR_INIT_S3_ACCESS_KEY:-minio}
      CR_INIT_S3_SECRET_KEY: ${CR_INIT_S3_SECRET_KEY:?set CR_INIT_S3_SECRET_KEY}
      CR_INIT_S3_REGION: ${CR_INIT_S3_REGION:-us-east-1}
      CR_INIT_S3_FORCE_PATH_STYLE: ${CR_INIT_S3_FORCE_PATH_STYLE:-true}
      CR_INIT_S3_RELAY: ${CR_INIT_S3_RELAY:-true}
      CR_INIT_S3_INTERNAL_PROXY: ${CR_INIT_S3_INTERNAL_PROXY:-true}
      CR_INIT_S3_IS_PRIVATE: ${CR_INIT_S3_IS_PRIVATE:-true}
      CR_INIT_S3_CHUNK_SIZE: ${CR_INIT_S3_CHUNK_SIZE:-26214400}
    volumes:
      - type: ${CLOUDREVE_MASTER_RUNTIME_MOUNT_TYPE:-volume}
        source: ${CLOUDREVE_MASTER_RUNTIME_MOUNT_SOURCE:-cloudreve_master_runtime}
        target: /cloudreve/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5212/api/v4/site/ping >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      replicas: ${CLOUDREVE_MASTER_REPLICAS:-1}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 2m
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${CLOUDREVE_MASTER_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${CLOUDREVE_MASTER_CPU_RESERVATION:-1.0}"
          memory: "${CLOUDREVE_MASTER_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${CLOUDREVE_MASTER_CPU_LIMIT:-2.0}"
          memory: "${CLOUDREVE_MASTER_MEM_LIMIT:-4G}"

  cloudreve-master-proxy:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    hostname: "{{.Node.Hostname}}-cr-master-proxy-{{.Task.Slot}}"
    environment:
      SERVER_NAME: ${CLOUDREVE_MASTER_SERVER_NAME:-_}
      UPSTREAM_SERVICE: cloudreve-master:5212
      CLIENT_MAX_BODY_SIZE: ${CLOUDREVE_MASTER_CLIENT_MAX_BODY_SIZE:-0}
      PROXY_READ_TIMEOUT: ${CLOUDREVE_MASTER_PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${CLOUDREVE_MASTER_PROXY_SEND_TIMEOUT:-3600s}
    configs:
      - source: cloudreve_proxy_template_v2
        target: /etc/nginx/templates/default.conf.template
        mode: 0444
    ports:
      - target: 80
        published: ${CLOUDREVE_MASTER_HTTP_PORT:-80}
        protocol: tcp
        mode: ingress
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: ${CLOUDREVE_MASTER_PROXY_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 2m
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${CLOUDREVE_MASTER_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${CLOUDREVE_MASTER_PROXY_CPU_RESERVATION:-0.25}"
          memory: "${CLOUDREVE_MASTER_PROXY_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${CLOUDREVE_MASTER_PROXY_CPU_LIMIT:-1.0}"
          memory: "${CLOUDREVE_MASTER_PROXY_MEM_LIMIT:-512M}"

  cloudreve-slave:
    image: ${CLOUDREVE_SLAVE_IMAGE:-cloudreve/cloudreve:4.15.0}
    hostname: "{{.Node.Hostname}}-cr-slave-{{.Task.Slot}}"
    environment:
      CR_CONF_System.Mode: slave
      CR_CONF_System.Listen: ":5212"
      CR_CONF_System.ProxyHeader: X-Forwarded-For
      CR_CONF_Slave.Secret: ${CLOUDREVE_SLAVE_SECRET:?set CLOUDREVE_SLAVE_SECRET}
      CR_CONF_CORS.AllowOrigins: "*"
      CR_CONF_CORS.AllowMethods: OPTIONS,GET,POST
      CR_CONF_CORS.AllowHeaders: "*"
      CR_CONF_Kafka.Enabled: ${CLOUDREVE_GLOBAL_KAFKA_ENABLED:-false}
      CR_CONF_Kafka.Brokers: ${CLOUDREVE_GLOBAL_KAFKA_BROKERS:-kafka:9092}
      CR_CONF_Kafka.Version: ${CLOUDREVE_GLOBAL_KAFKA_VERSION:-3.7.0}
      CR_CONF_Kafka.ClientID: ${CLOUDREVE_GLOBAL_KAFKA_CLIENT_ID:-cloudreve}
      CR_CONF_Kafka.SecurityProtocol: ${CLOUDREVE_GLOBAL_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
    volumes:
      - type: ${CLOUDREVE_SLAVE_RUNTIME_MOUNT_TYPE:-volume}
        source: ${CLOUDREVE_SLAVE_RUNTIME_MOUNT_SOURCE:-cloudreve_slave_runtime}
        target: /cloudreve/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --post-data='{}' http://127.0.0.1:5212/api/v4/slave/ping >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      replicas: ${CLOUDREVE_SLAVE_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 2m
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${CLOUDREVE_SLAVE_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${CLOUDREVE_SLAVE_CPU_RESERVATION:-0.5}"
          memory: "${CLOUDREVE_SLAVE_MEM_RESERVATION:-1G}"
        limits:
          cpus: "${CLOUDREVE_SLAVE_CPU_LIMIT:-1.5}"
          memory: "${CLOUDREVE_SLAVE_MEM_LIMIT:-2G}"

  cloudreve-slave-proxy:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    hostname: "{{.Node.Hostname}}-cr-slave-proxy-{{.Task.Slot}}"
    environment:
      SERVER_NAME: ${CLOUDREVE_SLAVE_SERVER_NAME:-_}
      UPSTREAM_SERVICE: cloudreve-slave:5212
      CLIENT_MAX_BODY_SIZE: ${CLOUDREVE_SLAVE_CLIENT_MAX_BODY_SIZE:-0}
      PROXY_READ_TIMEOUT: ${CLOUDREVE_SLAVE_PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${CLOUDREVE_SLAVE_PROXY_SEND_TIMEOUT:-3600s}
    configs:
      - source: cloudreve_proxy_template_v2
        target: /etc/nginx/templates/default.conf.template
        mode: 0444
    ports:
      - target: 80
        published: ${CLOUDREVE_SLAVE_HTTP_PORT:-5213}
        protocol: tcp
        mode: ingress
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: ${CLOUDREVE_SLAVE_PROXY_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 2m
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${CLOUDREVE_SLAVE_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${CLOUDREVE_SLAVE_PROXY_CPU_RESERVATION:-0.25}"
          memory: "${CLOUDREVE_SLAVE_PROXY_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${CLOUDREVE_SLAVE_PROXY_CPU_LIMIT:-1.0}"
          memory: "${CLOUDREVE_SLAVE_PROXY_MEM_LIMIT:-512M}"

networks:
  cloudreve_backend:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: ${CLOUDREVE_BACKEND_SUBNET:-10.20.0.0/24}

volumes:
  cloudreve_master_runtime:
  cloudreve_slave_runtime:

configs:
  cloudreve_proxy_template_v2:
    file: ./docker/swarm/nginx/cloudreve-proxy.conf.template
