      KAFKA_DEFAULT_REPLICATION_FACTOR: "${KAFKA_DEFAULT_REPLICATION_FACTOR:-3}"
      KAFKA_MIN_INSYNC_REPLICAS: "${KAFKA_MIN_INSYNC_REPLICAS:-2}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-3}"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-3}"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-2}"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/9092'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    volumes:
      - type: ${KAFKA_3_DATA_MOUNT_TYPE:-volume}
        source: ${KAFKA_3_DATA_MOUNT_SOURCE:-kafka_3_data}
        target: /var/lib/kafka/data
    networks:
      - cloudreve_backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - ${KAFKA_NODE_3_CONSTRAINT:-node.labels.cloudreve.kafka3==true}
      resources:
        reservations:
          cpus: "${KAFKA_CLUSTER_NODE_CPU_RESERVATION:-1.0}"
          memory: ${KAFKA_CLUSTER_NODE_MEM_RESERVATION:-2G}
        limits:
          cpus: "${KAFKA_CLUSTER_NODE_CPU_LIMIT:-2.0}"
          memory: ${KAFKA_CLUSTER_NODE_MEM_LIMIT:-4G}

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-provectuslabs/kafka-ui:v0.7.2}
    environment:
      SERVER_PORT: "8080"
      DYNAMIC_CONFIG_ENABLED: "${KAFKA_UI_DYNAMIC_CONFIG_ENABLED:-false}"
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_UI_CLUSTER_NAME:-cloudreve-kafka}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_UI_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: ${KAFKA_UI_SECURITY_PROTOCOL:-PLAINTEXT}
    ports:
      - target: 8080
        published: ${KAFKA_UI_HTTP_PORT:-18089}
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${KAFKA_UI_REPLICAS:-1}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${KAFKA_UI_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${KAFKA_UI_CPU_RESERVATION:-0.25}"
          memory: ${KAFKA_UI_MEM_RESERVATION:-256M}
        limits:
          cpus: "${KAFKA_UI_CPU_LIMIT:-1.0}"
          memory: ${KAFKA_UI_MEM_LIMIT:-1G}

configs:
  minio_cluster_proxy_cfg_v1:
    file: ./docker/swarm/haproxy/minio-cluster.cfg
  elasticsearch_cluster_proxy_cfg_v1:
    file: ./docker/swarm/haproxy/elasticsearch-cluster.cfg
  kafka_cluster_proxy_cfg_v1:
    file: ./docker/swarm/haproxy/kafka-cluster.cfg
  elasticsearch_swarm_entrypoint_v1:
    file: ./docker/swarm/elasticsearch-swarm-entrypoint.sh

volumes:
  minio_1_data:
  minio_2_data:
  minio_3_data:
  minio_4_data:
  elasticsearch_1_data:
  elasticsearch_2_data:
  elasticsearch_3_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
