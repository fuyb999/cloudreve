          - ${KAFKA_NODE_2_CONSTRAINT:-node.labels.cloudreve.kafka2==true}
      resources:
        reservations:
          cpus: "${KAFKA_CLUSTER_NODE_CPU_RESERVATION:-1.0}"
          memory: ${KAFKA_CLUSTER_NODE_MEM_RESERVATION:-2G}
        limits:
          cpus: "${KAFKA_CLUSTER_NODE_CPU_LIMIT:-2.0}"
          memory: ${KAFKA_CLUSTER_NODE_MEM_LIMIT:-4G}

  kafka-3:
    image: ${KAFKA_IMAGE:-apache/kafka:4.2.0}
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: "3"
      KAFKA_PROCESS_ROLES: broker,controller
