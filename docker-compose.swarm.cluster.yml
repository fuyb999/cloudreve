# MinIO / Elasticsearch / Kafka 多节点集群覆盖文件。
# 用法：
# - 在 `.env.swarm` 中设置 `SWARM_WITH_CLUSTER=yes`
# - 再执行 `docker/swarm/deploy-stack.sh`
#
# 说明：
# - 这个覆盖文件依赖 `docker/swarm/deploy-stack.sh --with-cluster`
#   或 `.env.swarm` 中的 `SWARM_WITH_CLUSTER=yes`
# - 部署脚本会先从基础模板里剔除单节点 `minio` / `elasticsearch`
# - 再由这里提供：
#   - 同名 `minio` 入口：4 节点 MinIO 分布式集群 + 1 个代理入口
#   - 同名 `elasticsearch` 入口：3 节点 Elasticsearch 集群 + 1 个代理入口
#   - 同名 `kafka` 入口：3 节点 Kafka KRaft 集群 + 1 个内部 bootstrap 代理
#   - `kafka-ui`：专门访问 Kafka 集群的管理界面
# - 建议在真实环境中给这些节点单独打 label，并把数据目录改成真实物理路径

services:
  minio:
    image: ${MINIO_PROXY_IMAGE:-haproxy:3.0-alpine}
    configs:
      - source: minio_cluster_proxy_cfg_v1
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    ports:
      - target: 9000
        published: ${MINIO_API_PORT:-9000}
        protocol: tcp
        mode: ingress
      - target: 9001
        published: ${MINIO_CONSOLE_PORT:-9001}
        protocol: tcp
        mode: ingress
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${MINIO_PROXY_REPLICAS:-1}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${MINIO_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${MINIO_PROXY_CPU_RESERVATION:-0.25}"
          memory: ${MINIO_PROXY_MEM_RESERVATION:-256M}
        limits:
          cpus: "${MINIO_PROXY_CPU_LIMIT:-1.0}"
          memory: ${MINIO_PROXY_MEM_LIMIT:-512M}

  minio-1:
    image: ${MINIO_IMAGE:-bitnami/minio:2024}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_DISTRIBUTED_MODE_ENABLED: "yes"
      MINIO_DISTRIBUTED_NODES: ${MINIO_DISTRIBUTED_NODES:-tasks.minio-1,tasks.minio-2,tasks.minio-3,tasks.minio-4}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-cloudreve}
      MINIO_SKIP_CLIENT: ${MINIO_CLUSTER_SKIP_CLIENT:-no}
    volumes:
      - type: ${MINIO_1_DATA_MOUNT_TYPE:-volume}
        source: ${MINIO_1_DATA_MOUNT_SOURCE:-minio_1_data}
        target: /bitnami/minio/data
    networks:
      - cloudreve_backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - ${MINIO_NODE_1_CONSTRAINT:-node.labels.cloudreve.minio1==true}
      resources:
        reservations:
          cpus: "${MINIO_CLUSTER_NODE_CPU_RESERVATION:-1.0}"
          memory: ${MINIO_CLUSTER_NODE_MEM_RESERVATION:-2G}
        limits:
          cpus: "${MINIO_CLUSTER_NODE_CPU_LIMIT:-2.0}"
          memory: ${MINIO_CLUSTER_NODE_MEM_LIMIT:-4G}

  minio-2:
    image: ${MINIO_IMAGE:-bitnami/minio:2024}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_DISTRIBUTED_MODE_ENABLED: "yes"
      MINIO_DISTRIBUTED_NODES: ${MINIO_DISTRIBUTED_NODES:-tasks.minio-1,tasks.minio-2,tasks.minio-3,tasks.minio-4}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-cloudreve}
      MINIO_SKIP_CLIENT: ${MINIO_CLUSTER_SKIP_CLIENT:-no}
    volumes:
      - type: ${MINIO_2_DATA_MOUNT_TYPE:-volume}
        source: ${MINIO_2_DATA_MOUNT_SOURCE:-minio_2_data}
        target: /bitnami/minio/data
    networks:
      - cloudreve_backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - ${MINIO_NODE_2_CONSTRAINT:-node.labels.cloudreve.minio2==true}
      resources:
        reservations:
          cpus: "${MINIO_CLUSTER_NODE_CPU_RESERVATION:-1.0}"
          memory: ${MINIO_CLUSTER_NODE_MEM_RESERVATION:-2G}
        limits:
          cpus: "${MINIO_CLUSTER_NODE_CPU_LIMIT:-2.0}"
          memory: ${MINIO_CLUSTER_NODE_MEM_LIMIT:-4G}

  minio-3:
    image: ${MINIO_IMAGE:-bitnami/minio:2024}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_DISTRIBUTED_MODE_ENABLED: "yes"
      MINIO_DISTRIBUTED_NODES: ${MINIO_DISTRIBUTED_NODES:-tasks.minio-1,tasks.minio-2,tasks.minio-3,tasks.minio-4}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-cloudreve}
      MINIO_SKIP_CLIENT: ${MINIO_CLUSTER_SKIP_CLIENT:-no}
    volumes:
      - type: ${MINIO_3_DATA_MOUNT_TYPE:-volume}
        source: ${MINIO_3_DATA_MOUNT_SOURCE:-minio_3_data}
        target: /bitnami/minio/data
    networks:
      - cloudreve_backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - ${MINIO_NODE_3_CONSTRAINT:-node.labels.cloudreve.minio3==true}
      resources:
        reservations:
          cpus: "${MINIO_CLUSTER_NODE_CPU_RESERVATION:-1.0}"
          memory: ${MINIO_CLUSTER_NODE_MEM_RESERVATION:-2G}
        limits:
          cpus: "${MINIO_CLUSTER_NODE_CPU_LIMIT:-2.0}"
          memory: ${MINIO_CLUSTER_NODE_MEM_LIMIT:-4G}

  minio-4:
    image: ${MINIO_IMAGE:-bitnami/minio:2024}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_DISTRIBUTED_MODE_ENABLED: "yes"
      MINIO_DISTRIBUTED_NODES: ${MINIO_DISTRIBUTED_NODES:-tasks.minio-1,tasks.minio-2,tasks.minio-3,tasks.minio-4}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-cloudreve}
      MINIO_SKIP_CLIENT: ${MINIO_CLUSTER_SKIP_CLIENT:-no}
    volumes:
      - type: ${MINIO_4_DATA_MOUNT_TYPE:-volume}
        source: ${MINIO_4_DATA_MOUNT_SOURCE:-minio_4_data}
        target: /bitnami/minio/data
    networks:
      - cloudreve_backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - ${MINIO_NODE_4_CONSTRAINT:-node.labels.cloudreve.minio4==true}
      resources:
        reservations:
          cpus: "${MINIO_CLUSTER_NODE_CPU_RESERVATION:-1.0}"
          memory: ${MINIO_CLUSTER_NODE_MEM_RESERVATION:-2G}
        limits:
          cpus: "${MINIO_CLUSTER_NODE_CPU_LIMIT:-2.0}"
          memory: ${MINIO_CLUSTER_NODE_MEM_LIMIT:-4G}

  elasticsearch:
    image: ${ELASTICSEARCH_PROXY_IMAGE:-haproxy:3.0-alpine}
    configs:
      - source: elasticsearch_cluster_proxy_cfg_v1
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    ports:
      - target: 9200
        published: ${ELASTICSEARCH_HTTP_PORT:-9200}
        protocol: tcp
        mode: ingress
      - target: 9300
        published: ${ELASTICSEARCH_TRANSPORT_PORT:-9300}
        protocol: tcp
        mode: ingress
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${ELASTICSEARCH_PROXY_REPLICAS:-1}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${ELASTICSEARCH_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${ELASTICSEARCH_PROXY_CPU_RESERVATION:-0.25}"
          memory: ${ELASTICSEARCH_PROXY_MEM_RESERVATION:-256M}
        limits:
          cpus: "${ELASTICSEARCH_PROXY_CPU_LIMIT:-1.0}"
          memory: ${ELASTICSEARCH_PROXY_MEM_LIMIT:-512M}

  elasticsearch-1:
    image: ${ELASTICSEARCH_IMAGE:-elasticsearch:8.12.2}
    environment:
      cluster.name: ${ELASTICSEARCH_CLUSTER_NAME:-cloudreve-es}
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "${ELASTICSEARCH_CLUSTER_NODE_JAVA_OPTS:--Xms4g -Xmx4g}"
      ELASTICSEARCH_NODE_NAME: elasticsearch-1
      ELASTICSEARCH_DISCOVERY_SEED_HOSTS: ${ELASTICSEARCH_DISCOVERY_SEED_HOSTS:-tasks.elasticsearch-1,tasks.elasticsearch-2,tasks.elasticsearch-3}
      ELASTICSEARCH_CLUSTER_INITIAL_MASTER_NODES: ${ELASTICSEARCH_CLUSTER_INITIAL_MASTER_NODES:-elasticsearch-1,elasticsearch-2,elasticsearch-3}
    command: ["/usr/local/bin/elasticsearch-swarm-entrypoint.sh"]
    configs:
      - source: elasticsearch_swarm_entrypoint_v1
        target: /usr/local/bin/elasticsearch-swarm-entrypoint.sh
        mode: 0555
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    volumes:
      - type: ${ELASTICSEARCH_1_DATA_MOUNT_TYPE:-volume}
        source: ${ELASTICSEARCH_1_DATA_MOUNT_SOURCE:-elasticsearch_1_data}
        target: /usr/share/elasticsearch/data
    networks:
