      start_period: 90s
    volumes:
      - type: ${KAFKA_2_DATA_MOUNT_TYPE:-volume}
        source: ${KAFKA_2_DATA_MOUNT_SOURCE:-kafka_2_data}
        target: /var/lib/kafka/data
    networks:
      - cloudreve_backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
