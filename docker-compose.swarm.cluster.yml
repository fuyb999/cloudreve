          cpus: "${ELASTICSEARCH_CLUSTER_NODE_CPU_RESERVATION:-2.0}"
          memory: ${ELASTICSEARCH_CLUSTER_NODE_MEM_RESERVATION:-6G}
        limits:
          cpus: "${ELASTICSEARCH_CLUSTER_NODE_CPU_LIMIT:-4.0}"
          memory: ${ELASTICSEARCH_CLUSTER_NODE_MEM_LIMIT:-8G}

  kafka:
    image: ${KAFKA_PROXY_IMAGE:-haproxy:3.0-alpine}
    configs:
      - source: kafka_cluster_proxy_cfg_v1
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${KAFKA_PROXY_REPLICAS:-1}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
