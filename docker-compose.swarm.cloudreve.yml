# Cloudreve 主从业务层 Swarm 模板。
# 这里遵循 Cloudreve 官方建议：
# 1. Cloudreve 必须放在反向代理后面。
# 2. 从节点必须和主节点使用相同版本。
# 3. 主站 Site URL 必须能被从节点访问到。
# 4. 如果某个从节点参与存储策略，它的访问地址也必须能被终端用户访问到。
#
# 重要说明：
# - 默认单节点全量联调模板在 `docker-compose.swarm.single.yml`。
# - 这个文件只承载 Cloudreve 主站 / 从站 / 入口代理，可以作为独立 stack 发布。
# - PostgreSQL / Redis / Tika / OnlyOffice
#   已经拆到 `docker-compose.swarm.foundation.yml`。
# - MinIO / Elasticsearch / Kafka / Kafka UI 集群形态在 `docker-compose.swarm.infra.yml`。
# - 多个 stack 统一接入 `SWARM_SHARED_NETWORK` 指定的外部 overlay 网络。
# - Cloudreve 运行目录仍统一支持 `*_MOUNT_TYPE + *_MOUNT_SOURCE`。
# - `cloudreve-master` 可以通过 `CR_INIT_*` 在首次初始化时直接创建默认 S3 存储策略。
# - 生产里更推荐把自定义镜像先 push 到单点 `registry:2` 私有仓库，再让其它节点远程拉取。
# - 私有仓库本身建议单独使用 `docker-compose.swarm.registry.yml` 部署，不和主业务栈混在一起。

x-default-env: &default-env
  TZ: ${SWARM_TIMEZONE:-Asia/Shanghai}

x-localtime-volume: &localtime-volume
  type: ${SWARM_LOCALTIME_MOUNT_TYPE:-bind}
  source: ${SWARM_LOCALTIME_MOUNT_SOURCE:-/etc/localtime}
  target: /etc/localtime
  read_only: true

x-pki-volume: &pki-volume
  type: ${SWARM_PKI_MOUNT_TYPE:-bind}
  source: ${SWARM_PKI_MOUNT_SOURCE:-/srv/cloudreve/pki}
  target: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}
  read_only: true

x-default-logging: &default-logging
  driver: ${SWARM_LOGGING_DRIVER:-json-file}
  options:
    max-size: "${SWARM_LOGGING_MAX_SIZE:-20m}"
    max-file: "${SWARM_LOGGING_MAX_FILE:-5}"
    compress: "${SWARM_LOGGING_COMPRESS:-true}"

x-service-base: &service-base
  logging: *default-logging

x-default-update-config: &default-update-config
  parallelism: 1
  order: ${SWARM_ROLLING_ORDER:-start-first}
  failure_action: rollback

x-delayed-update-config: &delayed-update-config
  <<: *default-update-config
  delay: 10s

x-default-rollback-config: &default-rollback-config
  parallelism: 1
  order: stop-first

x-default-restart-policy: &default-restart-policy
  condition: any
  delay: 5s
  window: 2m

services:
  cloudreve-master:
    <<: *service-base
    image: ${CLOUDREVE_IMAGE:-cloudreve/cloudreve:4.15.0}
    hostname: "{{.Node.Hostname}}-cr-master-{{.Task.Slot}}"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/bin/sh", "/usr/local/bin/cloudreve-entrypoint.sh"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: CR_CONF_System.SessionSecret=cloudreve_session_secret,CR_CONF_Database.Password=postgresql_password,CR_CONF_Redis.Password=redis_password,CR_INIT_S3_SECRET_KEY=cloudreve_s3_secret_key
      SSL_CERT_FILE: ${CLOUDREVE_CA_CERT_FILE:-/run/swarm-pki/ca/ca.crt}
      SSL_CERT_DIR: ${CLOUDREVE_CA_CERT_DIR:-/run/swarm-pki/ca}
      CURL_CA_BUNDLE: ${CLOUDREVE_CA_CERT_FILE:-/run/swarm-pki/ca/ca.crt}
      CR_CONF_System.Mode: master
      CR_CONF_System.Listen: ":5212"
      CR_CONF_System.ProxyHeader: X-Forwarded-For
      CR_CONF_Database.Type: postgres
      CR_CONF_Database.Host: ${CLOUDREVE_POSTGRES_HOST:-pgpool-internal}
      CR_CONF_Database.Port: "5432"
      CR_CONF_Database.User: ${POSTGRESQL_USERNAME:-cloudreve}
      CR_CONF_Database.Name: ${POSTGRESQL_DATABASE:-cloudreve}
      CR_CONF_Redis.Server: ${CLOUDREVE_REDIS_ENDPOINT:-redis-proxy-internal:6379}
      CR_CONF_Redis.UseTLS: ${CLOUDREVE_REDIS_USE_TLS:-false}
      CR_CONF_Redis.TLSSkipVerify: ${CLOUDREVE_REDIS_TLS_SKIP_VERIFY:-false}
      CR_CONF_Kafka.Enabled: ${CLOUDREVE_GLOBAL_KAFKA_ENABLED:-false}
      CR_CONF_Kafka.Brokers: ${CLOUDREVE_GLOBAL_KAFKA_BROKERS:-kafka:9092}
      CR_CONF_Kafka.Version: ${CLOUDREVE_GLOBAL_KAFKA_VERSION:-3.7.0}
      CR_CONF_Kafka.ClientID: ${CLOUDREVE_GLOBAL_KAFKA_CLIENT_ID:-cloudreve}
      CR_CONF_Kafka.SecurityProtocol: ${CLOUDREVE_GLOBAL_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      CR_CONF_Kafka.TLSSkipVerify: ${CLOUDREVE_GLOBAL_KAFKA_TLS_SKIP_VERIFY:-false}
      CR_CONF_Kafka.TLSServerName: ${CLOUDREVE_GLOBAL_KAFKA_TLS_SERVER_NAME:-kafka}
      CR_CONF_Kafka.TLSCAPath: ${CLOUDREVE_GLOBAL_KAFKA_TLS_CA_PATH:-/run/swarm-pki/ca/ca.crt}
      CR_SETTING_DEFAULT_siteURL: ${CLOUDREVE_SITE_URL:?set CLOUDREVE_SITE_URL}
      CR_SETTING_fts_enabled: ${CLOUDREVE_FTS_ENABLED:-1}
      CR_SETTING_fts_index_type: ${CLOUDREVE_FTS_INDEX_TYPE:-elasticsearch}
      CR_SETTING_fts_elasticsearch_endpoint: ${CLOUDREVE_FTS_ELASTICSEARCH_ENDPOINT:-http://elasticsearch-internal:9200}
      CR_SETTING_fts_elasticsearch_index: ${CLOUDREVE_FTS_ELASTICSEARCH_INDEX:-cloudreve_files}
      CR_SETTING_fts_elasticsearch_page_size: ${CLOUDREVE_FTS_ELASTICSEARCH_PAGE_SIZE:-5}
      CR_SETTING_fts_elasticsearch_skip_tls_verify: ${CLOUDREVE_FTS_ELASTICSEARCH_SKIP_TLS_VERIFY:-0}
      CR_SETTING_fts_extractor_type: ${CLOUDREVE_FTS_EXTRACTOR_TYPE:-tika}
      CR_SETTING_fts_tika_endpoint: ${CLOUDREVE_FTS_TIKA_ENDPOINT:-http://tika:9998}
      CR_SETTING_fts_tika_max_file_size: ${CLOUDREVE_FTS_TIKA_MAX_FILE_SIZE:-26214400}
      CR_SETTING_fts_tika_document_enabled: ${CLOUDREVE_FTS_TIKA_DOCUMENT_ENABLED:-1}
      CR_SETTING_fts_tika_archive_enabled: ${CLOUDREVE_FTS_TIKA_ARCHIVE_ENABLED:-1}
      CR_INIT_DEFAULT_STORAGE: ${CR_INIT_DEFAULT_STORAGE:-s3}
      CR_INIT_S3_ENDPOINT: ${CR_INIT_S3_ENDPOINT:-https://minio:9000}
      CR_INIT_S3_BUCKET: ${CR_INIT_S3_BUCKET:-cloudreve}
      CR_INIT_S3_ACCESS_KEY: ${CR_INIT_S3_ACCESS_KEY:-minio}
      CR_INIT_S3_REGION: ${CR_INIT_S3_REGION:-us-east-1}
      CR_INIT_S3_FORCE_PATH_STYLE: ${CR_INIT_S3_FORCE_PATH_STYLE:-true}
      CR_INIT_S3_RELAY: ${CR_INIT_S3_RELAY:-true}
      CR_INIT_S3_INTERNAL_PROXY: ${CR_INIT_S3_INTERNAL_PROXY:-true}
      CR_INIT_S3_IS_PRIVATE: ${CR_INIT_S3_IS_PRIVATE:-true}
      CR_INIT_S3_CHUNK_SIZE: ${CR_INIT_S3_CHUNK_SIZE:-26214400}
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
      - source: cloudreve_entrypoint_v1
        target: /usr/local/bin/cloudreve-entrypoint.sh
        mode: 0555
    secrets:
      - cloudreve_session_secret
      - postgresql_password
      - redis_password
      - cloudreve_s3_secret_key
    volumes:
      - *localtime-volume
      - *pki-volume
      - type: ${CLOUDREVE_MASTER_RUNTIME_MOUNT_TYPE:-volume}
        source: ${CLOUDREVE_MASTER_RUNTIME_MOUNT_SOURCE:-cloudreve_master_runtime}
        target: /cloudreve/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5212/api/v4/site/ping >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      replicas: ${CLOUDREVE_MASTER_REPLICAS:-1}
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${CLOUDREVE_MASTER_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${CLOUDREVE_MASTER_CPU_RESERVATION:-1.0}"
          memory: "${CLOUDREVE_MASTER_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${CLOUDREVE_MASTER_CPU_LIMIT:-2.0}"
          memory: "${CLOUDREVE_MASTER_MEM_LIMIT:-4G}"

  cloudreve-master-proxy:
    <<: *service-base
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    hostname: "{{.Node.Hostname}}-cr-master-proxy-{{.Task.Slot}}"
    environment:
      <<: *default-env
      SERVER_NAME: ${CLOUDREVE_MASTER_SERVER_NAME:-_}
      UPSTREAM_SERVICE: cloudreve-master:5212
      TLS_CERT_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/cloudreve-master-proxy/fullchain.crt
      TLS_KEY_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/cloudreve-master-proxy/tls.key
      CLIENT_MAX_BODY_SIZE: ${CLOUDREVE_MASTER_CLIENT_MAX_BODY_SIZE:-0}
      PROXY_READ_TIMEOUT: ${CLOUDREVE_MASTER_PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${CLOUDREVE_MASTER_PROXY_SEND_TIMEOUT:-3600s}
    configs:
      - source: cloudreve_proxy_template_v3
        target: /etc/nginx/templates/default.conf.template
        mode: 0444
    ports:
      - target: 443
        published: ${CLOUDREVE_MASTER_HTTP_PORT:-18081}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O - https://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: ${CLOUDREVE_MASTER_PROXY_REPLICAS:-2}
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${CLOUDREVE_MASTER_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${CLOUDREVE_MASTER_PROXY_CPU_RESERVATION:-0.25}"
          memory: "${CLOUDREVE_MASTER_PROXY_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${CLOUDREVE_MASTER_PROXY_CPU_LIMIT:-1.0}"
          memory: "${CLOUDREVE_MASTER_PROXY_MEM_LIMIT:-512M}"

  cloudreve-slave:
    <<: *service-base
    image: ${CLOUDREVE_SLAVE_IMAGE:-cloudreve/cloudreve:4.15.0}
    hostname: "{{.Node.Hostname}}-cr-slave-{{.Task.Slot}}"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "sh", "./entrypoint.sh"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: CR_CONF_Slave.Secret=cloudreve_slave_secret
      SSL_CERT_FILE: ${CLOUDREVE_CA_CERT_FILE:-/run/swarm-pki/ca/ca.crt}
      SSL_CERT_DIR: ${CLOUDREVE_CA_CERT_DIR:-/run/swarm-pki/ca}
      CURL_CA_BUNDLE: ${CLOUDREVE_CA_CERT_FILE:-/run/swarm-pki/ca/ca.crt}
      CR_CONF_System.Mode: slave
      CR_CONF_System.Listen: ":5212"
      CR_CONF_System.ProxyHeader: X-Forwarded-For
      CR_CONF_CORS.AllowOrigins: "*"
      CR_CONF_CORS.AllowMethods: OPTIONS,GET,POST
      CR_CONF_CORS.AllowHeaders: "*"
      CR_CONF_Kafka.Enabled: ${CLOUDREVE_GLOBAL_KAFKA_ENABLED:-false}
      CR_CONF_Kafka.Brokers: ${CLOUDREVE_GLOBAL_KAFKA_BROKERS:-kafka:9092}
      CR_CONF_Kafka.Version: ${CLOUDREVE_GLOBAL_KAFKA_VERSION:-3.7.0}
      CR_CONF_Kafka.ClientID: ${CLOUDREVE_GLOBAL_KAFKA_CLIENT_ID:-cloudreve}
      CR_CONF_Kafka.SecurityProtocol: ${CLOUDREVE_GLOBAL_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      CR_CONF_Kafka.TLSSkipVerify: ${CLOUDREVE_GLOBAL_KAFKA_TLS_SKIP_VERIFY:-false}
      CR_CONF_Kafka.TLSServerName: ${CLOUDREVE_GLOBAL_KAFKA_TLS_SERVER_NAME:-kafka}
      CR_CONF_Kafka.TLSCAPath: ${CLOUDREVE_GLOBAL_KAFKA_TLS_CA_PATH:-/run/swarm-pki/ca/ca.crt}
      CR_SETTING_fts_enabled: ${CLOUDREVE_FTS_ENABLED:-1}
      CR_SETTING_fts_index_type: ${CLOUDREVE_FTS_INDEX_TYPE:-elasticsearch}
      CR_SETTING_fts_elasticsearch_endpoint: ${CLOUDREVE_FTS_ELASTICSEARCH_ENDPOINT:-http://elasticsearch-internal:9200}
      CR_SETTING_fts_elasticsearch_index: ${CLOUDREVE_FTS_ELASTICSEARCH_INDEX:-cloudreve_files}
      CR_SETTING_fts_elasticsearch_page_size: ${CLOUDREVE_FTS_ELASTICSEARCH_PAGE_SIZE:-5}
      CR_SETTING_fts_elasticsearch_skip_tls_verify: ${CLOUDREVE_FTS_ELASTICSEARCH_SKIP_TLS_VERIFY:-0}
      CR_SETTING_fts_extractor_type: ${CLOUDREVE_FTS_EXTRACTOR_TYPE:-tika}
      CR_SETTING_fts_tika_endpoint: ${CLOUDREVE_FTS_TIKA_ENDPOINT:-http://tika:9998}
      CR_SETTING_fts_tika_max_file_size: ${CLOUDREVE_FTS_TIKA_MAX_FILE_SIZE:-26214400}
      CR_SETTING_fts_tika_document_enabled: ${CLOUDREVE_FTS_TIKA_DOCUMENT_ENABLED:-1}
      CR_SETTING_fts_tika_archive_enabled: ${CLOUDREVE_FTS_TIKA_ARCHIVE_ENABLED:-1}
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
    secrets:
      - cloudreve_slave_secret
    volumes:
      - *localtime-volume
      - *pki-volume
      - type: ${CLOUDREVE_SLAVE_RUNTIME_MOUNT_TYPE:-volume}
        source: ${CLOUDREVE_SLAVE_RUNTIME_MOUNT_SOURCE:-cloudreve_slave_runtime}
        target: /cloudreve/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --post-data='{}' http://127.0.0.1:5212/api/v4/slave/ping >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      replicas: ${CLOUDREVE_SLAVE_REPLICAS:-2}
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${CLOUDREVE_SLAVE_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${CLOUDREVE_SLAVE_CPU_RESERVATION:-0.5}"
          memory: "${CLOUDREVE_SLAVE_MEM_RESERVATION:-1G}"
        limits:
          cpus: "${CLOUDREVE_SLAVE_CPU_LIMIT:-1.5}"
          memory: "${CLOUDREVE_SLAVE_MEM_LIMIT:-2G}"

  cloudreve-slave-proxy:
    <<: *service-base
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    hostname: "{{.Node.Hostname}}-cr-slave-proxy-{{.Task.Slot}}"
    environment:
      <<: *default-env
      SERVER_NAME: ${CLOUDREVE_SLAVE_SERVER_NAME:-_}
      UPSTREAM_SERVICE: cloudreve-slave:5212
      TLS_CERT_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/cloudreve-slave-proxy/fullchain.crt
      TLS_KEY_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/cloudreve-slave-proxy/tls.key
      CLIENT_MAX_BODY_SIZE: ${CLOUDREVE_SLAVE_CLIENT_MAX_BODY_SIZE:-0}
      PROXY_READ_TIMEOUT: ${CLOUDREVE_SLAVE_PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${CLOUDREVE_SLAVE_PROXY_SEND_TIMEOUT:-3600s}
    configs:
      - source: cloudreve_proxy_template_v3
        target: /etc/nginx/templates/default.conf.template
        mode: 0444
    ports:
      - target: 443
        published: ${CLOUDREVE_SLAVE_HTTP_PORT:-18082}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O - https://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: ${CLOUDREVE_SLAVE_PROXY_REPLICAS:-2}
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${CLOUDREVE_SLAVE_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${CLOUDREVE_SLAVE_PROXY_CPU_RESERVATION:-0.25}"
          memory: "${CLOUDREVE_SLAVE_PROXY_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${CLOUDREVE_SLAVE_PROXY_CPU_LIMIT:-1.0}"
          memory: "${CLOUDREVE_SLAVE_PROXY_MEM_LIMIT:-512M}"

networks:
  cloudreve_backend:
    external: true
    name: ${SWARM_SHARED_NETWORK:?set SWARM_SHARED_NETWORK}

volumes:
  cloudreve_master_runtime:
  cloudreve_slave_runtime:

configs:
  swarm_secret_wrap_v1:
    file: ./docker/swarm/swarm-secret-wrap.sh
  cloudreve_entrypoint_v1:
    file: ./docker/swarm/cloudreve-entrypoint.sh
  cloudreve_proxy_template_v3:
    file: ./docker/swarm/nginx/cloudreve-proxy.conf.template

secrets:
  cloudreve_session_secret:
    external: true
    name: ${SWARM_SECRET_CLOUDREVE_SESSION_SECRET_NAME:?set SWARM_SECRET_CLOUDREVE_SESSION_SECRET_NAME}
  postgresql_password:
    external: true
    name: ${SWARM_SECRET_POSTGRESQL_PASSWORD_NAME:?set SWARM_SECRET_POSTGRESQL_PASSWORD_NAME}
  redis_password:
    external: true
    name: ${SWARM_SECRET_REDIS_PASSWORD_NAME:?set SWARM_SECRET_REDIS_PASSWORD_NAME}
  cloudreve_s3_secret_key:
    external: true
    name: ${SWARM_SECRET_CLOUDREVE_S3_SECRET_KEY_NAME:?set SWARM_SECRET_CLOUDREVE_S3_SECRET_KEY_NAME}
  cloudreve_slave_secret:
    external: true
    name: ${SWARM_SECRET_CLOUDREVE_SLAVE_SECRET_NAME:?set SWARM_SECRET_CLOUDREVE_SLAVE_SECRET_NAME}
