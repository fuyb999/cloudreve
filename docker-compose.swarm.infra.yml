# MinIO / Elasticsearch / Kafka 集群基础设施模板。
#
# 说明：
# - 这个文件用于独立发布集群型基础设施：
#   - 同名 `minio` 入口：4 节点 MinIO 分布式集群 + 1 个代理入口
#   - `minio-init`：通过稳定入口 `minio:9000` 持续确保默认 bucket 存在
#   - 同名 `elasticsearch` 入口：3 节点 Elasticsearch 集群 + 1 个代理入口
#   - 同名 `kafka` 入口：3 节点 Kafka KRaft 集群 + 1 个内部 bootstrap 代理
#   - `kafka-ui`：专门访问 Kafka 集群的管理界面
# - 典型方式是独立发布：
#   - `docker/swarm/deploy-stack.sh infra --stack-name cloudreve-prod-infra`
# - 这样会把这些服务作为独立 Swarm 栈接入 `SWARM_SHARED_NETWORK`，而不再依赖 `--with-cluster`
# - 建议在真实环境中给这些节点单独打 label，并把数据目录改成真实物理路径
# - Kafka 这 3 个固定 KRaft 节点必须使用 `endpoint_mode: dnsrr`
#   避免 Swarm VIP / 内部负载均衡介入控制面连接

x-default-env: &default-env
  TZ: ${SWARM_TIMEZONE:-Asia/Shanghai}

x-localtime-volume: &localtime-volume
  type: ${SWARM_LOCALTIME_MOUNT_TYPE:-bind}
  source: ${SWARM_LOCALTIME_MOUNT_SOURCE:-/etc/localtime}
  target: /etc/localtime
  read_only: true

x-pki-volume: &pki-volume
  type: ${SWARM_PKI_MOUNT_TYPE:-bind}
  source: ${SWARM_PKI_MOUNT_SOURCE:-/srv/cloudreve/pki}
  target: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}
  read_only: true

x-default-logging: &default-logging
  driver: ${SWARM_LOGGING_DRIVER:-json-file}
  options:
    max-size: "${SWARM_LOGGING_MAX_SIZE:-20m}"
    max-file: "${SWARM_LOGGING_MAX_FILE:-5}"
    compress: "${SWARM_LOGGING_COMPRESS:-true}"

x-service-base: &service-base
  logging: *default-logging

x-default-update-config: &default-update-config
  parallelism: 1
  order: ${SWARM_ROLLING_ORDER:-start-first}
  failure_action: rollback

x-default-rollback-config: &default-rollback-config
  parallelism: 1
  order: stop-first

x-default-restart-policy: &default-restart-policy
  condition: on-failure
  delay: 5s
  window: 2m

services:
  minio-internal:
    <<: *service-base
    image: ${MINIO_PROXY_IMAGE:-haproxy:3.0-alpine}
    hostname: "{{.Node.Hostname}}-minio-internal-{{.Task.Slot}}"
    environment: *default-env
    configs:
      - source: minio_cluster_proxy_cfg_v2
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    volumes:
      - *localtime-volume
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${MINIO_PROXY_REPLICAS:-1}
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${MINIO_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${MINIO_PROXY_CPU_RESERVATION:-0.25}"
          memory: "${MINIO_PROXY_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${MINIO_PROXY_CPU_LIMIT:-1.0}"
          memory: "${MINIO_PROXY_MEM_LIMIT:-512M}"

  minio:
    <<: *service-base
    image: ${MINIO_PROXY_IMAGE:-haproxy:3.0-alpine}
    hostname: "{{.Node.Hostname}}-minio-public-{{.Task.Slot}}"
    environment: *default-env
    configs:
      - source: minio_public_tls_cfg_v2
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    ports:
      - target: 9000
        published: ${MINIO_API_PORT:-19000}
        protocol: tcp
        mode: ingress
      - target: 9001
        published: ${MINIO_CONSOLE_PORT:-19001}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${MINIO_PUBLIC_REPLICAS:-1}
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${MINIO_PUBLIC_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${MINIO_PUBLIC_CPU_RESERVATION:-0.25}"
          memory: "${MINIO_PUBLIC_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${MINIO_PUBLIC_CPU_LIMIT:-1.0}"
          memory: "${MINIO_PUBLIC_MEM_LIMIT:-512M}"

  minio-1:
    <<: *service-base
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2024.10.2-debian-12-r0}
    hostname: minio-1
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: MINIO_ROOT_PASSWORD=minio_root_password
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_DISTRIBUTED_MODE_ENABLED: "yes"
      MINIO_DISTRIBUTED_NODES: ${MINIO_DISTRIBUTED_NODES:-minio-1,minio-2,minio-3,minio-4}
      MINIO_DATA_DIR: /bitnami/minio/data
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/bin/bash", "/usr/local/bin/minio-swarm-entrypoint.sh"]
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
      - source: minio_swarm_entrypoint_v1
        target: /usr/local/bin/minio-swarm-entrypoint.sh
        mode: 0555
    secrets:
      - minio_root_password
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s
    volumes:
      - *localtime-volume
      - *pki-volume
      - type: ${MINIO_1_DATA_MOUNT_TYPE:-volume}
        source: ${MINIO_1_DATA_MOUNT_SOURCE:-minio_1_data}
        target: /bitnami/minio/data
    networks:
      - cloudreve_backend
    deploy:
      endpoint_mode: dnsrr
      replicas: 1
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${MINIO_NODE_1_CONSTRAINT:-node.labels.cloudreve.minio1==true}
      resources:
        reservations:
          cpus: "${MINIO_CLUSTER_NODE_CPU_RESERVATION:-1.0}"
          memory: "${MINIO_CLUSTER_NODE_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${MINIO_CLUSTER_NODE_CPU_LIMIT:-2.0}"
          memory: "${MINIO_CLUSTER_NODE_MEM_LIMIT:-4G}"

  minio-2:
