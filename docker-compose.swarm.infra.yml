      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_DISTRIBUTED_MODE_ENABLED: "yes"
      MINIO_DISTRIBUTED_NODES: ${MINIO_DISTRIBUTED_NODES:-minio-1,minio-2,minio-3,minio-4}
      MINIO_DATA_DIR: /bitnami/minio/data
