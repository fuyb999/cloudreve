      MINIO_CONSOLE_PORT_NUMBER: "9001"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/bin/bash", "/usr/local/bin/minio-swarm-entrypoint.sh"]
    configs:
