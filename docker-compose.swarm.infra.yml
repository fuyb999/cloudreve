          memory: "${MINIO_CLUSTER_NODE_MEM_LIMIT:-4G}"

  minio-init:
    <<: *service-base
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2024.10.2-debian-12-r0}
    hostname: "{{.Node.Hostname}}-minio-init-{{.Task.Slot}}"
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: MINIO_ROOT_PASSWORD=minio_root_password
      MINIO_ENDPOINT: ${MINIO_INIT_ENDPOINT:-https://minio:9000}
      MINIO_CA_FILE: ${MINIO_INIT_CA_FILE:-/run/swarm-pki/ca/ca.crt}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-cloudreve}
      MINIO_INIT_INTERVAL_SECONDS: ${MINIO_INIT_INTERVAL_SECONDS:-30}
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/bin/bash", "/usr/local/bin/minio-init.sh"]
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
      - source: minio_init_v1
        target: /usr/local/bin/minio-init.sh
        mode: 0555
    secrets:
      - minio_root_password
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${MINIO_INIT_REPLICAS:-1}
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${MINIO_INIT_NODE_CONSTRAINT:-node.platform.os==linux}
