    configs:
      - source: elasticsearch_swarm_entrypoint_v1
        target: /usr/local/bin/elasticsearch-swarm-entrypoint.sh
        mode: 0555
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20m
    volumes:
      - *localtime-volume
      - type: ${ELASTICSEARCH_3_DATA_MOUNT_TYPE:-volume}
        source: ${ELASTICSEARCH_3_DATA_MOUNT_SOURCE:-elasticsearch_3_data}
        target: /usr/share/elasticsearch/data
    networks:
      - cloudreve_backend
    deploy:
      replicas: 1
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${ELASTICSEARCH_NODE_3_CONSTRAINT:-node.labels.cloudreve.es3==true}
      resources:
        reservations:
          cpus: "${ELASTICSEARCH_CLUSTER_NODE_CPU_RESERVATION:-2.0}"
          memory: "${ELASTICSEARCH_CLUSTER_NODE_MEM_RESERVATION:-6G}"
        limits:
          cpus: "${ELASTICSEARCH_CLUSTER_NODE_CPU_LIMIT:-4.0}"
          memory: "${ELASTICSEARCH_CLUSTER_NODE_MEM_LIMIT:-8G}"

  kafka:
    <<: *service-base
    image: ${KAFKA_PROXY_IMAGE:-haproxy:3.0-alpine}
    hostname: "{{.Node.Hostname}}-kafka-proxy-{{.Task.Slot}}"
    environment: *default-env
    configs:
      - source: kafka_cluster_proxy_cfg_v3
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${KAFKA_PROXY_REPLICAS:-1}
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${KAFKA_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${KAFKA_PROXY_CPU_RESERVATION:-0.25}"
          memory: "${KAFKA_PROXY_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${KAFKA_PROXY_CPU_LIMIT:-1.0}"
          memory: "${KAFKA_PROXY_MEM_LIMIT:-512M}"

  kafka-1:
    <<: *service-base
    image: ${KAFKA_IMAGE:-apache/kafka:4.2.0}
    hostname: "{{.Node.Hostname}}-kafka1"
    environment:
      <<: *default-env
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${KAFKA_1_ADVERTISED_LISTENER:-kafka-1:9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "${KAFKA_CLUSTER_NODE_JVM_HEAP_OPTS:--Xms1g -Xmx1g}"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}"
      KAFKA_NUM_PARTITIONS: "${KAFKA_NUM_PARTITIONS:-3}"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "${KAFKA_DEFAULT_REPLICATION_FACTOR:-3}"
      KAFKA_MIN_INSYNC_REPLICAS: "${KAFKA_MIN_INSYNC_REPLICAS:-2}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-3}"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-3}"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-2}"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'kafka\\.Kafka' >/dev/null || pgrep -f 'kafka\\.KRaft' >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    volumes:
      - *localtime-volume
      - type: ${KAFKA_1_DATA_MOUNT_TYPE:-volume}
        source: ${KAFKA_1_DATA_MOUNT_SOURCE:-kafka_1_data}
        target: /var/lib/kafka/data
    networks:
      - cloudreve_backend
    deploy:
      endpoint_mode: dnsrr
      replicas: 1
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${KAFKA_NODE_1_CONSTRAINT:-node.labels.cloudreve.kafka1==true}
      resources:
        reservations:
          cpus: "${KAFKA_CLUSTER_NODE_CPU_RESERVATION:-1.0}"
          memory: "${KAFKA_CLUSTER_NODE_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${KAFKA_CLUSTER_NODE_CPU_LIMIT:-2.0}"
          memory: "${KAFKA_CLUSTER_NODE_MEM_LIMIT:-4G}"

  kafka-2:
    <<: *service-base
    image: ${KAFKA_IMAGE:-apache/kafka:4.2.0}
    hostname: "{{.Node.Hostname}}-kafka2"
    environment:
      <<: *default-env
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${KAFKA_2_ADVERTISED_LISTENER:-kafka-2:9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "${KAFKA_CLUSTER_NODE_JVM_HEAP_OPTS:--Xms1g -Xmx1g}"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}"
      KAFKA_NUM_PARTITIONS: "${KAFKA_NUM_PARTITIONS:-3}"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "${KAFKA_DEFAULT_REPLICATION_FACTOR:-3}"
      KAFKA_MIN_INSYNC_REPLICAS: "${KAFKA_MIN_INSYNC_REPLICAS:-2}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-3}"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-3}"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-2}"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'kafka\\.Kafka' >/dev/null || pgrep -f 'kafka\\.KRaft' >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    volumes:
      - *localtime-volume
      - type: ${KAFKA_2_DATA_MOUNT_TYPE:-volume}
        source: ${KAFKA_2_DATA_MOUNT_SOURCE:-kafka_2_data}
        target: /var/lib/kafka/data
    networks:
      - cloudreve_backend
    deploy:
      endpoint_mode: dnsrr
      replicas: 1
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${KAFKA_NODE_2_CONSTRAINT:-node.labels.cloudreve.kafka2==true}
      resources:
        reservations:
          cpus: "${KAFKA_CLUSTER_NODE_CPU_RESERVATION:-1.0}"
          memory: "${KAFKA_CLUSTER_NODE_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${KAFKA_CLUSTER_NODE_CPU_LIMIT:-2.0}"
          memory: "${KAFKA_CLUSTER_NODE_MEM_LIMIT:-4G}"

  kafka-3:
    <<: *service-base
    image: ${KAFKA_IMAGE:-apache/kafka:4.2.0}
    hostname: "{{.Node.Hostname}}-kafka3"
    environment:
      <<: *default-env
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: "3"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${KAFKA_3_ADVERTISED_LISTENER:-kafka-3:9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "${KAFKA_CLUSTER_NODE_JVM_HEAP_OPTS:--Xms1g -Xmx1g}"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}"
      KAFKA_NUM_PARTITIONS: "${KAFKA_NUM_PARTITIONS:-3}"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "${KAFKA_DEFAULT_REPLICATION_FACTOR:-3}"
      KAFKA_MIN_INSYNC_REPLICAS: "${KAFKA_MIN_INSYNC_REPLICAS:-2}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-3}"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-3}"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-2}"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'kafka\\.Kafka' >/dev/null || pgrep -f 'kafka\\.KRaft' >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    volumes:
      - *localtime-volume
      - type: ${KAFKA_3_DATA_MOUNT_TYPE:-volume}
        source: ${KAFKA_3_DATA_MOUNT_SOURCE:-kafka_3_data}
        target: /var/lib/kafka/data
    networks:
      - cloudreve_backend
    deploy:
      endpoint_mode: dnsrr
      replicas: 1
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${KAFKA_NODE_3_CONSTRAINT:-node.labels.cloudreve.kafka3==true}
      resources:
        reservations:
          cpus: "${KAFKA_CLUSTER_NODE_CPU_RESERVATION:-1.0}"
          memory: "${KAFKA_CLUSTER_NODE_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${KAFKA_CLUSTER_NODE_CPU_LIMIT:-2.0}"
          memory: "${KAFKA_CLUSTER_NODE_MEM_LIMIT:-4G}"

  kafka-ui:
    <<: *service-base
    image: ${KAFKA_UI_IMAGE:-provectuslabs/kafka-ui:v0.7.2}
    hostname: "{{.Node.Hostname}}-kafka-ui-{{.Task.Slot}}"
    environment:
      <<: *default-env
      SERVER_PORT: "8080"
      DYNAMIC_CONFIG_ENABLED: "${KAFKA_UI_DYNAMIC_CONFIG_ENABLED:-false}"
      JAVA_TOOL_OPTIONS: ${KAFKA_UI_JAVA_TOOL_OPTIONS:--Djavax.net.ssl.trustStore=/run/swarm-pki/ca/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit}
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_UI_CLUSTER_NAME:-cloudreve-kafka}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_UI_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: ${KAFKA_UI_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: ${KAFKA_UI_TRUSTSTORE_LOCATION:-/run/swarm-pki/ca/truststore.p12}
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_UI_TRUSTSTORE_PASSWORD:-changeit}
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: ${KAFKA_UI_TRUSTSTORE_TYPE:-PKCS12}
    volumes:
      - *localtime-volume
      - *pki-volume
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 5m
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${KAFKA_UI_REPLICAS:-1}
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${KAFKA_UI_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${KAFKA_UI_CPU_RESERVATION:-0.25}"
          memory: "${KAFKA_UI_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${KAFKA_UI_CPU_LIMIT:-1.0}"
          memory: "${KAFKA_UI_MEM_LIMIT:-1G}"

  kafka-ui-public:
    <<: *service-base
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    hostname: "{{.Node.Hostname}}-kafka-ui-public-{{.Task.Slot}}"
    environment:
      <<: *default-env
      SERVER_NAME: ${KAFKA_UI_SERVER_NAME:-_}
      TLS_CERT_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/kafka-ui-public/fullchain.crt
      TLS_KEY_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/kafka-ui-public/tls.key
      UPSTREAM_SCHEME: http
      UPSTREAM_SERVICE: kafka-ui:8080
      CLIENT_MAX_BODY_SIZE: ${KAFKA_UI_CLIENT_MAX_BODY_SIZE:-0}
      PROXY_READ_TIMEOUT: ${KAFKA_UI_PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${KAFKA_UI_PROXY_SEND_TIMEOUT:-3600s}
    configs:
      - source: http_tls_proxy_template_v2
        target: /etc/nginx/templates/default.conf.template
        mode: 0444
    ports:
      - target: 443
        published: ${KAFKA_UI_HTTP_PORT:-18089}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O - https://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${KAFKA_UI_PUBLIC_REPLICAS:-1}
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${KAFKA_UI_PUBLIC_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${KAFKA_UI_PUBLIC_CPU_RESERVATION:-0.25}"
          memory: "${KAFKA_UI_PUBLIC_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${KAFKA_UI_PUBLIC_CPU_LIMIT:-1.0}"
          memory: "${KAFKA_UI_PUBLIC_MEM_LIMIT:-512M}"

configs:
  swarm_secret_wrap_v1:
    file: ./docker/swarm/swarm-secret-wrap.sh
  minio_cluster_proxy_cfg_v2:
    file: ./docker/swarm/haproxy/minio-cluster.cfg
  minio_public_tls_cfg_v2:
    file: ./docker/swarm/haproxy/minio-public-tls.cfg
  minio_swarm_entrypoint_v1:
    file: ./docker/swarm/minio-swarm-entrypoint.sh
  minio_init_v1:
    file: ./docker/swarm/minio-init.sh
  elasticsearch_cluster_proxy_cfg_v2:
    file: ./docker/swarm/haproxy/elasticsearch-cluster.cfg
  elasticsearch_public_tls_cfg_v2:
    file: ./docker/swarm/haproxy/elasticsearch-public-tls.cfg
  kafka_cluster_proxy_cfg_v3:
    file: ./docker/swarm/haproxy/kafka-cluster.cfg
  elasticsearch_swarm_entrypoint_v1:
    file: ./docker/swarm/elasticsearch-swarm-entrypoint.sh
  http_tls_proxy_template_v2:
    file: ./docker/swarm/nginx/http-tls-proxy.conf.template

secrets:
  minio_root_password:
    external: true
    name: ${SWARM_SECRET_MINIO_ROOT_PASSWORD_NAME:?set SWARM_SECRET_MINIO_ROOT_PASSWORD_NAME}

volumes:
  minio_1_data:
  minio_2_data:
  minio_3_data:
  minio_4_data:
  elasticsearch_1_data:
  elasticsearch_2_data:
  elasticsearch_3_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:

networks:
  cloudreve_backend:
    external: true
    name: ${SWARM_SHARED_NETWORK:?set SWARM_SHARED_NETWORK}
