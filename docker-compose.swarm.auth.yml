# 统一认证（authverse 前端 + authverse-backend 后端）Swarm 部署模板。
#
# 设计目标：
# 1. 统一认证独立成栈部署，不和 Cloudreve 主栈强耦合。
# 2. 复用现有 Cloudreve Swarm 的 PostgreSQL / Redis / Elasticsearch 与 overlay 网络。
# 3. 统一认证对外只暴露 1 个入口，由 authverse 前端内置 Nginx 负责：
#    - `/`             -> authverse 前端静态资源
#    - `/admin-api`    -> authverse-backend
#    - `/app-api`      -> authverse-backend
#    - `/.well-known`  -> authverse-backend OIDC Discovery / JWKS
#    - `/oidc`         -> authverse-backend 登出与 OIDC 能力
#    - `/api` `/s/` `/f/` `/manifest.json` -> Cloudreve 主站服务
# 4. 外部流量由 Swarm ingress 负责分发到 `authverse-web` 多副本；
#    `authverse-web` 再把认证 API 转发给 `authverse-backend`，
#    而 `authverse-backend` 访问 PG / Redis / ES 仍走共享 overlay 网络。
#
# 重要说明：
# - 这个栈依赖 Cloudreve 主栈已经先部署完成，并且共享网络存在。
# - 默认共享网络名来自 `AUTHVERSE_SHARED_NETWORK`，通常是 `cloudreve_cloudreve_backend`。
# - 如果要覆盖 OIDC RSA 密钥，支持 bind / volume 两种挂载模式；默认仍使用镜像内 classpath 密钥。

services:
  authverse-web:
    image: ${AUTHVERSE_WEB_IMAGE:?set AUTHVERSE_WEB_IMAGE}
    hostname: "{{.Node.Hostname}}-authverse-web-{{.Task.Slot}}"
    environment:
      SERVER_NAME: ${AUTHVERSE_SERVER_NAME:-_}
      CLIENT_MAX_BODY_SIZE: ${AUTHVERSE_CLIENT_MAX_BODY_SIZE:-0}
      PROXY_READ_TIMEOUT: ${AUTHVERSE_PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${AUTHVERSE_PROXY_SEND_TIMEOUT:-3600s}
      UPSTREAM_AUTHVERSE_BACKEND: ${AUTHVERSE_BACKEND_UPSTREAM:-authverse-backend:48080}
      UPSTREAM_AUTHVERSE_BACKEND_HOST_HEADER: ${AUTHVERSE_BACKEND_HOST_HEADER:-$$host}
      UPSTREAM_CLOUDREVE: ${AUTHVERSE_CLOUDREVE_INTERNAL_UPSTREAM:?set AUTHVERSE_CLOUDREVE_INTERNAL_UPSTREAM}
      UPSTREAM_CLOUDREVE_HOST_HEADER: ${AUTHVERSE_CLOUDREVE_HOST_HEADER:-$$host}
    ports:
      - target: 80
        published: ${AUTHVERSE_HTTP_PORT:-18080}
        protocol: tcp
        mode: ingress
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      replicas: ${AUTHVERSE_WEB_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 2m
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${AUTHVERSE_WEB_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${AUTHVERSE_WEB_CPU_RESERVATION:-0.25}"
          memory: "${AUTHVERSE_WEB_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${AUTHVERSE_WEB_CPU_LIMIT:-1.0}"
          memory: "${AUTHVERSE_WEB_MEM_LIMIT:-512M}"

  authverse-backend:
    image: ${AUTHVERSE_BACKEND_IMAGE:?set AUTHVERSE_BACKEND_IMAGE}
    hostname: "{{.Node.Hostname}}-authverse-backend-{{.Task.Slot}}"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_OPTS: ${AUTHVERSE_JAVA_OPTS:--Xms1g -Xmx2g -Djava.security.egd=file:/dev/./urandom}
      ARGS: >-
        --server.port=48080
        --server.forward-headers-strategy=framework
        --spring.datasource.dynamic.datasource.master.url=${AUTHVERSE_DB_MASTER_URL:?set AUTHVERSE_DB_MASTER_URL}
        --spring.datasource.dynamic.datasource.master.username=${AUTHVERSE_DB_USERNAME:?set AUTHVERSE_DB_USERNAME}
        --spring.datasource.dynamic.datasource.master.password=${AUTHVERSE_DB_PASSWORD:?set AUTHVERSE_DB_PASSWORD}
        --spring.datasource.dynamic.datasource.slave.url=${AUTHVERSE_DB_SLAVE_URL:?set AUTHVERSE_DB_SLAVE_URL}
        --spring.datasource.dynamic.datasource.slave.username=${AUTHVERSE_DB_SLAVE_USERNAME:?set AUTHVERSE_DB_SLAVE_USERNAME}
        --spring.datasource.dynamic.datasource.slave.password=${AUTHVERSE_DB_SLAVE_PASSWORD:?set AUTHVERSE_DB_SLAVE_PASSWORD}
        --spring.data.redis.host=${AUTHVERSE_REDIS_HOST:?set AUTHVERSE_REDIS_HOST}
        --spring.data.redis.port=${AUTHVERSE_REDIS_PORT:-6379}
        --spring.data.redis.password=${AUTHVERSE_REDIS_PASSWORD:?set AUTHVERSE_REDIS_PASSWORD}
        --spring.data.redis.database=${AUTHVERSE_REDIS_DATABASE:-0}
        --spring.servlet.multipart.max-file-size=${AUTHVERSE_MAX_FILE_SIZE:-64MB}
        --spring.servlet.multipart.max-request-size=${AUTHVERSE_MAX_REQUEST_SIZE:-128MB}
        --yudao.tenant.enable=${AUTHVERSE_TENANT_ENABLED:-false}
        --yudao.web.admin-ui.url=${AUTHVERSE_PUBLIC_BASE_URL:?set AUTHVERSE_PUBLIC_BASE_URL}
        --yudao.cloudreve.base-uri=${AUTHVERSE_CLOUDREVE_PUBLIC_BASE_URL:?set AUTHVERSE_CLOUDREVE_PUBLIC_BASE_URL}
        --yudao.search.elasticsearch.enabled=${AUTHVERSE_ELASTICSEARCH_ENABLED:-true}
        --yudao.search.elasticsearch.uris[0]=${AUTHVERSE_ELASTICSEARCH_URI:?set AUTHVERSE_ELASTICSEARCH_URI}
        --yudao.search.elasticsearch.connection-timeout=${AUTHVERSE_ELASTICSEARCH_CONNECTION_TIMEOUT:-3s}
        --yudao.search.elasticsearch.socket-timeout=${AUTHVERSE_ELASTICSEARCH_SOCKET_TIMEOUT:-10s}
        --yudao.search.elasticsearch.connection-request-timeout=${AUTHVERSE_ELASTICSEARCH_CONNECTION_REQUEST_TIMEOUT:-3s}
        --yudao.oidc.enabled=${AUTHVERSE_OIDC_ENABLED:-true}
        --yudao.oidc.issuer=${AUTHVERSE_PUBLIC_BASE_URL:?set AUTHVERSE_PUBLIC_BASE_URL}
        --yudao.oidc.rsa.auto-generate=${AUTHVERSE_OIDC_RSA_AUTO_GENERATE:-false}
        --yudao.oidc.rsa.private-key-path=${AUTHVERSE_OIDC_PRIVATE_KEY_PATH:-classpath:oidc/private.pem}
        --yudao.oidc.rsa.public-key-path=${AUTHVERSE_OIDC_PUBLIC_KEY_PATH:-classpath:oidc/public.pem}
        --yudao.oidc.rsa.key-id=${AUTHVERSE_OIDC_KEY_ID:-oidc-rsa-key-prod}
        --yudao.oidc.callback.enabled=${AUTHVERSE_TOKEN_CALLBACK_ENABLED:-true}
        --yudao.oidc.callback.timeout=${AUTHVERSE_TOKEN_CALLBACK_TIMEOUT_MS:-5000}
        --yudao.oidc.callback.retry-times=${AUTHVERSE_TOKEN_CALLBACK_RETRY_TIMES:-3}
        --yudao.oidc.callback.retry-interval=${AUTHVERSE_TOKEN_CALLBACK_RETRY_INTERVAL_MS:-1000}
        --yudao.websocket.sender-type=${AUTHVERSE_WEBSOCKET_SENDER_TYPE:-redis}
    volumes:
      - type: ${AUTHVERSE_OIDC_KEYS_MOUNT_TYPE:-volume}
        source: ${AUTHVERSE_OIDC_KEYS_MOUNT_SOURCE:-authverse_oidc_keys}
        target: /run/authverse/oidc
        read_only: true
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:48080/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      replicas: ${AUTHVERSE_BACKEND_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: ${SWARM_ROLLING_ORDER:-start-first}
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 2m
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${AUTHVERSE_BACKEND_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${AUTHVERSE_BACKEND_CPU_RESERVATION:-1.0}"
          memory: "${AUTHVERSE_BACKEND_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${AUTHVERSE_BACKEND_CPU_LIMIT:-2.0}"
          memory: "${AUTHVERSE_BACKEND_MEM_LIMIT:-4G}"

networks:
  cloudreve_backend:
    external: true
    name: ${AUTHVERSE_SHARED_NETWORK:?set AUTHVERSE_SHARED_NETWORK}

volumes:
  authverse_oidc_keys:
