# 统一认证（authverse 前端 + authverse-backend 后端）Swarm 部署模板。
#
# 设计目标：
# 1. 统一认证独立成栈部署，不和 Cloudreve 主栈强耦合。
# 2. 复用现有 Cloudreve Swarm 的 PostgreSQL / Redis / Elasticsearch 与共享 overlay 网络。
# 3. 统一认证对外只暴露 1 个入口，由 authverse 前端内置 Nginx 负责：
#    - `/`             -> authverse 前端静态资源
#    - `/admin-api`    -> authverse-backend
#    - `/app-api`      -> authverse-backend
#    - `/.well-known`  -> authverse-backend OIDC Discovery / JWKS
#    - `/oidc`         -> authverse-backend 登出与 OIDC 能力
#    - `/api` `/s/` `/f/` `/manifest.json` -> Cloudreve 主站服务
# 4. 外部流量由 Swarm ingress 负责分发到 `authverse-web` 多副本；
#    `authverse-web` 再把认证 API 转发给 `authverse-backend`，
#    而 `authverse-backend` 访问 PG / Redis / ES 仍走共享 overlay 网络。
#
# 重要说明：
# - 这个栈依赖 foundation / infra / cloudreve 等独立栈已经先部署完成。
# - 默认共享网络名来自 `AUTHVERSE_SHARED_NETWORK`，通常等于 `SWARM_SHARED_NETWORK`。
# - 如果要覆盖 OIDC RSA 密钥，支持 bind / volume 两种挂载模式；默认仍使用镜像内 classpath 密钥。

x-default-env: &default-env
  TZ: ${SWARM_TIMEZONE:-Asia/Shanghai}

x-localtime-volume: &localtime-volume
  type: ${SWARM_LOCALTIME_MOUNT_TYPE:-bind}
  source: ${SWARM_LOCALTIME_MOUNT_SOURCE:-/etc/localtime}
  target: /etc/localtime
  read_only: true

x-pki-volume: &pki-volume
  type: ${SWARM_PKI_MOUNT_TYPE:-bind}
  source: ${SWARM_PKI_MOUNT_SOURCE:-/srv/cloudreve/pki}
  target: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}
  read_only: true

x-default-logging: &default-logging
  driver: ${SWARM_LOGGING_DRIVER:-json-file}
  options:
    max-size: "${SWARM_LOGGING_MAX_SIZE:-20m}"
    max-file: "${SWARM_LOGGING_MAX_FILE:-5}"
    compress: "${SWARM_LOGGING_COMPRESS:-true}"

x-service-base: &service-base
  logging: *default-logging

x-delayed-update-config: &delayed-update-config
  parallelism: 1
  order: ${SWARM_ROLLING_ORDER:-start-first}
  failure_action: rollback
  delay: 10s

x-default-rollback-config: &default-rollback-config
  parallelism: 1
  order: stop-first

x-default-restart-policy: &default-restart-policy
  condition: any
  delay: 5s
  window: 2m

services:
  authverse-web:
    <<: *service-base
    image: ${AUTHVERSE_WEB_IMAGE:?set AUTHVERSE_WEB_IMAGE}
    hostname: "{{.Node.Hostname}}-authverse-web-{{.Task.Slot}}"
    environment:
      <<: *default-env
      SERVER_NAME: ${AUTHVERSE_SERVER_NAME:-_}
      TLS_CERT_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/authverse-web/fullchain.crt
      TLS_KEY_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/authverse-web/tls.key
      CLIENT_MAX_BODY_SIZE: ${AUTHVERSE_CLIENT_MAX_BODY_SIZE:-0}
      PROXY_READ_TIMEOUT: ${AUTHVERSE_PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${AUTHVERSE_PROXY_SEND_TIMEOUT:-3600s}
      UPSTREAM_AUTHVERSE_BACKEND: ${AUTHVERSE_BACKEND_UPSTREAM:-authverse-backend:48080}
      UPSTREAM_AUTHVERSE_BACKEND_HOST_HEADER: ${AUTHVERSE_BACKEND_HOST_HEADER:-$$host}
      UPSTREAM_CLOUDREVE: ${AUTHVERSE_CLOUDREVE_INTERNAL_UPSTREAM:?set AUTHVERSE_CLOUDREVE_INTERNAL_UPSTREAM}
      UPSTREAM_CLOUDREVE_HOST_HEADER: ${AUTHVERSE_CLOUDREVE_HOST_HEADER:-$$host}
    configs:
      - source: authverse_proxy_template_v1
        target: /etc/nginx/templates/default.conf.template
        mode: 0444
    ports:
      - target: 443
        published: ${AUTHVERSE_HTTP_PORT:-18080}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O - https://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      replicas: ${AUTHVERSE_WEB_REPLICAS:-2}
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${AUTHVERSE_WEB_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${AUTHVERSE_WEB_CPU_RESERVATION:-0.25}"
          memory: "${AUTHVERSE_WEB_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${AUTHVERSE_WEB_CPU_LIMIT:-1.0}"
          memory: "${AUTHVERSE_WEB_MEM_LIMIT:-512M}"

  authverse-backend:
    <<: *service-base
    image: ${AUTHVERSE_BACKEND_IMAGE:?set AUTHVERSE_BACKEND_IMAGE}
    hostname: "{{.Node.Hostname}}-authverse-backend-{{.Task.Slot}}"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/__cacert_entrypoint.sh"]
    command: ["sh", "-c", "exec java $$$$JAVA_OPTS -jar app.jar $$$$ARGS"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: ARGS=authverse_backend_args
      SPRING_PROFILES_ACTIVE: local
      JAVA_OPTS: ${AUTHVERSE_JAVA_OPTS_EFFECTIVE:--Xms1g -Xmx2g -Djava.security.egd=file:/dev/./urandom}
      JAVA_TOOL_OPTIONS: ${AUTHVERSE_JAVA_TOOL_OPTIONS:--Djavax.net.ssl.trustStore=/run/swarm-pki/ca/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit}
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
    secrets:
      - authverse_backend_args
    volumes:
      - *localtime-volume
      - *pki-volume
      - type: ${AUTHVERSE_OIDC_KEYS_MOUNT_TYPE:-volume}
        source: ${AUTHVERSE_OIDC_KEYS_MOUNT_SOURCE:-authverse_oidc_keys}
        target: /run/authverse/oidc
        read_only: true
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:48080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: ${AUTHVERSE_BACKEND_HEALTHCHECK_START_PERIOD:-180s}
    deploy:
      replicas: ${AUTHVERSE_BACKEND_REPLICAS:-2}
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${AUTHVERSE_BACKEND_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${AUTHVERSE_BACKEND_CPU_RESERVATION:-1.0}"
          memory: "${AUTHVERSE_BACKEND_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${AUTHVERSE_BACKEND_CPU_LIMIT:-2.0}"
          memory: "${AUTHVERSE_BACKEND_MEM_LIMIT:-4G}"

networks:
  cloudreve_backend:
    external: true
    name: ${AUTHVERSE_SHARED_NETWORK:?set AUTHVERSE_SHARED_NETWORK}

volumes:
  authverse_oidc_keys:

configs:
  swarm_secret_wrap_v1:
    file: ./docker/swarm/swarm-secret-wrap.sh
  authverse_proxy_template_v1:
    file: ./docker/swarm/nginx/authverse-proxy.conf.template

secrets:
  authverse_backend_args:
    external: true
    name: ${SWARM_SECRET_AUTHVERSE_BACKEND_ARGS_NAME:?set SWARM_SECRET_AUTHVERSE_BACKEND_ARGS_NAME}
