services:
  cloudreve:
    image: cloudreve/cloudreve:latest
    container_name: cloudreve-backend
    depends_on:
      - postgresql
      - redis
    restart: unless-stopped
    ports:
      - 5212:5212
      - 6888:6888
      - 6888:6888/udp
    environment:
      - CR_CONF_Database.Type=postgres
      - CR_CONF_Database.Host=postgresql
      - CR_CONF_Database.User=cloudreve
      - CR_CONF_Database.Name=cloudreve
      - CR_CONF_Database.Port=5432
      - CR_CONF_Redis.Server=redis:6379
    volumes:
      - backend_data:/cloudreve/data

  postgresql:
    # Best practice: Pin to major version.
    # NOTE: For major version jumps:
    # backup & consult https://www.postgresql.org/docs/current/pgupgrade.html
    image: postgres:17
    container_name: postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_USER=cloudreve
      - POSTGRES_DB=cloudreve
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: bitnami/minio:2024
    container_name: minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio123456}
      - MINIO_DISTRIBUTED_MODE_ENABLED=no
      - MINIO_SKIP_CLIENT=yes
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data

  elasticsearch:
    image: elasticsearch:8.12.2
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  tika:
    build:
      context: .
      dockerfile: docker/tika-unrar/Dockerfile
    image: cloudreve/tika:3.2.3.0-full-unrar-charset
    container_name: tika
    restart: unless-stopped
    environment:
      - TIKA_FONT_DIRS=${TIKA_FONT_DIRS:-/tika-fonts/custom}
      - TIKA_FONT_DEBUG=${TIKA_FONT_DEBUG:-0}
    ports:
      - "9998:9998"
    volumes:
      - ${TIKA_CUSTOM_FONTS_HOST_PATH:-./docker/tika-unrar/fonts}:/tika-fonts/custom:ro
      # 额外挂载更多字体目录时，可在这里追加 volume，并把容器内路径追加到 TIKA_FONT_DIRS
      # - /absolute/path/to/company-fonts:/tika-fonts/company:ro

volumes:
  backend_data:
  minio_data:
  elasticsearch_data:
  pg_data:
  redis_data:
