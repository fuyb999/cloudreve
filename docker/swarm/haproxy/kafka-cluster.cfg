global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend kafka_bootstrap
    bind *:9092
    mode tcp
    default_backend kafka_nodes

backend kafka_nodes
    mode tcp
    balance roundrobin
    option tcp-check
    server kafka1 kafka-1:9092 check
    server kafka2 kafka-2:9092 check
    server kafka3 kafka-3:9092 check
