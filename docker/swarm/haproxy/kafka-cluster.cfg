global
    log stdout format raw local0
    maxconn 4096
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log global
    timeout connect 5s
    timeout client 1m
    timeout server 1m

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 10s

frontend kafka_bootstrap
    bind *:9092
    mode tcp
    default_backend kafka_nodes

backend kafka_nodes
    mode tcp
    balance roundrobin
    option tcp-check
    default-server resolvers docker init-addr libc,none resolve-prefer ipv4
    server kafka1 kafka-1:9092 check
    server kafka2 kafka-2:9092 check
    server kafka3 kafka-3:9092 check
