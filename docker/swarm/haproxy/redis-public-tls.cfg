global
    log stdout format raw local0
    maxconn 4096
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log global
    timeout connect 5s
    timeout client 1m
    timeout server 1m

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 10s

frontend redis_tls
    bind *:6379 ssl crt /run/swarm-pki/services/redis-proxy/haproxy.pem
    mode tcp
    default_backend redis_backend

backend redis_backend
    mode tcp
    option tcp-check
    tcp-check send-binary 2a310d0a24340d0a50494e470d0a
    tcp-check expect rstring ^(\+PONG|-NOAUTH)
    default-server resolvers docker init-addr libc,none resolve-prefer ipv4
    server-template redis 10 tasks.redis-proxy-internal:6379 check inter 2s fall 3 rise 2
