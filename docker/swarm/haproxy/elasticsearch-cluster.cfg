global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    timeout connect 5s
    timeout client 1m
    timeout server 1m

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 10s

frontend elasticsearch_http
    bind *:9200
    mode http
    default_backend elasticsearch_http_nodes

frontend elasticsearch_transport
    bind *:9300
    mode tcp
    default_backend elasticsearch_transport_nodes

backend elasticsearch_http_nodes
    mode http
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    default-server resolvers docker init-addr libc,none resolve-prefer ipv4
    server es1 elasticsearch-1:9200 check
    server es2 elasticsearch-2:9200 check
    server es3 elasticsearch-3:9200 check

backend elasticsearch_transport_nodes
    mode tcp
    balance roundrobin
    option tcp-check
    default-server resolvers docker init-addr libc,none resolve-prefer ipv4
    server es1 elasticsearch-1:9300 check
    server es2 elasticsearch-2:9300 check
    server es3 elasticsearch-3:9300 check
