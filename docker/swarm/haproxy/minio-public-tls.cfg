global
    log stdout format raw local0
    maxconn 4096
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log global
    timeout connect 5s
    timeout client 5m
    timeout server 5m

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 10s

frontend minio_api_tls
    bind *:9000 ssl crt /run/swarm-pki/services/minio/haproxy.pem
    mode tcp
    default_backend minio_api_backend

frontend minio_console_tls
    bind *:9001 ssl crt /run/swarm-pki/services/minio/haproxy.pem
    mode tcp
    default_backend minio_console_backend

backend minio_api_backend
    mode tcp
    option tcp-check
    default-server resolvers docker init-addr libc,none resolve-prefer ipv4
    server minio minio-internal:9000 check

backend minio_console_backend
    mode tcp
    option tcp-check
    default-server resolvers docker init-addr libc,none resolve-prefer ipv4
    server minio minio-internal:9001 check
