global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend minio_api
    bind *:9000
    mode tcp
    default_backend minio_api_node

frontend minio_console
    bind *:9001
    mode tcp
    default_backend minio_console_node

backend minio_api_node
    mode tcp
    option tcp-check
    tcp-check connect
    server minio1 minio-1:9000 check

backend minio_console_node
    mode tcp
    option tcp-check
    tcp-check connect
    server minio1 minio-1:9001 check
