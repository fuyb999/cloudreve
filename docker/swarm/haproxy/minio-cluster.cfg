global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend minio_api
    bind *:9000
    mode tcp
    default_backend minio_api_nodes

frontend minio_console
    bind *:9001
    mode tcp
    default_backend minio_console_nodes

backend minio_api_nodes
    mode tcp
    balance roundrobin
    option tcp-check
    server minio1 minio-1:9000 check
    server minio2 minio-2:9000 check
    server minio3 minio-3:9000 check
    server minio4 minio-4:9000 check

backend minio_console_nodes
    mode tcp
    balance roundrobin
    option tcp-check
    server minio1 minio-1:9001 check
    server minio2 minio-2:9001 check
    server minio3 minio-3:9001 check
    server minio4 minio-4:9001 check
