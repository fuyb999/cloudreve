global
    log stdout format raw local0
    maxconn 4096
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log global
    timeout connect 5s
    timeout client 1m
    timeout server 1m

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 10s

frontend elasticsearch_http_tls
    bind *:9200 ssl crt /run/swarm-pki/services/elasticsearch/haproxy.pem
    mode http
    default_backend elasticsearch_http_backend

frontend elasticsearch_transport_tls
    bind *:9300 ssl crt /run/swarm-pki/services/elasticsearch/haproxy.pem
    mode tcp
    default_backend elasticsearch_transport_backend

backend elasticsearch_http_backend
    mode http
    option httpchk GET /
    http-check expect status 200
    default-server resolvers docker init-addr libc,none resolve-prefer ipv4
    server es elasticsearch-internal:9200 check

backend elasticsearch_transport_backend
    mode tcp
    option tcp-check
    default-server resolvers docker init-addr libc,none resolve-prefer ipv4
    server es elasticsearch-internal:9300 check
