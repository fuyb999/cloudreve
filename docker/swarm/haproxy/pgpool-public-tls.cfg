global
    log stdout format raw local0
    maxconn 4096
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log global
    timeout connect 5s
    timeout client 1m
    timeout server 1m

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 10s

frontend pgpool_tls
    bind *:5432 ssl crt /run/swarm-pki/services/pgpool/haproxy.pem
    mode tcp
    default_backend pgpool_backend

backend pgpool_backend
    mode tcp
    option tcp-check
    default-server resolvers docker init-addr libc,none resolve-prefer ipv4
    server pgpool pgpool-internal:5432 check
