# Cloudreve Swarm 基础中间件模板。
#
# 包含：
# - PostgreSQL 3 节点 + Pgpool
# - Redis 3 节点 + Sentinel + Proxy
# - Tika
# - OnlyOffice 8
#
# 说明：
# - 这个文件用于独立发布 PostgreSQL / Redis / Tika / OnlyOffice 这一组基础中间件。
# - 典型方式是对同一个 stack name 再执行一次：
#   - `docker/swarm/deploy-stack.sh foundation --stack-name cloudreve-prod`
# - `minio-init` 不放在这里，而是跟随 `docker-compose.swarm.infra.yml` 中的 `minio`
#   入口一起发布，避免 foundation 单独部署时出现无意义的初始化重试。
# - 默认单节点联调走 `docker-compose.swarm.single.yml`。
# - `onlyoffice` 使用外置 `pgpool + redis-proxy + onlyoffice-rabbitmq`，这样才能在 Swarm 下安全开多副本。
# - 社区版这里实现的是 Swarm 级多副本高可用编排，不是 ONLYOFFICE 商业版官方集群产品形态。

x-default-env: &default-env
  TZ: ${SWARM_TIMEZONE:-Asia/Shanghai}

x-localtime-volume: &localtime-volume
  type: ${SWARM_LOCALTIME_MOUNT_TYPE:-bind}
  source: ${SWARM_LOCALTIME_MOUNT_SOURCE:-/etc/localtime}
  target: /etc/localtime
  read_only: true

x-pki-volume: &pki-volume
  type: ${SWARM_PKI_MOUNT_TYPE:-bind}
  source: ${SWARM_PKI_MOUNT_SOURCE:-/srv/cloudreve/pki}
  target: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}
  read_only: true

x-default-logging: &default-logging
  driver: ${SWARM_LOGGING_DRIVER:-json-file}
  options:
    max-size: "${SWARM_LOGGING_MAX_SIZE:-20m}"
    max-file: "${SWARM_LOGGING_MAX_FILE:-5}"
    compress: "${SWARM_LOGGING_COMPRESS:-true}"

x-service-base: &service-base
  logging: *default-logging

x-stateful-update-config: &stateful-update-config
  order: stop-first

x-default-update-config: &default-update-config
  parallelism: 1
  order: ${SWARM_ROLLING_ORDER:-start-first}
  failure_action: rollback

x-delayed-update-config: &delayed-update-config
  <<: *default-update-config
  delay: 10s

x-default-rollback-config: &default-rollback-config
  parallelism: 1
  order: stop-first

x-default-restart-policy: &default-restart-policy
  condition: any
  delay: 5s
  window: 2m

x-restart-policy-with-attempts: &restart-policy-with-attempts
  <<: *default-restart-policy
  max_attempts: 10

x-onlyoffice-restart-policy: &onlyoffice-restart-policy
  condition: any
  delay: 10s
  max_attempts: 10
  window: 3m

services:
  postgresql-1:
    <<: *service-base
    image: ${POSTGRESQL_REPMGR_IMAGE:-bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2}
    hostname: "{{.Node.Hostname}}-pg1"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/postgresql-repmgr/entrypoint.sh"]
    command: ["/opt/bitnami/scripts/postgresql-repmgr/run.sh"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: POSTGRESQL_POSTGRES_PASSWORD=postgresql_postgres_password,POSTGRESQL_PASSWORD=postgresql_password,REPMGR_PASSWORD=repmgr_password
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE:-cloudreve}
      POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: ${POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS:-1}
      REPMGR_PRIMARY_HOST: ${REPMGR_PRIMARY_HOST:-postgresql-1}
      REPMGR_PARTNER_NODES: ${REPMGR_PARTNER_NODES:-postgresql-1,postgresql-2,postgresql-3}
      REPMGR_NODE_NAME: postgresql-1
      REPMGR_NODE_NETWORK_NAME: postgresql-1
      REPMGR_ADVERTISE_HOST: postgresql-1
      REPMGR_NODE_ID: "1"
      REPMGR_LOG_LEVEL: NOTICE
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
      - source: postgresql_repmgr_run_v4
        target: /opt/bitnami/scripts/postgresql-repmgr/run.sh
        mode: 0555
    secrets:
      - postgresql_postgres_password
      - postgresql_password
      - repmgr_password
    volumes:
      - *localtime-volume
      - type: ${PG_1_DATA_MOUNT_TYPE:-bind}
        source: ${PG_1_DATA_MOUNT_SOURCE:?set PG_1_DATA_MOUNT_SOURCE}
        target: /bitnami/postgresql
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRESQL_USERNAME:-cloudreve} -d ${POSTGRESQL_DATABASE:-cloudreve} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 2m
    deploy:
      replicas: 1
      update_config: *stateful-update-config
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${PG_NODE_1_CONSTRAINT:-node.labels.cloudreve.pg1==true}
      resources:
        reservations:
          cpus: "${POSTGRESQL_CPU_RESERVATION:-2.0}"
          memory: "${POSTGRESQL_MEM_RESERVATION:-4G}"
        limits:
          cpus: "${POSTGRESQL_CPU_LIMIT:-4.0}"
          memory: "${POSTGRESQL_MEM_LIMIT:-8G}"

  postgresql-2:
    <<: *service-base
    image: ${POSTGRESQL_REPMGR_IMAGE:-bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2}
    hostname: "{{.Node.Hostname}}-pg2"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/postgresql-repmgr/entrypoint.sh"]
    command: ["/opt/bitnami/scripts/postgresql-repmgr/run.sh"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: POSTGRESQL_POSTGRES_PASSWORD=postgresql_postgres_password,POSTGRESQL_PASSWORD=postgresql_password,REPMGR_PASSWORD=repmgr_password
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE:-cloudreve}
      POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: ${POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS:-1}
      REPMGR_PRIMARY_HOST: ${REPMGR_PRIMARY_HOST:-postgresql-1}
      REPMGR_PARTNER_NODES: ${REPMGR_PARTNER_NODES:-postgresql-1,postgresql-2,postgresql-3}
      REPMGR_NODE_NAME: postgresql-2
      REPMGR_NODE_NETWORK_NAME: postgresql-2
      REPMGR_ADVERTISE_HOST: postgresql-2
      REPMGR_NODE_ID: "2"
      REPMGR_LOG_LEVEL: NOTICE
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
      - source: postgresql_repmgr_run_v4
        target: /opt/bitnami/scripts/postgresql-repmgr/run.sh
        mode: 0555
    secrets:
      - postgresql_postgres_password
      - postgresql_password
      - repmgr_password
    volumes:
      - *localtime-volume
      - type: ${PG_2_DATA_MOUNT_TYPE:-bind}
        source: ${PG_2_DATA_MOUNT_SOURCE:?set PG_2_DATA_MOUNT_SOURCE}
        target: /bitnami/postgresql
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRESQL_USERNAME:-cloudreve} -d ${POSTGRESQL_DATABASE:-cloudreve} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 2m
    deploy:
      replicas: 1
      update_config: *stateful-update-config
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${PG_NODE_2_CONSTRAINT:-node.labels.cloudreve.pg2==true}
      resources:
        reservations:
          cpus: "${POSTGRESQL_CPU_RESERVATION:-2.0}"
          memory: "${POSTGRESQL_MEM_RESERVATION:-4G}"
        limits:
          cpus: "${POSTGRESQL_CPU_LIMIT:-4.0}"
          memory: "${POSTGRESQL_MEM_LIMIT:-8G}"

  postgresql-3:
    <<: *service-base
    image: ${POSTGRESQL_REPMGR_IMAGE:-bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2}
    hostname: "{{.Node.Hostname}}-pg3"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/postgresql-repmgr/entrypoint.sh"]
    command: ["/opt/bitnami/scripts/postgresql-repmgr/run.sh"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: POSTGRESQL_POSTGRES_PASSWORD=postgresql_postgres_password,POSTGRESQL_PASSWORD=postgresql_password,REPMGR_PASSWORD=repmgr_password
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE:-cloudreve}
      POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: ${POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS:-1}
      REPMGR_PRIMARY_HOST: ${REPMGR_PRIMARY_HOST:-postgresql-1}
      REPMGR_PARTNER_NODES: ${REPMGR_PARTNER_NODES:-postgresql-1,postgresql-2,postgresql-3}
      REPMGR_NODE_NAME: postgresql-3
      REPMGR_NODE_NETWORK_NAME: postgresql-3
      REPMGR_ADVERTISE_HOST: postgresql-3
      REPMGR_NODE_ID: "3"
      REPMGR_LOG_LEVEL: NOTICE
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
      - source: postgresql_repmgr_run_v4
        target: /opt/bitnami/scripts/postgresql-repmgr/run.sh
        mode: 0555
    secrets:
      - postgresql_postgres_password
      - postgresql_password
      - repmgr_password
    volumes:
      - *localtime-volume
      - type: ${PG_3_DATA_MOUNT_TYPE:-bind}
        source: ${PG_3_DATA_MOUNT_SOURCE:?set PG_3_DATA_MOUNT_SOURCE}
        target: /bitnami/postgresql
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRESQL_USERNAME:-cloudreve} -d ${POSTGRESQL_DATABASE:-cloudreve} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 2m
    deploy:
      replicas: 1
      update_config: *stateful-update-config
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${PG_NODE_3_CONSTRAINT:-node.labels.cloudreve.pg3==true}
      resources:
        reservations:
          cpus: "${POSTGRESQL_CPU_RESERVATION:-2.0}"
          memory: "${POSTGRESQL_MEM_RESERVATION:-4G}"
        limits:
          cpus: "${POSTGRESQL_CPU_LIMIT:-4.0}"
          memory: "${POSTGRESQL_MEM_LIMIT:-8G}"

  pgpool-internal:
    <<: *service-base
    image: ${PGPOOL_IMAGE:-bitnamilegacy/pgpool:4.6.3-debian-12-r0}
    hostname: "{{.Node.Hostname}}-pgpool-internal-{{.Task.Slot}}"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/pgpool/entrypoint.sh"]
    command: ["/opt/bitnami/scripts/pgpool/run.sh"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: PGPOOL_POSTGRES_PASSWORD=postgresql_postgres_password,PGPOOL_SR_CHECK_PASSWORD=postgresql_password,PGPOOL_ADMIN_PASSWORD=pgpool_admin_password,PGPOOL_PASSWORD=postgresql_password
      PGPOOL_BACKEND_NODES: ${PGPOOL_BACKEND_NODES:-0:postgresql-1:5432,1:postgresql-2:5432,2:postgresql-3:5432}
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_SR_CHECK_USER: ${POSTGRESQL_USERNAME:-cloudreve}
      PGPOOL_ENABLE_LOAD_BALANCING: "no"
      PGPOOL_ENABLE_POOL_HBA: "yes"
      PGPOOL_ADMIN_USERNAME: ${PGPOOL_ADMIN_USERNAME:-admin}
      PGPOOL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
    secrets:
      - postgresql_postgres_password
      - postgresql_password
      - pgpool_admin_password
    volumes:
      - *localtime-volume
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/pgpool/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 2m
    deploy:
      replicas: ${PGPOOL_REPLICAS:-2}
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${PGPOOL_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${PGPOOL_CPU_RESERVATION:-0.5}"
          memory: "${PGPOOL_MEM_RESERVATION:-512M}"
        limits:
          cpus: "${PGPOOL_CPU_LIMIT:-2.0}"
          memory: "${PGPOOL_MEM_LIMIT:-2G}"

  pgpool:
    <<: *service-base
    image: ${REDIS_PROXY_IMAGE:-haproxy:3.0-alpine}
    hostname: "{{.Node.Hostname}}-pgpool-public-{{.Task.Slot}}"
    environment: *default-env
    configs:
      - source: pgpool_public_tls_cfg_v2
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    ports:
      - target: 5432
        published: ${PGPOOL_PUBLIC_PORT:-15432}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${PGPOOL_PUBLIC_REPLICAS:-2}
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${PGPOOL_PUBLIC_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${PGPOOL_PUBLIC_CPU_RESERVATION:-0.25}"
          memory: "${PGPOOL_PUBLIC_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${PGPOOL_PUBLIC_CPU_LIMIT:-1.0}"
          memory: "${PGPOOL_PUBLIC_MEM_LIMIT:-512M}"

  redis-1:
    <<: *service-base
    image: ${REDIS_IMAGE:-bitnamilegacy/redis:8.2.1-debian-12-r0}
    hostname: "{{.Node.Hostname}}-redis1"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/redis/entrypoint.sh"]
    command: ["/opt/bitnami/scripts/redis/run.sh"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: REDIS_PASSWORD=redis_password
      ALLOW_EMPTY_PASSWORD: "no"
      REDIS_AOF_ENABLED: ${REDIS_AOF_ENABLED:-yes}
      REDIS_REPLICATION_MODE: master
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
    secrets:
      - redis_password
    volumes:
      - *localtime-volume
      - type: ${REDIS_1_DATA_MOUNT_TYPE:-bind}
        source: ${REDIS_1_DATA_MOUNT_SOURCE:?set REDIS_1_DATA_MOUNT_SOURCE}
        target: /bitnami/redis/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$$$(cat /run/secrets/redis_password)\" ping | grep PONG >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 1
      update_config: *stateful-update-config
      restart_policy: *restart-policy-with-attempts
      placement:
        constraints:
          - ${REDIS_NODE_1_CONSTRAINT:-node.labels.cloudreve.redis1==true}
      resources:
        reservations:
          cpus: "${REDIS_CPU_RESERVATION:-1.0}"
          memory: "${REDIS_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${REDIS_CPU_LIMIT:-2.0}"
          memory: "${REDIS_MEM_LIMIT:-4G}"

  redis-2:
    <<: *service-base
    image: ${REDIS_IMAGE:-bitnamilegacy/redis:8.2.1-debian-12-r0}
    hostname: "{{.Node.Hostname}}-redis2"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/redis/entrypoint.sh"]
    command: ["/opt/bitnami/scripts/redis/run.sh"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: REDIS_MASTER_PASSWORD=redis_password,REDIS_PASSWORD=redis_password
      ALLOW_EMPTY_PASSWORD: "no"
      REDIS_AOF_ENABLED: ${REDIS_AOF_ENABLED:-yes}
      REDIS_REPLICATION_MODE: slave
      REDIS_MASTER_HOST: redis-1
      REDIS_MASTER_PORT_NUMBER: "6379"
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
    secrets:
      - redis_password
    volumes:
      - *localtime-volume
      - type: ${REDIS_2_DATA_MOUNT_TYPE:-bind}
        source: ${REDIS_2_DATA_MOUNT_SOURCE:?set REDIS_2_DATA_MOUNT_SOURCE}
        target: /bitnami/redis/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$$$(cat /run/secrets/redis_password)\" ping | grep PONG >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 1
      update_config: *stateful-update-config
      restart_policy: *restart-policy-with-attempts
      placement:
        constraints:
          - ${REDIS_NODE_2_CONSTRAINT:-node.labels.cloudreve.redis2==true}
      resources:
        reservations:
          cpus: "${REDIS_CPU_RESERVATION:-1.0}"
          memory: "${REDIS_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${REDIS_CPU_LIMIT:-2.0}"
          memory: "${REDIS_MEM_LIMIT:-4G}"

  redis-3:
    <<: *service-base
    image: ${REDIS_IMAGE:-bitnamilegacy/redis:8.2.1-debian-12-r0}
    hostname: "{{.Node.Hostname}}-redis3"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/redis/entrypoint.sh"]
    command: ["/opt/bitnami/scripts/redis/run.sh"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: REDIS_MASTER_PASSWORD=redis_password,REDIS_PASSWORD=redis_password
      ALLOW_EMPTY_PASSWORD: "no"
      REDIS_AOF_ENABLED: ${REDIS_AOF_ENABLED:-yes}
      REDIS_REPLICATION_MODE: slave
      REDIS_MASTER_HOST: redis-1
      REDIS_MASTER_PORT_NUMBER: "6379"
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
    secrets:
      - redis_password
    volumes:
      - *localtime-volume
      - type: ${REDIS_3_DATA_MOUNT_TYPE:-bind}
        source: ${REDIS_3_DATA_MOUNT_SOURCE:?set REDIS_3_DATA_MOUNT_SOURCE}
        target: /bitnami/redis/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$$$(cat /run/secrets/redis_password)\" ping | grep PONG >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 1
      update_config: *stateful-update-config
      restart_policy: *restart-policy-with-attempts
      placement:
        constraints:
          - ${REDIS_NODE_3_CONSTRAINT:-node.labels.cloudreve.redis3==true}
      resources:
        reservations:
          cpus: "${REDIS_CPU_RESERVATION:-1.0}"
          memory: "${REDIS_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${REDIS_CPU_LIMIT:-2.0}"
          memory: "${REDIS_MEM_LIMIT:-4G}"

  redis-sentinel:
    <<: *service-base
    image: ${REDIS_SENTINEL_IMAGE:-bitnamilegacy/redis-sentinel:8.2.1-debian-12-r0}
    hostname: "{{.Node.Hostname}}-redis-sentinel-{{.Task.Slot}}"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/redis-sentinel/entrypoint.sh"]
    command: ["/opt/bitnami/scripts/redis-sentinel/run.sh"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: REDIS_MASTER_PASSWORD=redis_password
      REDIS_MASTER_HOST: redis-1
      REDIS_MASTER_PORT_NUMBER: "6379"
      REDIS_MASTER_SET: ${REDIS_SENTINEL_MASTER_SET:-mymaster}
      REDIS_SENTINEL_QUORUM: ${REDIS_SENTINEL_QUORUM:-2}
      REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS: ${REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS:-5000}
      REDIS_SENTINEL_FAILOVER_TIMEOUT: ${REDIS_SENTINEL_FAILOVER_TIMEOUT:-10000}
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
    secrets:
      - redis_password
    volumes:
      - *localtime-volume
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${REDIS_SENTINEL_REPLICAS:-3}
      update_config: *default-update-config
      restart_policy: *restart-policy-with-attempts
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${REDIS_SENTINEL_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${REDIS_SENTINEL_CPU_RESERVATION:-0.25}"
          memory: "${REDIS_SENTINEL_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${REDIS_SENTINEL_CPU_LIMIT:-1.0}"
          memory: "${REDIS_SENTINEL_MEM_LIMIT:-512M}"

  redis-proxy-internal:
    <<: *service-base
    image: ${REDIS_PROXY_IMAGE:-haproxy:3.0-alpine}
    hostname: "{{.Node.Hostname}}-redis-proxy-internal-{{.Task.Slot}}"
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: REDIS_PASSWORD=redis_password
      REDIS_MASTER_HOST: ${REDIS_MASTER_HOST:-redis-1}
      REDIS_MASTER_PORT_NUMBER: ${REDIS_MASTER_PORT_NUMBER:-6379}
      REDIS_SENTINEL_HOST: ${REDIS_SENTINEL_HOST:-redis-sentinel}
      REDIS_SENTINEL_PORT_NUMBER: ${REDIS_SENTINEL_PORT_NUMBER:-26379}
      REDIS_MASTER_SET: ${REDIS_SENTINEL_MASTER_SET:-mymaster}
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/bin/sh", "/usr/local/bin/redis-proxy-bootstrap.sh"]
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
      - source: redis_proxy_bootstrap_v8
        target: /usr/local/bin/redis-proxy-bootstrap.sh
        mode: 0555
    secrets:
      - redis_password
    volumes:
      - *localtime-volume
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${REDIS_PROXY_REPLICAS:-2}
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *restart-policy-with-attempts
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${REDIS_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${REDIS_PROXY_CPU_RESERVATION:-0.25}"
          memory: "${REDIS_PROXY_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${REDIS_PROXY_CPU_LIMIT:-1.0}"
          memory: "${REDIS_PROXY_MEM_LIMIT:-512M}"

  redis-proxy:
    <<: *service-base
    image: ${REDIS_PROXY_IMAGE:-haproxy:3.0-alpine}
    hostname: "{{.Node.Hostname}}-redis-proxy-public-{{.Task.Slot}}"
    environment: *default-env
    configs:
      - source: redis_public_tls_cfg_v2
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    ports:
      - target: 6379
        published: ${REDIS_PROXY_PUBLIC_PORT:-16379}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${REDIS_PROXY_PUBLIC_REPLICAS:-2}
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *restart-policy-with-attempts
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${REDIS_PROXY_PUBLIC_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${REDIS_PROXY_PUBLIC_CPU_RESERVATION:-0.25}"
          memory: "${REDIS_PROXY_PUBLIC_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${REDIS_PROXY_PUBLIC_CPU_LIMIT:-1.0}"
          memory: "${REDIS_PROXY_PUBLIC_MEM_LIMIT:-512M}"

  tika:
    <<: *service-base
    image: ${TIKA_IMAGE:-cloudreve/tika:3.2.3.0-full-unrar-charset}
    hostname: "{{.Node.Hostname}}-tika-{{.Task.Slot}}"
    environment:
      <<: *default-env
      TIKA_FONT_DIRS: ${TIKA_FONT_DIRS:-/tika-fonts/custom}
      TIKA_FONT_DEBUG: ${TIKA_FONT_DEBUG:-0}
    volumes:
      - *localtime-volume
      - type: ${SHARED_CUSTOM_FONTS_MOUNT_TYPE:-volume}
        source: ${SHARED_CUSTOM_FONTS_MOUNT_SOURCE:-shared_custom_fonts}
        target: /tika-fonts/custom
        read_only: true
    networks:
      - cloudreve_backend
    deploy:
      replicas: ${TIKA_REPLICAS:-2}
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *restart-policy-with-attempts
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${TIKA_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${TIKA_CPU_RESERVATION:-0.5}"
          memory: "${TIKA_MEM_RESERVATION:-1G}"
        limits:
          cpus: "${TIKA_CPU_LIMIT:-2.0}"
          memory: "${TIKA_MEM_LIMIT:-2G}"

  tika-proxy:
    <<: *service-base
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    hostname: "{{.Node.Hostname}}-tika-proxy-{{.Task.Slot}}"
    environment:
      <<: *default-env
      SERVER_NAME: ${TIKA_SERVER_NAME:-_}
      TLS_CERT_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/tika-proxy/fullchain.crt
      TLS_KEY_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/tika-proxy/tls.key
      UPSTREAM_SCHEME: http
      UPSTREAM_SERVICE: tika:9998
      CLIENT_MAX_BODY_SIZE: ${TIKA_CLIENT_MAX_BODY_SIZE:-0}
      PROXY_READ_TIMEOUT: ${TIKA_PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${TIKA_PROXY_SEND_TIMEOUT:-3600s}
    configs:
      - source: http_tls_proxy_template_v2
        target: /etc/nginx/templates/default.conf.template
        mode: 0444
    ports:
      - target: 443
        published: ${TIKA_HTTP_PORT:-19998}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O - https://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: ${TIKA_PROXY_REPLICAS:-2}
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${TIKA_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${TIKA_PROXY_CPU_RESERVATION:-0.25}"
          memory: "${TIKA_PROXY_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${TIKA_PROXY_CPU_LIMIT:-1.0}"
          memory: "${TIKA_PROXY_MEM_LIMIT:-512M}"

  onlyoffice-rabbitmq:
    <<: *service-base
    image: ${ONLYOFFICE_RABBITMQ_IMAGE:-rabbitmq:3.13.7-alpine}
    hostname: "{{.Node.Hostname}}-onlyoffice-rmq"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "docker-entrypoint.sh"]
    command: ["rabbitmq-server"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: RABBITMQ_DEFAULT_PASS=onlyoffice_rabbitmq_password
      RABBITMQ_DEFAULT_USER: ${ONLYOFFICE_RABBITMQ_USER:-onlyoffice}
      RABBITMQ_DEFAULT_VHOST: ${ONLYOFFICE_RABBITMQ_VHOST:-onlyoffice}
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
    secrets:
      - onlyoffice_rabbitmq_password
    volumes:
      - *localtime-volume
      - type: ${ONLYOFFICE_RABBITMQ_MOUNT_TYPE:-volume}
        source: ${ONLYOFFICE_RABBITMQ_MOUNT_SOURCE:-onlyoffice_rabbitmq}
        target: /var/lib/rabbitmq
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 10m
    deploy:
      replicas: ${ONLYOFFICE_RABBITMQ_REPLICAS:-1}
      update_config: *stateful-update-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${ONLYOFFICE_RABBITMQ_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${ONLYOFFICE_RABBITMQ_CPU_RESERVATION:-0.25}"
          memory: "${ONLYOFFICE_RABBITMQ_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${ONLYOFFICE_RABBITMQ_CPU_LIMIT:-1.0}"
          memory: "${ONLYOFFICE_RABBITMQ_MEM_LIMIT:-1G}"

  onlyoffice:
    <<: *service-base
    image: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver:8.2.2}
    hostname: "{{.Node.Hostname}}-onlyoffice-{{.Task.Slot}}"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/bin/bash", "/usr/local/bin/onlyoffice-font-bootstrap.sh"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: DB_PWD=onlyoffice_db_password,REDIS_SERVER_PASS=onlyoffice_redis_password,JWT_SECRET=onlyoffice_jwt_secret,AMQP_URI=onlyoffice_amqp_uri
      DB_TYPE: postgres
      DB_HOST: ${ONLYOFFICE_DB_HOST:-pgpool-internal}
      DB_PORT: ${ONLYOFFICE_DB_PORT:-5432}
      DB_NAME: ${ONLYOFFICE_DB_NAME:?set ONLYOFFICE_DB_NAME}
      DB_USER: ${ONLYOFFICE_DB_USER:?set ONLYOFFICE_DB_USER}
      DB_SCHEMA: ${ONLYOFFICE_DB_SCHEMA:-onlyoffice}
      AMQP_TYPE: rabbitmq
      REDIS_SERVER_HOST: ${ONLYOFFICE_REDIS_HOST:-redis-proxy-internal}
      REDIS_SERVER_PORT: ${ONLYOFFICE_REDIS_PORT:-6379}
      REDIS_SERVER_DB: ${ONLYOFFICE_REDIS_DB:-1}
      ALLOW_PRIVATE_IP_ADDRESS: "${ONLYOFFICE_ALLOW_PRIVATE_IP_ADDRESS:-true}"
      JWT_ENABLED: ${ONLYOFFICE_JWT_ENABLED:-true}
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
      - source: onlyoffice_font_bootstrap_v1
        target: /usr/local/bin/onlyoffice-font-bootstrap.sh
        mode: 0555
    secrets:
      - onlyoffice_db_password
      - onlyoffice_redis_password
      - onlyoffice_jwt_secret
      - onlyoffice_amqp_uri
    volumes:
      - *localtime-volume
      - type: ${ONLYOFFICE_DATA_MOUNT_TYPE:-volume}
        source: ${ONLYOFFICE_DATA_MOUNT_SOURCE:-onlyoffice_data}
        target: /var/www/onlyoffice/Data
      - type: ${ONLYOFFICE_LIB_MOUNT_TYPE:-volume}
        source: ${ONLYOFFICE_LIB_MOUNT_SOURCE:-onlyoffice_lib}
        target: /var/lib/onlyoffice
      - type: ${ONLYOFFICE_LOG_MOUNT_TYPE:-volume}
        source: ${ONLYOFFICE_LOG_MOUNT_SOURCE:-onlyoffice_log}
        target: /var/log/onlyoffice
      - type: ${SHARED_CUSTOM_FONTS_MOUNT_TYPE:-volume}
        source: ${SHARED_CUSTOM_FONTS_MOUNT_SOURCE:-shared_custom_fonts}
        target: /usr/share/fonts/truetype/custom
        read_only: true
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20m
    deploy:
      replicas: ${ONLYOFFICE_REPLICAS:-2}
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *onlyoffice-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${ONLYOFFICE_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${ONLYOFFICE_CPU_RESERVATION:-1.0}"
          memory: "${ONLYOFFICE_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${ONLYOFFICE_CPU_LIMIT:-4.0}"
          memory: "${ONLYOFFICE_MEM_LIMIT:-4G}"

  onlyoffice-public:
    <<: *service-base
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    hostname: "{{.Node.Hostname}}-onlyoffice-public-{{.Task.Slot}}"
    environment:
      <<: *default-env
      SERVER_NAME: ${ONLYOFFICE_SERVER_NAME:-_}
      TLS_CERT_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/onlyoffice-public/fullchain.crt
      TLS_KEY_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/onlyoffice-public/tls.key
      UPSTREAM_SCHEME: http
      UPSTREAM_SERVICE: onlyoffice:80
      CLIENT_MAX_BODY_SIZE: ${ONLYOFFICE_CLIENT_MAX_BODY_SIZE:-0}
      PROXY_READ_TIMEOUT: ${ONLYOFFICE_PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${ONLYOFFICE_PROXY_SEND_TIMEOUT:-3600s}
    configs:
      - source: http_tls_proxy_template_v2
        target: /etc/nginx/templates/default.conf.template
        mode: 0444
    ports:
      - target: 443
        published: ${ONLYOFFICE_HTTP_PORT:-18090}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O - https://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: ${ONLYOFFICE_PUBLIC_REPLICAS:-2}
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${ONLYOFFICE_PUBLIC_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${ONLYOFFICE_PUBLIC_CPU_RESERVATION:-0.25}"
          memory: "${ONLYOFFICE_PUBLIC_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${ONLYOFFICE_PUBLIC_CPU_LIMIT:-1.0}"
          memory: "${ONLYOFFICE_PUBLIC_MEM_LIMIT:-512M}"

networks:
  cloudreve_backend:
    external: true
    name: ${CLOUDREVE_STACK_NAME:?set CLOUDREVE_STACK_NAME}_cloudreve_backend

volumes:
  postgresql_1_data:
  postgresql_2_data:
  postgresql_3_data:
  redis_1_data:
  redis_2_data:
  redis_3_data:
  tika_custom_fonts:
  shared_custom_fonts:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_log:
  onlyoffice_rabbitmq:

configs:
  swarm_secret_wrap_v1:
    file: ./docker/swarm/swarm-secret-wrap.sh
  postgresql_repmgr_run_v4:
    file: ./docker/swarm/postgresql-repmgr-run.sh
  redis_proxy_bootstrap_v8:
    file: ./docker/swarm/redis-proxy-bootstrap.sh
  pgpool_public_tls_cfg_v2:
    file: ./docker/swarm/haproxy/pgpool-public-tls.cfg
  redis_public_tls_cfg_v2:
    file: ./docker/swarm/haproxy/redis-public-tls.cfg
  http_tls_proxy_template_v2:
    file: ./docker/swarm/nginx/http-tls-proxy.conf.template
  onlyoffice_font_bootstrap_v1:
    file: ./docker/swarm/onlyoffice-font-bootstrap.sh

secrets:
  postgresql_postgres_password:
    external: true
    name: ${SWARM_SECRET_POSTGRESQL_POSTGRES_PASSWORD_NAME:?set SWARM_SECRET_POSTGRESQL_POSTGRES_PASSWORD_NAME}
  postgresql_password:
    external: true
    name: ${SWARM_SECRET_POSTGRESQL_PASSWORD_NAME:?set SWARM_SECRET_POSTGRESQL_PASSWORD_NAME}
  repmgr_password:
    external: true
    name: ${SWARM_SECRET_REPMGR_PASSWORD_NAME:?set SWARM_SECRET_REPMGR_PASSWORD_NAME}
  pgpool_admin_password:
    external: true
    name: ${SWARM_SECRET_PGPOOL_ADMIN_PASSWORD_NAME:?set SWARM_SECRET_PGPOOL_ADMIN_PASSWORD_NAME}
  redis_password:
    external: true
    name: ${SWARM_SECRET_REDIS_PASSWORD_NAME:?set SWARM_SECRET_REDIS_PASSWORD_NAME}
  onlyoffice_db_password:
    external: true
    name: ${SWARM_SECRET_ONLYOFFICE_DB_PASSWORD_NAME:?set SWARM_SECRET_ONLYOFFICE_DB_PASSWORD_NAME}
  onlyoffice_redis_password:
    external: true
    name: ${SWARM_SECRET_ONLYOFFICE_REDIS_PASSWORD_NAME:?set SWARM_SECRET_ONLYOFFICE_REDIS_PASSWORD_NAME}
  onlyoffice_rabbitmq_password:
    external: true
    name: ${SWARM_SECRET_ONLYOFFICE_RABBITMQ_PASSWORD_NAME:?set SWARM_SECRET_ONLYOFFICE_RABBITMQ_PASSWORD_NAME}
  onlyoffice_jwt_secret:
    external: true
    name: ${SWARM_SECRET_ONLYOFFICE_JWT_SECRET_NAME:?set SWARM_SECRET_ONLYOFFICE_JWT_SECRET_NAME}
  onlyoffice_amqp_uri:
    external: true
    name: ${SWARM_SECRET_ONLYOFFICE_AMQP_URI_NAME:?set SWARM_SECRET_ONLYOFFICE_AMQP_URI_NAME}
