# Cloudreve Swarm 基础中间件模板。
#
# 包含：
# - PostgreSQL 3 节点 + Pgpool
# - Redis 3 节点 + Sentinel + Proxy
# - Tika
# - OnlyOffice 8
#
# 说明：
# - 这个文件用于独立发布 PostgreSQL / Redis / Tika / OnlyOffice 这一组基础中间件。
# - 典型方式是独立发布：
#   - `docker/swarm/deploy-stack.sh foundation --stack-name cloudreve-prod-foundation`
# - `minio-init` 不放在这里，而是跟随 `docker-compose.swarm.infra.yml` 中的 `minio`
#   入口一起发布，避免 foundation 单独部署时出现无意义的初始化重试。
# - 默认单节点联调走 `docker-compose.swarm.single.yml`。
# - `pgpool-internal` 供 overlay 内部服务明文访问，`pgpool` 供外部客户端通过 PostgreSQL 协议原生 TLS 访问。
# - `onlyoffice` 使用外置 `pgpool + redis-proxy + onlyoffice-rabbitmq`，这样才能在 Swarm 下安全开多副本。
# - 社区版这里实现的是 Swarm 级多副本高可用编排，不是 ONLYOFFICE 商业版官方集群产品形态。

x-default-env: &default-env
  TZ: ${SWARM_TIMEZONE:-Asia/Shanghai}

x-localtime-volume: &localtime-volume
  type: ${SWARM_LOCALTIME_MOUNT_TYPE:-bind}
  source: ${SWARM_LOCALTIME_MOUNT_SOURCE:-/etc/localtime}
  target: /etc/localtime
  read_only: true

x-pki-volume: &pki-volume
  type: ${SWARM_PKI_MOUNT_TYPE:-bind}
  source: ${SWARM_PKI_MOUNT_SOURCE:-/srv/cloudreve/pki}
  target: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}
  read_only: true

x-default-logging: &default-logging
  driver: ${SWARM_LOGGING_DRIVER:-json-file}
  options:
    max-size: "${SWARM_LOGGING_MAX_SIZE:-20m}"
    max-file: "${SWARM_LOGGING_MAX_FILE:-5}"
    compress: "${SWARM_LOGGING_COMPRESS:-true}"

x-service-base: &service-base
  logging: *default-logging

x-stateful-update-config: &stateful-update-config
  order: stop-first

x-default-update-config: &default-update-config
  parallelism: 1
  order: ${SWARM_ROLLING_ORDER:-start-first}
  failure_action: rollback

x-delayed-update-config: &delayed-update-config
  <<: *default-update-config
  delay: 10s

x-default-rollback-config: &default-rollback-config
  parallelism: 1
  order: stop-first

x-default-restart-policy: &default-restart-policy
  condition: any
  delay: ${SWARM_RESTART_DELAY:-5s}
  window: ${SWARM_RESTART_WINDOW:-2m}

x-restart-policy-with-attempts: &restart-policy-with-attempts
  condition: any
  delay: ${SWARM_RESTART_WITH_ATTEMPTS_DELAY:-5s}
  max_attempts: ${SWARM_RESTART_MAX_ATTEMPTS:-10}
  window: ${SWARM_RESTART_WITH_ATTEMPTS_WINDOW:-2m}

x-stateful-restart-policy: &stateful-restart-policy
  condition: any
  delay: ${SWARM_STATEFUL_RESTART_DELAY:-30s}
  window: ${SWARM_STATEFUL_RESTART_WINDOW:-10m}

x-onlyoffice-restart-policy: &onlyoffice-restart-policy
  condition: any
  delay: ${ONLYOFFICE_RESTART_DELAY:-10s}
  max_attempts: ${ONLYOFFICE_RESTART_MAX_ATTEMPTS:-10}
  window: ${ONLYOFFICE_RESTART_WINDOW:-3m}

services:
  postgresql-1:
    <<: *service-base
    image: ${POSTGRESQL_REPMGR_IMAGE:-bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2}
    hostname: "{{.Node.Hostname}}-pg1"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/postgresql-repmgr/entrypoint.sh"]
    command: ["/opt/bitnami/scripts/postgresql-repmgr/run.sh"]
    extra_hosts:
      - "postgresql-1:127.0.0.1"
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: POSTGRESQL_POSTGRES_PASSWORD=postgresql_postgres_password,POSTGRESQL_PASSWORD=postgresql_password,REPMGR_PASSWORD=repmgr_password
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE:-cloudreve}
      POSTGRESQL_MAX_CONNECTIONS: ${POSTGRESQL_MAX_CONNECTIONS:-500}
      POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: ${POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS:-1}
      POSTGRESQL_LOCAL_START_TIMEOUT: ${POSTGRESQL_LOCAL_START_TIMEOUT:-600}
      REPMGR_CONNECT_TIMEOUT: ${REPMGR_CONNECT_TIMEOUT:-10}
      REPMGR_RECONNECT_ATTEMPTS: ${REPMGR_RECONNECT_ATTEMPTS:-12}
      REPMGR_RECONNECT_INTERVAL: ${REPMGR_RECONNECT_INTERVAL:-5}
      REPMGR_DEGRADED_MONITORING_TIMEOUT: ${REPMGR_DEGRADED_MONITORING_TIMEOUT:-180}
      REPMGR_PRIMARY_HOST: ${REPMGR_PRIMARY_HOST:-postgresql-1}
      REPMGR_PARTNER_NODES: ${REPMGR_PARTNER_NODES:-tasks.postgresql-1,tasks.postgresql-2,tasks.postgresql-3}
      REPMGR_NODE_NAME: postgresql-1
      REPMGR_NODE_NETWORK_NAME: postgresql-1
      REPMGR_ADVERTISE_HOST: postgresql-1
      REPMGR_NODE_ID: "1"
      REPMGR_LOG_LEVEL: NOTICE
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
      - source: postgresql_repmgr_run_v6
        target: /opt/bitnami/scripts/postgresql-repmgr/run.sh
        mode: 0555
    secrets:
      - postgresql_postgres_password
      - postgresql_password
      - repmgr_password
    volumes:
      - *localtime-volume
      - type: ${PG_1_DATA_MOUNT_TYPE:-bind}
        source: ${PG_1_DATA_MOUNT_SOURCE:?set PG_1_DATA_MOUNT_SOURCE}
        target: /bitnami/postgresql
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRESQL_USERNAME:-cloudreve} -d ${POSTGRESQL_DATABASE:-cloudreve} || exit 1"]
      interval: ${POSTGRESQL_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${POSTGRESQL_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${POSTGRESQL_HEALTHCHECK_RETRIES:-20}
      start_period: ${POSTGRESQL_HEALTHCHECK_START_PERIOD:-10m}
    deploy:
      replicas: 1
      update_config: *stateful-update-config
      restart_policy: *stateful-restart-policy
      placement:
        constraints:
          - ${PG_NODE_1_CONSTRAINT:-node.labels.cloudreve.pg1==true}
      resources:
        reservations:
          cpus: "${POSTGRESQL_CPU_RESERVATION:-2.0}"
          memory: "${POSTGRESQL_MEM_RESERVATION:-4G}"
        limits:
          cpus: "${POSTGRESQL_CPU_LIMIT:-4.0}"
          memory: "${POSTGRESQL_MEM_LIMIT:-8G}"

  postgresql-2:
    <<: *service-base
    image: ${POSTGRESQL_REPMGR_IMAGE:-bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2}
    hostname: "{{.Node.Hostname}}-pg2"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/postgresql-repmgr/entrypoint.sh"]
    command: ["/opt/bitnami/scripts/postgresql-repmgr/run.sh"]
    extra_hosts:
      - "postgresql-2:127.0.0.1"
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: POSTGRESQL_POSTGRES_PASSWORD=postgresql_postgres_password,POSTGRESQL_PASSWORD=postgresql_password,REPMGR_PASSWORD=repmgr_password
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE:-cloudreve}
      POSTGRESQL_MAX_CONNECTIONS: ${POSTGRESQL_MAX_CONNECTIONS:-500}
      POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: ${POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS:-1}
      POSTGRESQL_LOCAL_START_TIMEOUT: ${POSTGRESQL_LOCAL_START_TIMEOUT:-600}
      REPMGR_CONNECT_TIMEOUT: ${REPMGR_CONNECT_TIMEOUT:-10}
      REPMGR_RECONNECT_ATTEMPTS: ${REPMGR_RECONNECT_ATTEMPTS:-12}
      REPMGR_RECONNECT_INTERVAL: ${REPMGR_RECONNECT_INTERVAL:-5}
      REPMGR_DEGRADED_MONITORING_TIMEOUT: ${REPMGR_DEGRADED_MONITORING_TIMEOUT:-180}
      REPMGR_PRIMARY_HOST: ${REPMGR_PRIMARY_HOST:-postgresql-1}
      REPMGR_PARTNER_NODES: ${REPMGR_PARTNER_NODES:-tasks.postgresql-1,tasks.postgresql-2,tasks.postgresql-3}
      REPMGR_NODE_NAME: postgresql-2
      REPMGR_NODE_NETWORK_NAME: postgresql-2
      REPMGR_ADVERTISE_HOST: postgresql-2
      REPMGR_NODE_ID: "2"
      REPMGR_LOG_LEVEL: NOTICE
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
      - source: postgresql_repmgr_run_v6
        target: /opt/bitnami/scripts/postgresql-repmgr/run.sh
        mode: 0555
    secrets:
      - postgresql_postgres_password
      - postgresql_password
      - repmgr_password
    volumes:
      - *localtime-volume
      - type: ${PG_2_DATA_MOUNT_TYPE:-bind}
        source: ${PG_2_DATA_MOUNT_SOURCE:?set PG_2_DATA_MOUNT_SOURCE}
        target: /bitnami/postgresql
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRESQL_USERNAME:-cloudreve} -d ${POSTGRESQL_DATABASE:-cloudreve} || exit 1"]
      interval: ${POSTGRESQL_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${POSTGRESQL_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${POSTGRESQL_HEALTHCHECK_RETRIES:-20}
      start_period: ${POSTGRESQL_HEALTHCHECK_START_PERIOD:-10m}
    deploy:
      replicas: 1
      update_config: *stateful-update-config
      restart_policy: *stateful-restart-policy
      placement:
        constraints:
          - ${PG_NODE_2_CONSTRAINT:-node.labels.cloudreve.pg2==true}
      resources:
        reservations:
          cpus: "${POSTGRESQL_CPU_RESERVATION:-2.0}"
          memory: "${POSTGRESQL_MEM_RESERVATION:-4G}"
        limits:
          cpus: "${POSTGRESQL_CPU_LIMIT:-4.0}"
          memory: "${POSTGRESQL_MEM_LIMIT:-8G}"

  postgresql-3:
    <<: *service-base
    image: ${POSTGRESQL_REPMGR_IMAGE:-bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2}
    hostname: "{{.Node.Hostname}}-pg3"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/postgresql-repmgr/entrypoint.sh"]
    command: ["/opt/bitnami/scripts/postgresql-repmgr/run.sh"]
    extra_hosts:
      - "postgresql-3:127.0.0.1"
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: POSTGRESQL_POSTGRES_PASSWORD=postgresql_postgres_password,POSTGRESQL_PASSWORD=postgresql_password,REPMGR_PASSWORD=repmgr_password
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE:-cloudreve}
      POSTGRESQL_MAX_CONNECTIONS: ${POSTGRESQL_MAX_CONNECTIONS:-500}
      POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: ${POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS:-1}
      POSTGRESQL_LOCAL_START_TIMEOUT: ${POSTGRESQL_LOCAL_START_TIMEOUT:-600}
      REPMGR_CONNECT_TIMEOUT: ${REPMGR_CONNECT_TIMEOUT:-10}
      REPMGR_RECONNECT_ATTEMPTS: ${REPMGR_RECONNECT_ATTEMPTS:-12}
      REPMGR_RECONNECT_INTERVAL: ${REPMGR_RECONNECT_INTERVAL:-5}
      REPMGR_DEGRADED_MONITORING_TIMEOUT: ${REPMGR_DEGRADED_MONITORING_TIMEOUT:-180}
      REPMGR_PRIMARY_HOST: ${REPMGR_PRIMARY_HOST:-postgresql-1}
      REPMGR_PARTNER_NODES: ${REPMGR_PARTNER_NODES:-tasks.postgresql-1,tasks.postgresql-2,tasks.postgresql-3}
      REPMGR_NODE_NAME: postgresql-3
      REPMGR_NODE_NETWORK_NAME: postgresql-3
      REPMGR_ADVERTISE_HOST: postgresql-3
      REPMGR_NODE_ID: "3"
      REPMGR_LOG_LEVEL: NOTICE
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
      - source: postgresql_repmgr_run_v6
        target: /opt/bitnami/scripts/postgresql-repmgr/run.sh
        mode: 0555
    secrets:
      - postgresql_postgres_password
      - postgresql_password
      - repmgr_password
    volumes:
      - *localtime-volume
      - type: ${PG_3_DATA_MOUNT_TYPE:-bind}
        source: ${PG_3_DATA_MOUNT_SOURCE:?set PG_3_DATA_MOUNT_SOURCE}
        target: /bitnami/postgresql
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRESQL_USERNAME:-cloudreve} -d ${POSTGRESQL_DATABASE:-cloudreve} || exit 1"]
      interval: ${POSTGRESQL_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${POSTGRESQL_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${POSTGRESQL_HEALTHCHECK_RETRIES:-20}
      start_period: ${POSTGRESQL_HEALTHCHECK_START_PERIOD:-10m}
    deploy:
      replicas: 1
      update_config: *stateful-update-config
      restart_policy: *stateful-restart-policy
      placement:
        constraints:
          - ${PG_NODE_3_CONSTRAINT:-node.labels.cloudreve.pg3==true}
      resources:
        reservations:
          cpus: "${POSTGRESQL_CPU_RESERVATION:-2.0}"
          memory: "${POSTGRESQL_MEM_RESERVATION:-4G}"
        limits:
          cpus: "${POSTGRESQL_CPU_LIMIT:-4.0}"
          memory: "${POSTGRESQL_MEM_LIMIT:-8G}"

  pgpool-internal:
    <<: *service-base
    image: ${PGPOOL_IMAGE:-bitnamilegacy/pgpool:4.6.3-debian-12-r0}
    hostname: "{{.Node.Hostname}}-pgpool-internal-{{.Task.Slot}}"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/pgpool/entrypoint.sh"]
    command: ["/opt/bitnami/scripts/pgpool/run.sh"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: PGPOOL_POSTGRES_PASSWORD=postgresql_postgres_password,PGPOOL_SR_CHECK_PASSWORD=postgresql_password,PGPOOL_ADMIN_PASSWORD=pgpool_admin_password,PGPOOL_PASSWORD=postgresql_password
      PGPOOL_BACKEND_NODES: ${PGPOOL_BACKEND_NODES:-0:tasks.postgresql-1:5432,1:tasks.postgresql-2:5432,2:tasks.postgresql-3:5432}
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_SR_CHECK_USER: ${POSTGRESQL_USERNAME:-cloudreve}
      PGPOOL_ENABLE_LOAD_BALANCING: "no"
      PGPOOL_ENABLE_POOL_HBA: "yes"
      PGPOOL_ADMIN_USERNAME: ${PGPOOL_ADMIN_USERNAME:-admin}
      PGPOOL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
      PGPOOL_NUM_INIT_CHILDREN: ${PGPOOL_NUM_INIT_CHILDREN:-128}
      PGPOOL_RESERVED_CONNECTIONS: ${PGPOOL_RESERVED_CONNECTIONS:-10}
      PGPOOL_MAX_POOL: ${PGPOOL_MAX_POOL:-10}
      PGPOOL_CHILD_MAX_CONNECTIONS: ${PGPOOL_CHILD_MAX_CONNECTIONS:-0}
      PGPOOL_CHILD_LIFE_TIME: ${PGPOOL_CHILD_LIFE_TIME:-300}
      PGPOOL_CONNECTION_LIFE_TIME: ${PGPOOL_CONNECTION_LIFE_TIME:-600}
      PGPOOL_CLIENT_IDLE_LIMIT: ${PGPOOL_CLIENT_IDLE_LIMIT:-300}
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
    secrets:
      - postgresql_postgres_password
      - postgresql_password
      - pgpool_admin_password
    volumes:
      - *localtime-volume
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/pgpool/healthcheck.sh"]
      interval: ${PGPOOL_HEALTHCHECK_INTERVAL:-20s}
      timeout: ${PGPOOL_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${PGPOOL_HEALTHCHECK_RETRIES:-18}
      start_period: ${PGPOOL_HEALTHCHECK_START_PERIOD:-6m}
    deploy:
      replicas: ${PGPOOL_REPLICAS:-1}
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${PGPOOL_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${PGPOOL_CPU_RESERVATION:-0.5}"
          memory: "${PGPOOL_MEM_RESERVATION:-512M}"
        limits:
          cpus: "${PGPOOL_CPU_LIMIT:-2.0}"
          memory: "${PGPOOL_MEM_LIMIT:-2G}"

  pgpool:
    <<: *service-base
    image: ${PGPOOL_IMAGE:-bitnamilegacy/pgpool:4.6.3-debian-12-r0}
    hostname: "{{.Node.Hostname}}-pgpool-public-{{.Task.Slot}}"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/pgpool/entrypoint.sh"]
    command: ["/opt/bitnami/scripts/pgpool/run.sh"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: PGPOOL_POSTGRES_PASSWORD=postgresql_postgres_password,PGPOOL_SR_CHECK_PASSWORD=postgresql_password,PGPOOL_ADMIN_PASSWORD=pgpool_admin_password,PGPOOL_PASSWORD=postgresql_password
      PGPOOL_BACKEND_NODES: ${PGPOOL_BACKEND_NODES:-0:tasks.postgresql-1:5432,1:tasks.postgresql-2:5432,2:tasks.postgresql-3:5432}
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_SR_CHECK_USER: ${POSTGRESQL_USERNAME:-cloudreve}
      PGPOOL_ENABLE_LOAD_BALANCING: "no"
      PGPOOL_ENABLE_POOL_HBA: "yes"
      PGPOOL_ADMIN_USERNAME: ${PGPOOL_ADMIN_USERNAME:-admin}
      PGPOOL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
      PGPOOL_NUM_INIT_CHILDREN: ${PGPOOL_NUM_INIT_CHILDREN:-128}
      PGPOOL_RESERVED_CONNECTIONS: ${PGPOOL_RESERVED_CONNECTIONS:-10}
      PGPOOL_MAX_POOL: ${PGPOOL_MAX_POOL:-10}
      PGPOOL_CHILD_MAX_CONNECTIONS: ${PGPOOL_CHILD_MAX_CONNECTIONS:-0}
      PGPOOL_CHILD_LIFE_TIME: ${PGPOOL_CHILD_LIFE_TIME:-300}
      PGPOOL_CONNECTION_LIFE_TIME: ${PGPOOL_CONNECTION_LIFE_TIME:-600}
      PGPOOL_CLIENT_IDLE_LIMIT: ${PGPOOL_CLIENT_IDLE_LIMIT:-300}
      PGPOOL_ENABLE_TLS: "${PGPOOL_ENABLE_TLS:-yes}"
      PGPOOL_TLS_CERT_FILE: "${PGPOOL_TLS_CERT_FILE:-/run/swarm-pki/services/pgpool/fullchain.crt}"
      PGPOOL_TLS_KEY_FILE: "${PGPOOL_TLS_KEY_FILE:-/run/swarm-pki/services/pgpool/server.key}"
      PGPOOL_TLS_PREFER_SERVER_CIPHERS: "${PGPOOL_TLS_PREFER_SERVER_CIPHERS:-yes}"
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
    secrets:
      - postgresql_postgres_password
      - postgresql_password
      - pgpool_admin_password
    ports:
      - target: 5432
        published: ${PGPOOL_PUBLIC_PORT:-15432}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/pgpool/healthcheck.sh"]
      interval: ${PGPOOL_HEALTHCHECK_INTERVAL:-20s}
      timeout: ${PGPOOL_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${PGPOOL_HEALTHCHECK_RETRIES:-18}
      start_period: ${PGPOOL_HEALTHCHECK_START_PERIOD:-6m}
    deploy:
      replicas: ${PGPOOL_PUBLIC_REPLICAS:-1}
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${PGPOOL_PUBLIC_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${PGPOOL_PUBLIC_CPU_RESERVATION:-0.25}"
          memory: "${PGPOOL_PUBLIC_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${PGPOOL_PUBLIC_CPU_LIMIT:-1.0}"
          memory: "${PGPOOL_PUBLIC_MEM_LIMIT:-512M}"

  redis-1:
    <<: *service-base
    image: ${REDIS_IMAGE:-bitnamilegacy/redis:8.2.1-debian-12-r0}
    hostname: "{{.Node.Hostname}}-redis1"
    entrypoint: ["/bin/sh", "/usr/local/bin/swarm-secret-wrap.sh", "/opt/bitnami/scripts/redis/entrypoint.sh"]
    command: ["/opt/bitnami/scripts/redis/run.sh"]
    environment:
      <<: *default-env
      SWARM_SECRET_ENV_MAPPINGS: REDIS_PASSWORD=redis_password
      ALLOW_EMPTY_PASSWORD: "no"
      REDIS_AOF_ENABLED: ${REDIS_AOF_ENABLED:-yes}
      REDIS_REPLICATION_MODE: master
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
    secrets:
      - redis_password
    volumes:
      - *localtime-volume
      - type: ${REDIS_1_DATA_MOUNT_TYPE:-bind}
        source: ${REDIS_1_DATA_MOUNT_SOURCE:?set REDIS_1_DATA_MOUNT_SOURCE}
        target: /bitnami/redis/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$$$(cat /run/secrets/redis_password)\" ping | grep PONG >/dev/null || exit 1"]
      interval: ${REDIS_HEALTHCHECK_INTERVAL:-20s}
      timeout: ${REDIS_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${REDIS_HEALTHCHECK_RETRIES:-18}
      start_period: ${REDIS_HEALTHCHECK_START_PERIOD:-5m}
    deploy:
      endpoint_mode: dnsrr
      replicas: 1
      update_config: *stateful-update-config
      restart_policy: *stateful-restart-policy
      placement:
        constraints:
          - ${REDIS_NODE_1_CONSTRAINT:-node.labels.cloudreve.redis1==true}
      resources:
        reservations:
          cpus: "${REDIS_CPU_RESERVATION:-1.0}"
          memory: "${REDIS_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${REDIS_CPU_LIMIT:-2.0}"
          memory: "${REDIS_MEM_LIMIT:-4G}"

  redis-2:
    <<: *service-base
    image: ${REDIS_IMAGE:-bitnamilegacy/redis:8.2.1-debian-12-r0}
    hostname: "{{.Node.Hostname}}-redis2"
