[System]
Debug = false
Mode = master
Listen = :5212
SessionSecret = GFh0sKeHbMJ9aYckBoG5eibJME4hF0QeXZl6ZgQSRzOTYuRruqMlJVPMeOd9qiMS
HashIDSalt = {HashIDSalt}

[Database]
Type = postgres
Host = 127.0.0.1
Port = 5432
User = cloudreve
Password =
Name = cloudreve
SSLMode = disable

[Redis]
Network = tcp
Server = 127.0.0.1:6379
DB = 0

[Kafka]
; 是否启用 Kafka。关闭时 Cloudreve 会退化为 no-op 客户端，不影响原有功能。
Enabled = false
; 多 broker 使用英文逗号分隔，例如：127.0.0.1:9092,127.0.0.1:9093
Brokers =
; Kafka broker 版本，用于 Sarama 协议协商。
Version = 3.7.0
; 客户端 ID，建议区分实例或环境。
ClientID = cloudreve
; 连接协议：PLAINTEXT / SSL / SASL_PLAINTEXT / SASL_SSL
SecurityProtocol = PLAINTEXT
; 连接与读写超时，单位秒。
DialTimeout = 10
ReadTimeout = 30
WriteTimeout = 30
KeepAlive = 30
; TLS 相关配置。使用 SASL_SSL / SSL 时可按需设置。
TLSSkipVerify = false
TLSServerName =
TLSCAPath =
TLSCertPath =
TLSKeyPath =
; SASL 相关配置。使用 SASL_PLAINTEXT / SASL_SSL 时生效。
SASLMechanism = PLAIN
SASLUsername =
SASLPassword =
SASLHandshake = true

[Kafka.Producer]
; all/local/none，对高可用场景建议保持 all。
RequiredAcks = all
; none/gzip/snappy/lz4/zstd
Compression = snappy
RetryMax = 5
RetryBackoff = 2
; 高可用生产建议开启幂等。
Idempotent = true
MaxMessageBytes = 0
ReturnSuccesses = true

[Kafka.Consumer]
; oldest/newest
InitialOffset = newest
; range/roundrobin/sticky
RebalanceStrategy = sticky
SessionTimeout = 30
HeartbeatInterval = 3
RetryBackoff = 2
MaxProcessingTime = 5
FetchDefault = 1048576
FetchMax = 0
ReturnErrors = true
