      DB_HOST: ${ONLYOFFICE_DB_HOST:-pgpool-internal}
      DB_PORT: ${ONLYOFFICE_DB_PORT:-5432}
      DB_NAME: ${ONLYOFFICE_DB_NAME:?set ONLYOFFICE_DB_NAME}
      DB_USER: ${ONLYOFFICE_DB_USER:?set ONLYOFFICE_DB_USER}
      DB_SCHEMA: ${ONLYOFFICE_DB_SCHEMA:-onlyoffice}
      AMQP_TYPE: rabbitmq
      REDIS_SERVER_HOST: ${ONLYOFFICE_REDIS_HOST:-redis-1}
      REDIS_SERVER_PORT: ${ONLYOFFICE_REDIS_PORT:-6379}
      REDIS_SERVER_DB: ${ONLYOFFICE_REDIS_DB:-1}
      ALLOW_PRIVATE_IP_ADDRESS: "${ONLYOFFICE_ALLOW_PRIVATE_IP_ADDRESS:-true}"
      JWT_ENABLED: ${ONLYOFFICE_JWT_ENABLED:-true}
    configs:
      - source: swarm_secret_wrap_v1
        target: /usr/local/bin/swarm-secret-wrap.sh
        mode: 0555
      - source: onlyoffice_font_bootstrap_v1
        target: /usr/local/bin/onlyoffice-font-bootstrap.sh
        mode: 0555
    secrets:
      - onlyoffice_db_password
      - onlyoffice_redis_password
      - onlyoffice_jwt_secret
      - onlyoffice_amqp_uri
    volumes:
      - *localtime-volume
      - type: ${ONLYOFFICE_DATA_MOUNT_TYPE:-volume}
        source: ${ONLYOFFICE_DATA_MOUNT_SOURCE:-onlyoffice_data}
        target: /var/www/onlyoffice/Data
      - type: ${ONLYOFFICE_LIB_MOUNT_TYPE:-volume}
        source: ${ONLYOFFICE_LIB_MOUNT_SOURCE:-onlyoffice_lib}
        target: /var/lib/onlyoffice
      - type: ${ONLYOFFICE_LOG_MOUNT_TYPE:-volume}
        source: ${ONLYOFFICE_LOG_MOUNT_SOURCE:-onlyoffice_log}
        target: /var/log/onlyoffice
      - type: ${SHARED_CUSTOM_FONTS_MOUNT_TYPE:-volume}
        source: ${SHARED_CUSTOM_FONTS_MOUNT_SOURCE:-shared_custom_fonts}
        target: /usr/share/fonts/truetype/custom
        read_only: true
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20m
    deploy:
      replicas: ${ONLYOFFICE_REPLICAS:-1}
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *onlyoffice-restart-policy
      placement:
        constraints:
          - ${ONLYOFFICE_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${ONLYOFFICE_CPU_RESERVATION:-1.0}"
          memory: "${ONLYOFFICE_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${ONLYOFFICE_CPU_LIMIT:-4.0}"
          memory: "${ONLYOFFICE_MEM_LIMIT:-4G}"

  onlyoffice-public:
    <<: *service-base
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    hostname: "{{.Node.Hostname}}-onlyoffice-public"
    environment:
      <<: *default-env
      SERVER_NAME: ${ONLYOFFICE_SERVER_NAME:-_}
      TLS_CERT_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/onlyoffice-public/fullchain.crt
      TLS_KEY_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/onlyoffice-public/tls.key
      UPSTREAM_SCHEME: http
      UPSTREAM_SERVICE: onlyoffice:80
      CLIENT_MAX_BODY_SIZE: ${ONLYOFFICE_CLIENT_MAX_BODY_SIZE:-0}
      PROXY_READ_TIMEOUT: ${ONLYOFFICE_PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${ONLYOFFICE_PROXY_SEND_TIMEOUT:-3600s}
    configs:
      - source: http_tls_proxy_template_v2
        target: /etc/nginx/templates/default.conf.template
        mode: 0444
    ports:
      - target: 443
        published: ${ONLYOFFICE_HTTP_PORT:-18090}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O - https://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: 1
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${ONLYOFFICE_PUBLIC_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${ONLYOFFICE_PUBLIC_CPU_RESERVATION:-0.25}"
          memory: "${ONLYOFFICE_PUBLIC_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${ONLYOFFICE_PUBLIC_CPU_LIMIT:-1.0}"
          memory: "${ONLYOFFICE_PUBLIC_MEM_LIMIT:-512M}"

  authverse-web:
    <<: *service-base
    image: ${AUTHVERSE_WEB_IMAGE:?set AUTHVERSE_WEB_IMAGE}
    hostname: "{{.Node.Hostname}}-authverse-web"
    environment:
      <<: *default-env
      SERVER_NAME: ${AUTHVERSE_SERVER_NAME:-_}
      TLS_CERT_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/authverse-web/fullchain.crt
      TLS_KEY_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/authverse-web/tls.key
      CLIENT_MAX_BODY_SIZE: ${AUTHVERSE_CLIENT_MAX_BODY_SIZE:-0}
      PROXY_READ_TIMEOUT: ${AUTHVERSE_PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${AUTHVERSE_PROXY_SEND_TIMEOUT:-3600s}
      UPSTREAM_AUTHVERSE_BACKEND: ${AUTHVERSE_BACKEND_UPSTREAM:-authverse-backend:48080}
      UPSTREAM_AUTHVERSE_BACKEND_HOST_HEADER: ${AUTHVERSE_BACKEND_HOST_HEADER:-$$host}
      UPSTREAM_CLOUDREVE: ${AUTHVERSE_SINGLE_CLOUDREVE_INTERNAL_UPSTREAM:?set AUTHVERSE_SINGLE_CLOUDREVE_INTERNAL_UPSTREAM}
      UPSTREAM_CLOUDREVE_HOST_HEADER: ${AUTHVERSE_CLOUDREVE_HOST_HEADER:-$$host}
    configs:
      - source: authverse_proxy_template_v1
        target: /etc/nginx/templates/default.conf.template
        mode: 0444
    ports:
      - target: 443
        published: ${AUTHVERSE_HTTP_PORT:-18080}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O - https://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      replicas: ${AUTHVERSE_SINGLE_WEB_REPLICAS:-1}
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${AUTHVERSE_WEB_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${AUTHVERSE_WEB_CPU_RESERVATION:-0.25}"
          memory: "${AUTHVERSE_WEB_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${AUTHVERSE_WEB_CPU_LIMIT:-1.0}"
          memory: "${AUTHVERSE_WEB_MEM_LIMIT:-512M}"

  authverse-backend:
    <<: *service-base
    image: ${AUTHVERSE_BACKEND_IMAGE:?set AUTHVERSE_BACKEND_IMAGE}
    hostname: "{{.Node.Hostname}}-authverse-backend"
    entrypoint: ["/__cacert_entrypoint.sh", "/usr/local/bin/java-service-launch.sh"]
    environment:
      <<: *default-env
      SPRING_PROFILES_ACTIVE: local
      JAVA_LAUNCH_MODE: jar
      JAVA_APP_JAR: /opt/authverse-backend/app.jar
      JAVA_APP_ARGS: ${AUTHVERSE_BACKEND_EXTRA_ARGS:-}
      JAVA_OPTS: ${AUTHVERSE_JAVA_OPTS:--Xms1g -Xmx2g -Djava.security.egd=file:/dev/./urandom}
      JAVA_TOOL_OPTIONS: "${AUTHVERSE_JAVA_TOOL_OPTIONS:-}"
      SPRING_CONFIG_ADDITIONAL_LOCATION: ${AUTHVERSE_BACKEND_ADDITIONAL_CONFIG:-optional:file:/run/secrets/authverse-backend-application.yml}
    secrets:
      - source: authverse_backend_application
        target: authverse-backend-application.yml
    configs:
      - source: java_service_launch_v2
        target: /usr/local/bin/java-service-launch.sh
        mode: 0555
    volumes:
      - *localtime-volume
      - *pki-volume
      - type: ${AUTHVERSE_OIDC_KEYS_MOUNT_TYPE:-volume}
        source: ${AUTHVERSE_OIDC_KEYS_MOUNT_SOURCE:-authverse_oidc_keys}
        target: /run/authverse/oidc
        read_only: true
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:48080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: ${AUTHVERSE_BACKEND_HEALTHCHECK_START_PERIOD:-180s}
    deploy:
      replicas: ${AUTHVERSE_SINGLE_BACKEND_REPLICAS:-1}
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${AUTHVERSE_BACKEND_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${AUTHVERSE_BACKEND_CPU_RESERVATION:-1.0}"
          memory: "${AUTHVERSE_BACKEND_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${AUTHVERSE_BACKEND_CPU_LIMIT:-2.0}"
          memory: "${AUTHVERSE_BACKEND_MEM_LIMIT:-4G}"

networks:
  cloudreve_backend:
    driver: overlay
    driver_opts:
      encrypted: "${SWARM_OVERLAY_ENCRYPT:-true}"
    attachable: ${SWARM_OVERLAY_ATTACHABLE:-false}
    ipam:
      config:
        - subnet: ${CLOUDREVE_BACKEND_SUBNET:-10.20.0.0/24}

volumes:
  cloudreve_master_runtime:
  postgresql_1_data:
  redis_1_data:
  minio_data:
  elasticsearch_data:
  kafka_data:
  shared_custom_fonts:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_log:
  onlyoffice_rabbitmq:
  authverse_oidc_keys:

configs:
  swarm_secret_wrap_v1:
    file: ./docker/swarm/swarm-secret-wrap.sh
  java_service_launch_v2:
    file: ./docker/swarm/java-service-launch.sh
  cloudreve_entrypoint_v1:
    file: ./docker/swarm/cloudreve-entrypoint.sh
  cloudreve_proxy_template_v3:
    file: ./docker/swarm/nginx/cloudreve-proxy.conf.template
  authverse_proxy_template_v1:
    file: ./docker/swarm/nginx/authverse-proxy.conf.template
  postgresql_repmgr_run_v4:
    file: ./docker/swarm/postgresql-repmgr-run.sh
  redis_proxy_bootstrap_v8:
    file: ./docker/swarm/redis-proxy-bootstrap.sh
  redis_public_tls_cfg_v2:
    file: ./docker/swarm/haproxy/redis-public-tls.cfg
  minio_public_tls_cfg_v2:
    file: ./docker/swarm/haproxy/minio-public-tls.cfg
  elasticsearch_public_tls_cfg_v2:
    file: ./docker/swarm/haproxy/elasticsearch-public-tls.cfg
  kafka_single_proxy_cfg_v3:
    file: ./docker/swarm/haproxy/kafka-single.cfg
  http_tls_proxy_template_v2:
    file: ./docker/swarm/nginx/http-tls-proxy.conf.template
  onlyoffice_font_bootstrap_v1:
    file: ./docker/swarm/onlyoffice-font-bootstrap.sh
  minio_swarm_entrypoint_v1:
    file: ./docker/swarm/minio-swarm-entrypoint.sh
  minio_init_v1:
    file: ./docker/swarm/minio-init.sh

secrets:
  cloudreve_session_secret:
    external: true
    name: ${SWARM_SECRET_CLOUDREVE_SESSION_SECRET_NAME:?set SWARM_SECRET_CLOUDREVE_SESSION_SECRET_NAME}
  postgresql_postgres_password:
    external: true
    name: ${SWARM_SECRET_POSTGRESQL_POSTGRES_PASSWORD_NAME:?set SWARM_SECRET_POSTGRESQL_POSTGRES_PASSWORD_NAME}
  postgresql_password:
    external: true
    name: ${SWARM_SECRET_POSTGRESQL_PASSWORD_NAME:?set SWARM_SECRET_POSTGRESQL_PASSWORD_NAME}
  repmgr_password:
    external: true
    name: ${SWARM_SECRET_REPMGR_PASSWORD_NAME:?set SWARM_SECRET_REPMGR_PASSWORD_NAME}
  pgpool_admin_password:
    external: true
    name: ${SWARM_SECRET_PGPOOL_ADMIN_PASSWORD_NAME:?set SWARM_SECRET_PGPOOL_ADMIN_PASSWORD_NAME}
  redis_password:
    external: true
    name: ${SWARM_SECRET_REDIS_PASSWORD_NAME:?set SWARM_SECRET_REDIS_PASSWORD_NAME}
  minio_root_password:
    external: true
    name: ${SWARM_SECRET_MINIO_ROOT_PASSWORD_NAME:?set SWARM_SECRET_MINIO_ROOT_PASSWORD_NAME}
  cloudreve_s3_secret_key:
    external: true
    name: ${SWARM_SECRET_CLOUDREVE_S3_SECRET_KEY_NAME:-cloudreve_s3_secret_key_disabled}
  onlyoffice_db_password:
    external: true
    name: ${SWARM_SECRET_ONLYOFFICE_DB_PASSWORD_NAME:?set SWARM_SECRET_ONLYOFFICE_DB_PASSWORD_NAME}
  onlyoffice_redis_password:
    external: true
    name: ${SWARM_SECRET_ONLYOFFICE_REDIS_PASSWORD_NAME:?set SWARM_SECRET_ONLYOFFICE_REDIS_PASSWORD_NAME}
  onlyoffice_rabbitmq_password:
    external: true
    name: ${SWARM_SECRET_ONLYOFFICE_RABBITMQ_PASSWORD_NAME:?set SWARM_SECRET_ONLYOFFICE_RABBITMQ_PASSWORD_NAME}
  onlyoffice_jwt_secret:
    external: true
    name: ${SWARM_SECRET_ONLYOFFICE_JWT_SECRET_NAME:?set SWARM_SECRET_ONLYOFFICE_JWT_SECRET_NAME}
  onlyoffice_amqp_uri:
    external: true
    name: ${SWARM_SECRET_ONLYOFFICE_AMQP_URI_NAME:?set SWARM_SECRET_ONLYOFFICE_AMQP_URI_NAME}
  authverse_backend_application:
    external: true
    name: ${SWARM_SECRET_AUTHVERSE_BACKEND_APPLICATION_NAME:?set SWARM_SECRET_AUTHVERSE_BACKEND_APPLICATION_NAME}
