      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "${KAFKA_SINGLE_NODE_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "${KAFKA_SINGLE_NODE_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "${KAFKA_SINGLE_NODE_TRANSACTION_STATE_LOG_MIN_ISR:-1}"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "${KAFKA_SINGLE_NODE_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'kafka\\.Kafka' >/dev/null || pgrep -f 'kafka\\.KRaft' >/dev/null"]
