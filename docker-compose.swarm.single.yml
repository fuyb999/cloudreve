# Cloudreve Swarm 单节点全量模板。
#
# 包含：
# - Cloudreve 主站 / 入口代理
# - PostgreSQL 单节点 + Pgpool 单节点
# - Redis 单节点 + Redis Proxy 单节点
# - MinIO 单节点 + MinIO 初始化
# - Elasticsearch 单节点
# - Kafka 单节点 + Kafka UI
# - Tika
# - OnlyOffice 8
# - Authverse 前后端
#
# 说明：
# - `docker/swarm/deploy-stack.sh` 不传模板名时默认使用这个文件。
# - 为了让 Cloudreve / Authverse / 运维脚本尽量复用现有连接关系，
#   这里保留了 `pgpool`、`redis-proxy`、`postgresql-1`、`kafka` 这些服务名。
# - `onlyoffice` 同样走外置 `pgpool + redis-proxy + onlyoffice-rabbitmq`，保证和多节点模板一致。

x-default-env: &default-env
  TZ: ${SWARM_TIMEZONE:-Asia/Shanghai}

x-localtime-volume: &localtime-volume
  type: ${SWARM_LOCALTIME_MOUNT_TYPE:-bind}
  source: ${SWARM_LOCALTIME_MOUNT_SOURCE:-/etc/localtime}
  target: /etc/localtime
  read_only: true

x-pki-volume: &pki-volume
  type: ${SWARM_PKI_MOUNT_TYPE:-bind}
  source: ${SWARM_PKI_MOUNT_SOURCE:-/srv/cloudreve/pki}
  target: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}
  read_only: true

x-default-logging: &default-logging
  driver: ${SWARM_LOGGING_DRIVER:-json-file}
  options:
    max-size: "${SWARM_LOGGING_MAX_SIZE:-20m}"
    max-file: "${SWARM_LOGGING_MAX_FILE:-5}"
    compress: "${SWARM_LOGGING_COMPRESS:-true}"

x-service-base: &service-base
  logging: *default-logging

x-stateful-update-config: &stateful-update-config
  order: stop-first

x-default-update-config: &default-update-config
  parallelism: 1
  order: ${SWARM_ROLLING_ORDER:-start-first}
  failure_action: rollback

x-delayed-update-config: &delayed-update-config
  <<: *default-update-config
  delay: 10s

x-default-rollback-config: &default-rollback-config
  parallelism: 1
  order: stop-first

x-default-restart-policy: &default-restart-policy
  condition: on-failure
  delay: 5s
  window: 2m

x-restart-policy-with-attempts: &restart-policy-with-attempts
  <<: *default-restart-policy
  max_attempts: 10

x-onlyoffice-restart-policy: &onlyoffice-restart-policy
  condition: on-failure
  delay: 10s
  max_attempts: 10
  window: 3m

services:
  cloudreve-master:
    <<: *service-base
    image: ${CLOUDREVE_IMAGE:-cloudreve/cloudreve:4.15.0}
    hostname: "{{.Node.Hostname}}-cr-master-{{.Task.Slot}}"
    environment:
      <<: *default-env
      SSL_CERT_FILE: ${CLOUDREVE_CA_CERT_FILE:-/run/swarm-pki/ca/ca.crt}
      SSL_CERT_DIR: ${CLOUDREVE_CA_CERT_DIR:-/run/swarm-pki/ca}
      CURL_CA_BUNDLE: ${CLOUDREVE_CA_CERT_FILE:-/run/swarm-pki/ca/ca.crt}
      CR_CONF_System.Mode: master
      CR_CONF_System.Listen: ":5212"
      CR_CONF_System.ProxyHeader: X-Forwarded-For
      CR_CONF_System.SessionSecret: ${CLOUDREVE_SESSION_SECRET:?set CLOUDREVE_SESSION_SECRET}
      CR_CONF_Database.Type: postgres
      CR_CONF_Database.Host: pgpool-internal
      CR_CONF_Database.Port: "5432"
      CR_CONF_Database.User: ${POSTGRESQL_USERNAME:-cloudreve}
      CR_CONF_Database.Password: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
      CR_CONF_Database.Name: ${POSTGRESQL_DATABASE:-cloudreve}
      CR_CONF_Redis.Server: ${CLOUDREVE_REDIS_ENDPOINT:-redis-proxy:6379}
      CR_CONF_Redis.Password: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      CR_CONF_Redis.UseTLS: ${CLOUDREVE_REDIS_USE_TLS:-true}
      CR_CONF_Redis.TLSSkipVerify: ${CLOUDREVE_REDIS_TLS_SKIP_VERIFY:-false}
      CR_CONF_Kafka.Enabled: ${CLOUDREVE_GLOBAL_KAFKA_ENABLED:-false}
      CR_CONF_Kafka.Brokers: ${CLOUDREVE_GLOBAL_KAFKA_BROKERS:-kafka:9092}
      CR_CONF_Kafka.Version: ${CLOUDREVE_GLOBAL_KAFKA_VERSION:-3.7.0}
      CR_CONF_Kafka.ClientID: ${CLOUDREVE_GLOBAL_KAFKA_CLIENT_ID:-cloudreve}
      CR_CONF_Kafka.SecurityProtocol: ${CLOUDREVE_GLOBAL_KAFKA_SECURITY_PROTOCOL:-SSL}
      CR_CONF_Kafka.TLSSkipVerify: ${CLOUDREVE_GLOBAL_KAFKA_TLS_SKIP_VERIFY:-false}
      CR_CONF_Kafka.TLSServerName: ${CLOUDREVE_GLOBAL_KAFKA_TLS_SERVER_NAME:-kafka}
      CR_CONF_Kafka.TLSCAPath: ${CLOUDREVE_GLOBAL_KAFKA_TLS_CA_PATH:-/run/swarm-pki/ca/ca.crt}
      CR_SETTING_DEFAULT_siteURL: ${CLOUDREVE_SITE_URL:?set CLOUDREVE_SITE_URL}
      CR_INIT_DEFAULT_STORAGE: ${CR_INIT_DEFAULT_STORAGE:-s3}
      CR_INIT_S3_ENDPOINT: ${CR_INIT_S3_ENDPOINT:-https://minio:9000}
      CR_INIT_S3_BUCKET: ${CR_INIT_S3_BUCKET:-cloudreve}
      CR_INIT_S3_ACCESS_KEY: ${CR_INIT_S3_ACCESS_KEY:-minio}
      CR_INIT_S3_SECRET_KEY: ${CR_INIT_S3_SECRET_KEY:?set CR_INIT_S3_SECRET_KEY}
      CR_INIT_S3_REGION: ${CR_INIT_S3_REGION:-us-east-1}
      CR_INIT_S3_FORCE_PATH_STYLE: ${CR_INIT_S3_FORCE_PATH_STYLE:-true}
      CR_INIT_S3_RELAY: ${CR_INIT_S3_RELAY:-true}
      CR_INIT_S3_INTERNAL_PROXY: ${CR_INIT_S3_INTERNAL_PROXY:-true}
      CR_INIT_S3_IS_PRIVATE: ${CR_INIT_S3_IS_PRIVATE:-true}
      CR_INIT_S3_CHUNK_SIZE: ${CR_INIT_S3_CHUNK_SIZE:-26214400}
    volumes:
      - *localtime-volume
      - *pki-volume
      - type: ${CLOUDREVE_MASTER_RUNTIME_MOUNT_TYPE:-volume}
        source: ${CLOUDREVE_MASTER_RUNTIME_MOUNT_SOURCE:-cloudreve_master_runtime}
        target: /cloudreve/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5212/api/v4/site/ping >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      replicas: 1
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${CLOUDREVE_MASTER_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${CLOUDREVE_MASTER_CPU_RESERVATION:-1.0}"
          memory: "${CLOUDREVE_MASTER_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${CLOUDREVE_MASTER_CPU_LIMIT:-2.0}"
          memory: "${CLOUDREVE_MASTER_MEM_LIMIT:-4G}"

  cloudreve-master-proxy:
    <<: *service-base
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    hostname: "{{.Node.Hostname}}-cr-master-proxy-{{.Task.Slot}}"
    environment:
      <<: *default-env
      SERVER_NAME: ${CLOUDREVE_MASTER_SERVER_NAME:-_}
      UPSTREAM_SERVICE: cloudreve-master:5212
      TLS_CERT_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/cloudreve-master-proxy/fullchain.crt
      TLS_KEY_PATH: ${SWARM_PKI_MOUNT_TARGET:-/run/swarm-pki}/services/cloudreve-master-proxy/tls.key
      CLIENT_MAX_BODY_SIZE: ${CLOUDREVE_MASTER_CLIENT_MAX_BODY_SIZE:-0}
      PROXY_READ_TIMEOUT: ${CLOUDREVE_MASTER_PROXY_READ_TIMEOUT:-3600s}
      PROXY_SEND_TIMEOUT: ${CLOUDREVE_MASTER_PROXY_SEND_TIMEOUT:-3600s}
    configs:
      - source: cloudreve_proxy_template_v3
        target: /etc/nginx/templates/default.conf.template
        mode: 0444
    ports:
      - target: 443
        published: ${CLOUDREVE_MASTER_HTTP_PORT:-18081}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O - https://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: 1
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${CLOUDREVE_MASTER_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${CLOUDREVE_MASTER_PROXY_CPU_RESERVATION:-0.25}"
          memory: "${CLOUDREVE_MASTER_PROXY_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${CLOUDREVE_MASTER_PROXY_CPU_LIMIT:-1.0}"
          memory: "${CLOUDREVE_MASTER_PROXY_MEM_LIMIT:-512M}"

  postgresql-1:
    <<: *service-base
    image: ${POSTGRESQL_REPMGR_IMAGE:-bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2}
    hostname: "{{.Node.Hostname}}-pg1"
    environment:
      <<: *default-env
      POSTGRESQL_POSTGRES_PASSWORD: ${POSTGRESQL_POSTGRES_PASSWORD:?set POSTGRESQL_POSTGRES_PASSWORD}
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE:-cloudreve}
      POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: ${POSTGRESQL_SINGLE_NODE_NUM_SYNCHRONOUS_REPLICAS:-0}
      REPMGR_PASSWORD: ${REPMGR_PASSWORD:?set REPMGR_PASSWORD}
      REPMGR_PRIMARY_HOST: postgresql-1
      REPMGR_PARTNER_NODES: ${REPMGR_SINGLE_NODE_PARTNER_NODES:-postgresql-1}
      REPMGR_NODE_NAME: postgresql-1
      REPMGR_NODE_NETWORK_NAME: postgresql-1
      REPMGR_ADVERTISE_HOST: postgresql-1
      REPMGR_NODE_ID: "1"
      REPMGR_LOG_LEVEL: NOTICE
    configs:
      - source: postgresql_repmgr_run_v4
        target: /opt/bitnami/scripts/postgresql-repmgr/run.sh
        mode: 0555
    volumes:
      - *localtime-volume
      - type: ${PG_1_DATA_MOUNT_TYPE:-bind}
        source: ${PG_1_DATA_MOUNT_SOURCE:?set PG_1_DATA_MOUNT_SOURCE}
        target: /bitnami/postgresql
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRESQL_USERNAME:-cloudreve} -d ${POSTGRESQL_DATABASE:-cloudreve} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 2m
    deploy:
      replicas: 1
      update_config: *stateful-update-config
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${PG_NODE_1_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${POSTGRESQL_CPU_RESERVATION:-2.0}"
          memory: "${POSTGRESQL_MEM_RESERVATION:-4G}"
        limits:
          cpus: "${POSTGRESQL_CPU_LIMIT:-4.0}"
          memory: "${POSTGRESQL_MEM_LIMIT:-8G}"

  pgpool-internal:
    <<: *service-base
    image: ${PGPOOL_IMAGE:-bitnamilegacy/pgpool:4.6.3-debian-12-r0}
    hostname: "{{.Node.Hostname}}-pgpool-internal"
    environment:
      <<: *default-env
      PGPOOL_BACKEND_NODES: ${PGPOOL_SINGLE_NODE_BACKEND_NODES:-0:postgresql-1:5432}
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: ${POSTGRESQL_POSTGRES_PASSWORD:?set POSTGRESQL_POSTGRES_PASSWORD}
      PGPOOL_SR_CHECK_USER: ${POSTGRESQL_USERNAME:-cloudreve}
      PGPOOL_SR_CHECK_PASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
      PGPOOL_ENABLE_LOAD_BALANCING: "no"
      PGPOOL_ENABLE_POOL_HBA: "yes"
      PGPOOL_ADMIN_USERNAME: ${PGPOOL_ADMIN_USERNAME:-admin}
      PGPOOL_ADMIN_PASSWORD: ${PGPOOL_ADMIN_PASSWORD:?set PGPOOL_ADMIN_PASSWORD}
      PGPOOL_USERNAME: ${POSTGRESQL_USERNAME:-cloudreve}
      PGPOOL_PASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
    volumes:
      - *localtime-volume
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/pgpool/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 2m
    deploy:
      replicas: 1
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${PGPOOL_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${PGPOOL_CPU_RESERVATION:-0.5}"
          memory: "${PGPOOL_MEM_RESERVATION:-512M}"
        limits:
          cpus: "${PGPOOL_CPU_LIMIT:-2.0}"
          memory: "${PGPOOL_MEM_LIMIT:-2G}"

  pgpool:
    <<: *service-base
    image: ${REDIS_PROXY_IMAGE:-haproxy:3.0-alpine}
    hostname: "{{.Node.Hostname}}-pgpool-public"
    environment: *default-env
    configs:
      - source: pgpool_public_tls_cfg_v2
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    ports:
      - target: 5432
        published: ${PGPOOL_PUBLIC_PORT:-15432}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    deploy:
      replicas: 1
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${PGPOOL_PUBLIC_NODE_CONSTRAINT:-${PGPOOL_NODE_CONSTRAINT:-node.platform.os==linux}}
      resources:
        reservations:
          cpus: "${PGPOOL_PUBLIC_CPU_RESERVATION:-0.25}"
          memory: "${PGPOOL_PUBLIC_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${PGPOOL_PUBLIC_CPU_LIMIT:-1.0}"
          memory: "${PGPOOL_PUBLIC_MEM_LIMIT:-512M}"

  redis-1:
    <<: *service-base
    image: ${REDIS_IMAGE:-bitnamilegacy/redis:8.2.1-debian-12-r0}
    hostname: "{{.Node.Hostname}}-redis1"
    environment:
      <<: *default-env
      ALLOW_EMPTY_PASSWORD: "no"
      REDIS_AOF_ENABLED: ${REDIS_AOF_ENABLED:-yes}
      REDIS_REPLICATION_MODE: master
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - *localtime-volume
      - type: ${REDIS_1_DATA_MOUNT_TYPE:-bind}
        source: ${REDIS_1_DATA_MOUNT_SOURCE:?set REDIS_1_DATA_MOUNT_SOURCE}
        target: /bitnami/redis/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?set REDIS_PASSWORD} ping | grep PONG >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 1
      update_config: *stateful-update-config
      restart_policy: *restart-policy-with-attempts
      placement:
        constraints:
          - ${REDIS_NODE_1_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${REDIS_CPU_RESERVATION:-1.0}"
          memory: "${REDIS_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${REDIS_CPU_LIMIT:-2.0}"
          memory: "${REDIS_MEM_LIMIT:-4G}"

  redis-proxy-internal:
    <<: *service-base
    image: ${REDIS_PROXY_IMAGE:-haproxy:3.0-alpine}
    hostname: "{{.Node.Hostname}}-redis-proxy-internal"
    environment:
      <<: *default-env
      REDIS_MASTER_HOST: ${REDIS_MASTER_HOST:-redis-1}
      REDIS_MASTER_PORT_NUMBER: ${REDIS_MASTER_PORT_NUMBER:-6379}
      REDIS_SENTINEL_ENABLED: "no"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-proxy-bootstrap.sh"]
    configs:
      - source: redis_proxy_bootstrap_v8
        target: /usr/local/bin/redis-proxy-bootstrap.sh
        mode: 0555
    volumes:
      - *localtime-volume
    networks:
      - cloudreve_backend
    deploy:
      replicas: 1
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *restart-policy-with-attempts
      placement:
        constraints:
          - ${REDIS_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${REDIS_PROXY_CPU_RESERVATION:-0.25}"
          memory: "${REDIS_PROXY_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${REDIS_PROXY_CPU_LIMIT:-1.0}"
          memory: "${REDIS_PROXY_MEM_LIMIT:-512M}"

  redis-proxy:
    <<: *service-base
    image: ${REDIS_PROXY_IMAGE:-haproxy:3.0-alpine}
    hostname: "{{.Node.Hostname}}-redis-proxy-public"
    environment: *default-env
    configs:
      - source: redis_public_tls_cfg_v2
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    ports:
      - target: 6379
        published: ${REDIS_PROXY_PUBLIC_PORT:-16379}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    deploy:
      replicas: 1
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *restart-policy-with-attempts
      placement:
        constraints:
          - ${REDIS_PROXY_PUBLIC_NODE_CONSTRAINT:-${REDIS_PROXY_NODE_CONSTRAINT:-node.platform.os==linux}}
      resources:
        reservations:
          cpus: "${REDIS_PROXY_PUBLIC_CPU_RESERVATION:-0.25}"
          memory: "${REDIS_PROXY_PUBLIC_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${REDIS_PROXY_PUBLIC_CPU_LIMIT:-1.0}"
          memory: "${REDIS_PROXY_PUBLIC_MEM_LIMIT:-512M}"

  minio-internal:
    <<: *service-base
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2024.10.2-debian-12-r0}
    hostname: "{{.Node.Hostname}}-minio-internal"
    environment:
      <<: *default-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_DISTRIBUTED_MODE_ENABLED: "no"
      MINIO_DATA_DIR: /bitnami/minio/data
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    entrypoint: ["/bin/bash", "/usr/local/bin/minio-swarm-entrypoint.sh"]
    configs:
      - source: minio_swarm_entrypoint_v1
        target: /usr/local/bin/minio-swarm-entrypoint.sh
        mode: 0555
    volumes:
      - *localtime-volume
      - type: ${MINIO_DATA_MOUNT_TYPE:-volume}
        source: ${MINIO_DATA_MOUNT_SOURCE:-minio_data}
        target: /bitnami/minio/data
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${MINIO_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${MINIO_CPU_RESERVATION:-1.0}"
          memory: "${MINIO_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${MINIO_CPU_LIMIT:-2.0}"
          memory: "${MINIO_MEM_LIMIT:-4G}"

  minio:
    <<: *service-base
    image: ${MINIO_PROXY_IMAGE:-haproxy:3.0-alpine}
    hostname: "{{.Node.Hostname}}-minio-public"
    environment: *default-env
    configs:
      - source: minio_public_tls_cfg_v2
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    ports:
      - target: 9000
        published: ${MINIO_API_PORT:-19000}
        protocol: tcp
        mode: ingress
      - target: 9001
        published: ${MINIO_CONSOLE_PORT:-19001}
        protocol: tcp
        mode: ingress
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    deploy:
      replicas: 1
      update_config: *default-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${MINIO_PUBLIC_NODE_CONSTRAINT:-${MINIO_NODE_CONSTRAINT:-node.platform.os==linux}}
      resources:
        reservations:
          cpus: "${MINIO_PUBLIC_CPU_RESERVATION:-0.25}"
          memory: "${MINIO_PUBLIC_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${MINIO_PUBLIC_CPU_LIMIT:-1.0}"
          memory: "${MINIO_PUBLIC_MEM_LIMIT:-512M}"

  minio-init:
    <<: *service-base
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2024.10.2-debian-12-r0}
    hostname: "{{.Node.Hostname}}-minio-init"
    environment:
      <<: *default-env
      MINIO_ENDPOINT: ${MINIO_INIT_ENDPOINT:-https://minio:9000}
      MINIO_CA_FILE: ${MINIO_INIT_CA_FILE:-/run/swarm-pki/ca/ca.crt}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-cloudreve}
      MINIO_INIT_INTERVAL_SECONDS: ${MINIO_INIT_INTERVAL_SECONDS:-30}
    entrypoint: ["/bin/bash", "/usr/local/bin/minio-init.sh"]
    configs:
      - source: minio_init_v1
        target: /usr/local/bin/minio-init.sh
        mode: 0555
    volumes:
      - *localtime-volume
      - *pki-volume
    networks:
      - cloudreve_backend
    deploy:
      replicas: 1
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${MINIO_INIT_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${MINIO_INIT_CPU_RESERVATION:-0.05}"
