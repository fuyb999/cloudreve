      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      replicas: ${AUTHVERSE_SINGLE_WEB_REPLICAS:-1}
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${AUTHVERSE_WEB_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${AUTHVERSE_WEB_CPU_RESERVATION:-0.25}"
          memory: "${AUTHVERSE_WEB_MEM_RESERVATION:-256M}"
        limits:
          cpus: "${AUTHVERSE_WEB_CPU_LIMIT:-1.0}"
          memory: "${AUTHVERSE_WEB_MEM_LIMIT:-512M}"

  authverse-backend:
    <<: *service-base
    image: ${AUTHVERSE_BACKEND_IMAGE:?set AUTHVERSE_BACKEND_IMAGE}
    hostname: "{{.Node.Hostname}}-authverse-backend"
    environment:
      <<: *default-env
      SPRING_PROFILES_ACTIVE: local
      JAVA_OPTS: ${AUTHVERSE_JAVA_OPTS:--Xms1g -Xmx2g -Djava.security.egd=file:/dev/./urandom}
      JAVA_TOOL_OPTIONS: ${AUTHVERSE_JAVA_TOOL_OPTIONS:--Djavax.net.ssl.trustStore=/run/swarm-pki/ca/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit}
      ARGS: >-
        --server.port=48080
        --server.forward-headers-strategy=framework
        --spring.datasource.dynamic.datasource.master.url=${AUTHVERSE_SINGLE_DB_MASTER_URL:?set AUTHVERSE_SINGLE_DB_MASTER_URL}
        --spring.datasource.dynamic.datasource.master.username=${AUTHVERSE_DB_USERNAME:?set AUTHVERSE_DB_USERNAME}
        --spring.datasource.dynamic.datasource.master.password=${AUTHVERSE_DB_PASSWORD:?set AUTHVERSE_DB_PASSWORD}
        --spring.datasource.dynamic.datasource.slave.url=${AUTHVERSE_SINGLE_DB_SLAVE_URL:?set AUTHVERSE_SINGLE_DB_SLAVE_URL}
        --spring.datasource.dynamic.datasource.slave.username=${AUTHVERSE_DB_SLAVE_USERNAME:?set AUTHVERSE_DB_SLAVE_USERNAME}
        --spring.datasource.dynamic.datasource.slave.password=${AUTHVERSE_DB_SLAVE_PASSWORD:?set AUTHVERSE_DB_SLAVE_PASSWORD}
        --spring.data.redis.host=${AUTHVERSE_SINGLE_REDIS_HOST:?set AUTHVERSE_SINGLE_REDIS_HOST}
        --spring.data.redis.port=${AUTHVERSE_SINGLE_REDIS_PORT:-6379}
        --spring.data.redis.password=${AUTHVERSE_REDIS_PASSWORD:?set AUTHVERSE_REDIS_PASSWORD}
        --spring.data.redis.database=${AUTHVERSE_REDIS_DATABASE:-0}
        --spring.data.redis.ssl.enabled=${AUTHVERSE_REDIS_SSL_ENABLED:-true}
        --spring.servlet.multipart.max-file-size=${AUTHVERSE_MAX_FILE_SIZE:-64MB}
        --spring.servlet.multipart.max-request-size=${AUTHVERSE_MAX_REQUEST_SIZE:-128MB}
        --yudao.tenant.enable=${AUTHVERSE_TENANT_ENABLED:-false}
        --yudao.web.admin-ui.url=${AUTHVERSE_PUBLIC_BASE_URL:?set AUTHVERSE_PUBLIC_BASE_URL}
        --yudao.cloudreve.base-uri=${AUTHVERSE_CLOUDREVE_PUBLIC_BASE_URL:?set AUTHVERSE_CLOUDREVE_PUBLIC_BASE_URL}
        --yudao.search.elasticsearch.enabled=${AUTHVERSE_ELASTICSEARCH_ENABLED:-true}
        --yudao.search.elasticsearch.uris[0]=${AUTHVERSE_SINGLE_ELASTICSEARCH_URI:?set AUTHVERSE_SINGLE_ELASTICSEARCH_URI}
        --yudao.search.elasticsearch.connection-timeout=${AUTHVERSE_ELASTICSEARCH_CONNECTION_TIMEOUT:-3s}
        --yudao.search.elasticsearch.socket-timeout=${AUTHVERSE_ELASTICSEARCH_SOCKET_TIMEOUT:-10s}
        --yudao.search.elasticsearch.connection-request-timeout=${AUTHVERSE_ELASTICSEARCH_CONNECTION_REQUEST_TIMEOUT:-3s}
        --yudao.oidc.enabled=${AUTHVERSE_OIDC_ENABLED:-true}
        --yudao.oidc.issuer=${AUTHVERSE_PUBLIC_BASE_URL:?set AUTHVERSE_PUBLIC_BASE_URL}
        --yudao.oidc.rsa.auto-generate=${AUTHVERSE_OIDC_RSA_AUTO_GENERATE:-false}
        --yudao.oidc.rsa.private-key-path=${AUTHVERSE_OIDC_PRIVATE_KEY_PATH:-classpath:oidc/private.pem}
        --yudao.oidc.rsa.public-key-path=${AUTHVERSE_OIDC_PUBLIC_KEY_PATH:-classpath:oidc/public.pem}
        --yudao.oidc.rsa.key-id=${AUTHVERSE_OIDC_KEY_ID:-oidc-rsa-key-prod}
        --yudao.oidc.callback.enabled=${AUTHVERSE_TOKEN_CALLBACK_ENABLED:-true}
        --yudao.oidc.callback.timeout=${AUTHVERSE_TOKEN_CALLBACK_TIMEOUT_MS:-5000}
        --yudao.oidc.callback.retry-times=${AUTHVERSE_TOKEN_CALLBACK_RETRY_TIMES:-3}
        --yudao.oidc.callback.retry-interval=${AUTHVERSE_TOKEN_CALLBACK_RETRY_INTERVAL_MS:-1000}
        --yudao.websocket.sender-type=${AUTHVERSE_WEBSOCKET_SENDER_TYPE:-redis}
    volumes:
      - *localtime-volume
      - *pki-volume
      - type: ${AUTHVERSE_OIDC_KEYS_MOUNT_TYPE:-volume}
        source: ${AUTHVERSE_OIDC_KEYS_MOUNT_SOURCE:-authverse_oidc_keys}
        target: /run/authverse/oidc
        read_only: true
    networks:
      - cloudreve_backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:48080/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 15m
    deploy:
      replicas: ${AUTHVERSE_SINGLE_BACKEND_REPLICAS:-1}
      update_config: *delayed-update-config
      rollback_config: *default-rollback-config
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${AUTHVERSE_BACKEND_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${AUTHVERSE_BACKEND_CPU_RESERVATION:-1.0}"
          memory: "${AUTHVERSE_BACKEND_MEM_RESERVATION:-2G}"
        limits:
          cpus: "${AUTHVERSE_BACKEND_CPU_LIMIT:-2.0}"
          memory: "${AUTHVERSE_BACKEND_MEM_LIMIT:-4G}"

networks:
  cloudreve_backend:
    driver: overlay
    driver_opts:
      encrypted: "true"
    attachable: false
    ipam:
      config:
        - subnet: ${CLOUDREVE_BACKEND_SUBNET:-10.20.0.0/24}

volumes:
  cloudreve_master_runtime:
  postgresql_1_data:
  redis_1_data:
  minio_data:
  elasticsearch_data:
  kafka_data:
  shared_custom_fonts:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_log:
  onlyoffice_rabbitmq:
  authverse_oidc_keys:

configs:
  cloudreve_proxy_template_v3:
    file: ./docker/swarm/nginx/cloudreve-proxy.conf.template
  authverse_proxy_template_v1:
    file: ./docker/swarm/nginx/authverse-proxy.conf.template
  postgresql_repmgr_run_v4:
    file: ./docker/swarm/postgresql-repmgr-run.sh
  redis_proxy_bootstrap_v8:
    file: ./docker/swarm/redis-proxy-bootstrap.sh
  pgpool_public_tls_cfg_v2:
    file: ./docker/swarm/haproxy/pgpool-public-tls.cfg
  redis_public_tls_cfg_v2:
    file: ./docker/swarm/haproxy/redis-public-tls.cfg
  minio_public_tls_cfg_v2:
    file: ./docker/swarm/haproxy/minio-public-tls.cfg
  elasticsearch_public_tls_cfg_v2:
    file: ./docker/swarm/haproxy/elasticsearch-public-tls.cfg
  kafka_single_proxy_cfg_v2:
    file: ./docker/swarm/haproxy/kafka-single.cfg
  http_tls_proxy_template_v2:
    file: ./docker/swarm/nginx/http-tls-proxy.conf.template
  onlyoffice_font_bootstrap_v1:
    file: ./docker/swarm/onlyoffice-font-bootstrap.sh
  minio_swarm_entrypoint_v1:
    file: ./docker/swarm/minio-swarm-entrypoint.sh
  minio_init_v1:
    file: ./docker/swarm/minio-init.sh
