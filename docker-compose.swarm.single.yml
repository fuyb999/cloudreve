      DB_USER: ${ONLYOFFICE_DB_USER:?set ONLYOFFICE_DB_USER}
      DB_PWD: ${ONLYOFFICE_DB_PASSWORD:?set ONLYOFFICE_DB_PASSWORD}
      DB_SCHEMA: ${ONLYOFFICE_DB_SCHEMA:-onlyoffice}
      AMQP_TYPE: rabbitmq
      AMQP_URI: amqp://${ONLYOFFICE_RABBITMQ_USER:-onlyoffice}:${ONLYOFFICE_RABBITMQ_PASSWORD:?set ONLYOFFICE_RABBITMQ_PASSWORD}@onlyoffice-rabbitmq:${ONLYOFFICE_RABBITMQ_PORT:-5672}/${ONLYOFFICE_RABBITMQ_VHOST:-onlyoffice}
      REDIS_SERVER_HOST: ${ONLYOFFICE_REDIS_HOST:-redis-proxy-internal}
      REDIS_SERVER_PORT: ${ONLYOFFICE_REDIS_PORT:-6379}
      REDIS_SERVER_PASS: ${ONLYOFFICE_REDIS_PASSWORD:?set ONLYOFFICE_REDIS_PASSWORD}
      REDIS_SERVER_DB: ${ONLYOFFICE_REDIS_DB:-1}
      ALLOW_PRIVATE_IP_ADDRESS: "${ONLYOFFICE_ALLOW_PRIVATE_IP_ADDRESS:-true}"
      JWT_ENABLED: ${ONLYOFFICE_JWT_ENABLED:-true}
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-replace-with-strong-onlyoffice-jwt-secret}
