    environment:
      <<: *default-env
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${KAFKA_SINGLE_NODE_ADVERTISED_LISTENER:-kafka:9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: ${KAFKA_SINGLE_NODE_CONTROLLER_BOOTSTRAP_SERVERS:-localhost:9093}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_SINGLE_NODE_CONTROLLER_QUORUM_VOTERS:-1@localhost:9093}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "${KAFKA_SINGLE_NODE_JVM_HEAP_OPTS:--Xms512m -Xmx512m}"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}"
      KAFKA_NUM_PARTITIONS: "${KAFKA_SINGLE_NODE_NUM_PARTITIONS:-1}"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "${KAFKA_SINGLE_NODE_DEFAULT_REPLICATION_FACTOR:-1}"
      KAFKA_MIN_INSYNC_REPLICAS: "${KAFKA_SINGLE_NODE_MIN_INSYNC_REPLICAS:-1}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "${KAFKA_SINGLE_NODE_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "${KAFKA_SINGLE_NODE_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "${KAFKA_SINGLE_NODE_TRANSACTION_STATE_LOG_MIN_ISR:-1}"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "${KAFKA_SINGLE_NODE_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/9092'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    volumes:
      - *localtime-volume
      - type: ${KAFKA_DATA_MOUNT_TYPE:-volume}
        source: ${KAFKA_DATA_MOUNT_SOURCE:-kafka_data}
        target: /var/lib/kafka/data
    networks:
      - cloudreve_backend
    deploy:
      replicas: 1
      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${KAFKA_NODE_CONSTRAINT:-node.platform.os==linux}
      resources:
        reservations:
          cpus: "${KAFKA_CPU_RESERVATION:-0.5}"
          memory: "${KAFKA_MEM_RESERVATION:-1G}"
        limits:
          cpus: "${KAFKA_CPU_LIMIT:-1.0}"
          memory: "${KAFKA_MEM_LIMIT:-2G}"

