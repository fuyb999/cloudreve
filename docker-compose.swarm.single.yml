      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: ${KAFKA_UI_TRUSTSTORE_LOCATION:-/run/swarm-pki/ca/truststore.p12}
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_UI_TRUSTSTORE_PASSWORD:-changeit}
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: ${KAFKA_UI_TRUSTSTORE_TYPE:-PKCS12}
    volumes:
