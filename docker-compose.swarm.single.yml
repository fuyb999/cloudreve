        target: /usr/local/bin/onlyoffice-font-bootstrap.sh
        mode: 0555
    volumes:
      - *localtime-volume
      - type: ${ONLYOFFICE_DATA_MOUNT_TYPE:-volume}
        source: ${ONLYOFFICE_DATA_MOUNT_SOURCE:-onlyoffice_data}
        target: /var/www/onlyoffice/Data
      - type: ${ONLYOFFICE_LIB_MOUNT_TYPE:-volume}
        source: ${ONLYOFFICE_LIB_MOUNT_SOURCE:-onlyoffice_lib}
        target: /var/lib/onlyoffice
      - type: ${ONLYOFFICE_LOG_MOUNT_TYPE:-volume}
        source: ${ONLYOFFICE_LOG_MOUNT_SOURCE:-onlyoffice_log}
