      restart_policy: *default-restart-policy
      placement:
        constraints:
          - ${ELASTICSEARCH_PUBLIC_NODE_CONSTRAINT:-${ELASTICSEARCH_NODE_CONSTRAINT:-node.platform.os==linux}}
      resources:
        reservations:
          cpus: "${ELASTICSEARCH_PUBLIC_CPU_RESERVATION:-0.25}"
          memory: "${ELASTICSEARCH_PUBLIC_MEM_RESERVATION:-256M}"
